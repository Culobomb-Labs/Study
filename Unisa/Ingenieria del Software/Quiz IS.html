  { c: "req", q: "Se formalizzando il modello emerge una lacuna, cosa si fa?", o: ["Si torna da cliente e utenti, si chiarisce e si aggiorna la specifica", "Si sceglie l'ipotesi più comoda e si va avanti", "Si rimanda il problema al test", "Si cancella il requisito"], e: "La formalizzazione costringe a decidere cosa significano le parole prima che diventino codice." },
  { c: "req", q: "L'accettazione del modello di analisi da parte del cliente significa che…", o: ["Il modello descrive il dominio e i comportamenti concordati", "I dettagli di implementazione sono già decisi", "Il sistema è pronto per il rilascio", "Non si potranno più cambiare i requisiti"], e: "Non fissa l'implementazione; i modelli restano collegati ai requisiti d'origine." },
  { c: "req", q: "Nella revisione del modello, cosa ti chiedi per ogni classe?", o: ["Se è necessaria a uno use case", "Se ha almeno dieci attributi", "Se è scritta in Java", "Se ha una sottoclasse"], e: "E per ogni operazione: chi la invoca e quale risultato produce." },

  { c: "uml", q: "Auto e Motore: composizione o aggregazione?", o: ["Dipende dal dominio: configuratore = composizione, officina = aggregazione", "Sempre composizione: il motore fa parte dell'auto", "Sempre aggregazione: il motore si può smontare", "Generalizzazione: il motore è un tipo di componente"], e: "Decide il dominio, non la realtà fisica." },

  { c: "uml", q: "Molteplicità 1..* nel codice: cosa deve garantire il costruttore?", o: ["Che ci sia almeno un elemento", "Che la lista sia vuota", "Che ci siano esattamente due elementi", "Niente di particolare"], e: "Un ordine con 1..* righe non deve mai essere vuoto." },
  { c: "uml", q: "Errore frequente: campo List<Auto> tra gli attributi e anche l'associazione verso Auto. Correzione?", o: ["Basta l'associazione con molteplicità 0..*", "Togliere l'associazione e tenere il campo", "Aggiungere una generalizzazione", "Trasformarla in composizione"], e: "È la stessa informazione scritta due volte." },

  { c: "uml", q: "Nel requisito della biblioteca, “il bibliotecario registra i nuovi utenti”: il bibliotecario è…", o: ["Un attore, non per forza una classe", "Sempre una classe entity", "Un'operazione", "Un attributo di Biblioteca"], e: "Abbott è un punto di partenza, non un algoritmo." },
  { c: "uml", q: "Che differenza c'è tra associazione e link?", o: ["L'associazione lega classi; il link lega due istanze concrete", "Sono sinonimi", "Il link lega classi; l'associazione istanze", "Il link è sempre una composizione"], e: "Il link è un'istanza dell'associazione." },

  { c: "dyn", q: "Lo stesso class diagram dell'ordine permette comportamenti diversi. Cosa decide chi calcola il totale?", o: ["Il sequence diagram", "Il class diagram", "Lo use case diagram", "Il package diagram"], e: "Il class diagram dice cosa è possibile; il sequence uno scenario concreto." },
  { c: "dyn", q: "“Chi possiede l'informazione esegue il calcolo” è il principio…", o: ["Information Expert", "Liskov", "Single fault", "Facade"], e: "Ordine.totale() chiama RigaOrdine.subtotale(), che chiede il prezzo al Prodotto." },
  { c: "dyn", q: "Qual è la sintassi completa di un messaggio?", o: ["[variabile =] nome(argomenti) [: valoreRitornato]", "nome: Tipo = valore", "visibilità nome(par: Tipo): Ritorno", "oggetto:Classe"], e: "Es. l = cercaLibro(isbn)." },
  { c: "dyn", q: "Regola d'oro sugli argomenti di un messaggio?", o: ["Ogni nome usato deve essere stato introdotto prima nel diagramma", "Gli argomenti devono essere sempre costanti", "Non si scrivono mai gli argomenti", "Ogni argomento deve essere una lifeline"], e: "Da un ritorno, un parametro o una lifeline." },

  { c: "dyn", q: "Quale frammento esegue degli operandi in parallelo?", o: ["par", "alt", "ref", "opt"], e: "break esce dal frammento, ref rimanda a un altro diagramma." },
  { c: "dyn", q: "Quale frammento rimanda a un altro diagramma?", o: ["ref", "par", "break", "loop"], e: "Utile per non ripetere interazioni già disegnate." },
  { c: "dyn", q: "Una barra di attivazione annidata sulla stessa lifeline indica…", o: ["Un messaggio a sé stessi mentre l'operazione esterna è ancora in corso", "La distruzione dell'oggetto alla fine della sua vita", "Un messaggio asincrono verso un altro oggetto", "Il ritorno del controllo al chiamante"], e: "Anche la ricorsione si disegna così." },
  { c: "dyn", q: "Quanti sequence diagram si fanno di solito per uno scenario?", o: ["Uno: un diagramma per scenario", "Uno per ogni classe", "Uno per l'intero sistema", "Tre, uno per tipo di oggetto"], e: "I flussi alternativi in diagrammi separati o con un alt." },
  { c: "dyn", q: "Un sistema di pagamento esterno nel modello BCE è…", o: ["Un boundary dedicato (es. BancaGateway)", "Un'entity", "Un control", "Un attore che parla con il control"], e: "Un boundary per ogni sistema esterno." },
  { c: "dyn", q: "Come si chiama di solito un control?", o: ["Nome del caso d'uso + Control (RichiediPrestitoControl)", "Nome dell'entity + Form", "Nome dell'attore + Page", "SistemaControl, uno per tutto il sistema"], e: "Un control unico per tutto il sistema è una god class." },
  { c: "dyn", q: "Se trovi un solo control per tutto il sistema, hai…", o: ["Una god class", "Un buon design", "Un pattern Facade", "Un'entity"], e: "Regola: un control per caso d'uso." },
  { c: "dyn", q: "Cos'è un robustness diagram?", o: ["Un disegno senza tempo di quali oggetti BCE partecipano e chi parla con chi", "Un sequence diagram con frammenti alt e loop", "Un test che prova input fuori dall'intervallo", "Un class diagram di progettazione con i tipi"], e: "Si fa in cinque minuti, prima del sequence." },
  { c: "dyn", q: "Un boundary può leggere un'entity?", o: ["Sì, per mostrarla", "No, mai", "Sì, e può anche modificarla", "Solo se lo crea il control"], e: "Modificarla al posto del control invece è vietato." },
  { c: "dyn", q: "Chi crea i boundary di conferma e di avviso?", o: ["Il control", "L'attore", "Le entity", "Il primo boundary"], e: "Il control lo crea il boundary iniziale; il control crea gli altri boundary." },
  { c: "dyn", q: "Il boundary verifica la disponibilità del libro. Che errore è?", o: ["Decisioni nel boundary: la logica andrà duplicata in ogni interfaccia", "Nessun errore: il boundary può decidere il flusso", "Un'entity che chiama un boundary dell'interfaccia", "Un unico control per tutto il sistema (god class)"], e: "Il boundary raccoglie e mostra; decide il control." },
  { c: "dyn", q: "Libro che apre un avviso viola la regola BCE perché…", o: ["Lega il dominio all'interfaccia: non è più riusabile", "Il libro non ha attributi per gestire l'avviso", "Gli avvisi non si modellano mai nel sequence", "Solo l'attore può creare gli avvisi"], e: "Un'entity non chiama mai boundary o control." },
  { c: "dyn", q: "“Blocca dopo tre tentativi”: chi ricorda i tentativi falliti?", o: ["Account «entity», con l'attributo tentativiFalliti", "LoginForm «boundary», che li mostra all'utente", "LoginControl «control», che vive solo nella sessione", "L'attore Utente, che sa quante volte ha sbagliato"], e: "Decide il control, registra l'entity, comunica il boundary." },
  { c: "dyn", q: "“Blocca dopo tre tentativi”: chi decide il blocco?", o: ["LoginControl «control»", "Account «entity»", "LoginForm «boundary»", "HomePage «boundary»"], e: "La decisione sul flusso del caso d'uso spetta al control." },
  { c: "dyn", q: "Ogni passo del caso d'uso ha i suoi messaggi e ogni messaggio il suo passo. È…", o: ["La tracciabilità tra requisiti e progetto", "Il principio di sostituzione di Liskov", "Il principio dell'Information Expert", "L'ipotesi di single fault del testing"], e: "La tabella passo → messaggi lo rende visibile." },
  { c: "dyn", q: "Nel class diagram, ogni messaggio ricevuto da un oggetto diventa…", o: ["Un'operazione della classe destinataria", "Un attributo del mittente", "Una nuova classe", "Un'associazione riflessiva"], e: "isDisponibile() deve comparire tra le operazioni di Libro." },
  { c: "dyn", q: "PrestitoControl invia messaggi a Libro. Cosa serve nel class diagram?", o: ["Un'associazione o una dipendenza tra le due classi", "Una generalizzazione da PrestitoControl a Libro", "Niente: i messaggi non hanno effetto sulle classi", "Una classe associativa tra le due classi"], e: "Chi comunica deve potersi raggiungere." },
  { c: "dyn", q: "Package boundary, control, entity: in che verso vanno le dipendenze?", o: ["boundary → control → entity; le entity non dipendono da nessuno", "entity → control → boundary; il boundary è indipendente", "In entrambi i versi tra tutti e tre i package", "Solo entity → boundary, per mostrare i dati"], e: "Cambiare interfaccia o fornitore esterno non tocca mai il dominio." },
  { c: "dyn", q: "In un sistema con LLM, dove si raggiunge il modello linguistico?", o: ["Da un boundary (gateway), dietro un'interfaccia", "Direttamente dalle entity che salvano i dati", "Dall'attore, senza passare dal sistema", "Da una classe del package entity"], e: "Cambiare fornitore o modello non tocca control ed entity." },
  { c: "dyn", q: "L'LLM propone un titolo di libro. Quando “esiste” per il sistema?", o: ["Se è nel catalogo (entity): le entity restano la verità", "Sempre, appena l'LLM lo nomina nella risposta", "Quando l'utente lo accetta nella chat", "Quando l'LLM lo ripete in due risposte"], e: "Il modello propone, il dominio decide." },
  { c: "dyn", q: "Come si modella un timeout nella chiamata a un LLM?", o: ["break [timeout] con una risposta di riserva", "Con un loop senza condizione di uscita", "Con un'entity Timeout salvata nel database", "Con un messaggio di distruzione del gateway"], e: "Il caso d'uso deve comunque terminare, con un messaggio onesto." },
  { c: "dyn", q: "Un agente IA che prende libri in prestito per l'utente: cosa cambia nel modello?", o: ["Un nuovo attore e un nuovo boundary, ma lo stesso control", "Un nuovo caso d'uso con un nuovo control", "Lo strumento scrive direttamente il Prestito", "Niente, l'agente è un'entity"], e: "Le regole (disponibilità, massimo cinque prestiti) valgono identiche." },
  { c: "dyn", q: "Una regola BCE come “le entity non dipendono da boundary e control” può diventare…", o: ["Un test d'architettura eseguibile (es. ArchUnit)", "Un requisito non funzionale del cliente", "Un frammento alt", "Una classe associativa"], e: "Ogni freccia vietata nel package diagram è un test." },
  { d: 59, c: "dyn", q: "Contratto di un'operazione: cos'è la precondizione?", o: ["Ciò che deve essere vero prima di invocarla", "Ciò che l'operazione garantisce dopo", "Ciò che vale sempre per ogni istanza", "Il valore restituito"], e: "Postcondizione = garantita dopo; invariante = sempre vera per la classe." },
  { c: "dyn", q: "“Un FieldOfficer non è assegnato a più di un Incident alla volta” è…", o: ["Un invariante di classe", "Una precondizione", "Una postcondizione", "Un frammento opt"], e: "Deve restare vero per ogni istanza in ogni stato valido." },
  { c: "dyn", q: "“Dopo l'assegnazione la risorsa risulta collegata all'Incident” è…", o: ["Una postcondizione", "Una precondizione", "Un invariante", "Una guardia"], e: "È ciò che l'operazione garantisce dopo l'esecuzione." },
  { c: "cp", q: "Perché una scelta [error] non si combina con le altre categorie?", o: ["Basta un solo test per verificare quel caso d'errore", "Perché un caso d'errore non si può testare", "Perché i vincoli [if] lo vietano sempre", "Perché genera troppi frame tutti validi"], e: "Combinarla con tutto moltiplicherebbe i frame senza aggiungere informazione." },
  { c: "cp", q: "Partizionare l'input “a mano” ha un difetto. Quale?", o: ["Manca di sistematicità", "Richiede di leggere il codice", "Non trova mai errori", "Genera sempre un solo test"], e: "Il category-partition dà un procedimento in passi precisi." },

  // 02 · Requisiti ed elicitation
  { c: "req", q: "Quali sono le tre tecniche per gestire la complessità?", o: ["Astrazione, decomposizione, gerarchia", "Analisi, design, testing", "Astrazione, ereditarietà, polimorfismo", "Decomposizione, integrazione, rilascio"], e: "Astrazione (solo l'essenziale), decomposizione (divide et impera), gerarchia (livelli di astrazione)." },
  { c: "req", q: "Decomposizione funzionale o object-oriented: quale porta a codice più difficile da manutenere?", o: ["Quella funzionale", "Quella object-oriented", "Sono equivalenti", "Nessuna delle due: dipende solo dal linguaggio"], e: "La decomposizione OO è più manutenibile: si parte dagli use case e poi si individuano gli oggetti." },
  { c: "req", q: "Qual è il procedimento giusto per scomporre il sistema?", o: ["Prima lo use case model (punto di vista dell'utente), poi l'object model", "Prima il codice, poi i diagrammi", "Prima l'object model, poi gli use case", "Prima il system design, poi i requisiti"], e: "Funzionalità viste dall'utente, poi gli oggetti." },
  { c: "req", q: "Cosa fa la tecnica della gerarchia (layering)?", o: ["Organizza il sistema in livelli, con dipendenze solo tra strati vicini", "Divide il problema in funzioni sempre più piccole", "Ignora i dettagli secondari", "Assegna una priorità a ogni requisito"], e: "Astrazione = ignorare i dettagli; decomposizione = divide et impera; gerarchia = livelli." },
  { c: "req", q: "Cosa produce la requirements elicitation?", o: ["Lo use case model e i requisiti non funzionali", "Il codice sorgente", "La scomposizione in sottosistemi", "I test case"], e: "L'analisi produce invece gli oggetti del dominio di applicazione (analysis object model + dynamic model)." },
  { c: "req", q: "Cosa produce la requirements analysis?", o: ["Gli oggetti del dominio di applicazione: analysis object model e dynamic model", "Lo use case model", "I sottosistemi", "Gli oggetti del dominio di implementazione"], e: "Gli oggetti del dominio di implementazione arrivano con l'object design." },
  { d: 49, c: "req", q: "Quale attività produce la scomposizione in sottosistemi?", o: ["Il system design", "L'object design", "La requirements elicitation", "Il testing"], e: "System design = architettura in sottosistemi. Object design = tipi, visibilità, contratti." },
  { c: "req", q: "In quale attività si aggiungono tipi, visibilità e contratti?", o: ["Nell'object design", "Nel system design", "Nella requirements analysis", "Nell'elicitation"], e: "L'object design produce gli oggetti del dominio di implementazione." },
  { c: "req", q: "Da cosa si ricavano la requirements specification e l'analysis model?", o: ["Dal problem statement scritto dal cliente", "Dal codice sorgente", "Dai test case", "Dal manuale utente"], e: "Requirements specification = linguaggio naturale (functional model + NFR); analysis model = UML (dynamic + analysis object model)." },
  { c: "req", q: "In che linguaggio è scritta la requirements specification?", o: ["In linguaggio naturale", "In UML", "In OCL", "In Java"], e: "L'analysis model invece usa una notazione formale o semiformale (UML)." },
  { c: "req", q: "Quanti sono gli ingredienti di un buon problem statement?", o: ["7", "5", "3", "9"], e: "Situazione attuale, funzionalità (scenari), requisiti, schedule, deliverables, ambiente target, criteri di accettazione." },
  { c: "req", q: "Nel problem statement, cosa sono i deliverables?", o: ["Gli artefatti che il cliente si aspetta di ricevere", "Le date di consegna", "I criteri del test di accettazione", "L'ambiente in cui girerà il sistema"], e: "Le date sono nello schedule; i criteri nei criteri di accettazione." },
  { c: "req", q: "Da cosa nasce di solito il problema descritto nel problem statement?", o: ["Da un cambiamento nel dominio applicativo o nel dominio della soluzione", "Da un errore nel codice esistente", "Da una richiesta degli sviluppatori", "Dalla scelta del linguaggio di programmazione"], e: "Es. un nuovo processo di business (applicativo) o una nuova tecnologia (soluzione)." },
  { c: "req", q: "Un progetto di re-engineering è attivato tipicamente da…", o: ["Un technology enabler", "I bisogni degli utenti senza sistema esistente", "Solo esigenze di marketing", "Un errore di validazione"], e: "Greenfield: bisogni dell'utente. Interface engineering: nuove tecnologie o esigenze di mercato." },
  { c: "req", q: "Nell'interface engineering cosa resta invariato?", o: ["Le funzionalità del sistema esistente", "L'interfaccia verso gli utenti", "L'interfaccia verso altri sistemi", "Nulla: si riscrive tutto"], e: "Si migliora solo l'interfaccia; riscrivere tutto con nuove tecnologie è re-engineering." },
  { c: "req", q: "Qual è la prima attività della requirements elicitation?", o: ["Identificare gli attori", "Identificare gli scenari", "Identificare gli oggetti partecipanti", "Identificare i requisiti non funzionali"], e: "Attori, scenari, use case, relazioni, raffinamento, requisiti non funzionali, oggetti partecipanti." },
  { c: "req", q: "\"Identificare gli attori\" è un'attività…", o: ["Della raccolta dei requisiti (elicitation)", "Dell'analisi dei requisiti", "Del system design", "Del testing"], e: "Trabocchetto d'esame: non è tra le 9 attività dell'analisi." },
  { d: 18, c: "req", q: "Quale di queste NON è un'attività dell'analisi dei requisiti?", o: ["Identificare gli attori", "Identificare gli oggetti Boundary", "Mappare gli use case con i sequence diagram", "Modellare le relazioni di ereditarietà"], e: "Gli attori si trovano nell'elicitation." },
  { c: "req", q: "Qual è la prima attività dell'analisi dei requisiti?", o: ["Identificare gli oggetti Entity", "Identificare gli attori", "Rivedere il modello di analisi", "Identificare gli attributi"], e: "Entity, Boundary, Control, sequence diagram, associazioni e aggregati, attributi, statechart, ereditarietà, revisione." },
  { c: "req", q: "Qual è l'ultima delle 9 attività dell'analisi?", o: ["Rivedere il modello di analisi", "Identificare gli oggetti Control", "Identificare gli attributi", "Scrivere il codice"], e: "Prima si costruisce il modello, poi lo si rivede (prima tra sviluppatori, poi col cliente)." },
  { c: "req", q: "Nel modello di analisi va bene la classe TimeZoneDatabase?", o: ["No: è una scelta di design; in analisi va il concetto del dominio TimeZone", "Sì, se il database esiste già", "Sì, sempre", "No: in analisi non ci sono classi"], e: "In analisi solo concetti del dominio dell'utente." },
  { c: "req", q: "Quali sono i 4 criteri per rivedere il modello di analisi?", o: ["Correttezza, completezza, consistenza, realismo", "Correttezza, completezza, consistenza, tracciabilità", "Usabilità, affidabilità, performance, supportabilità", "Specifico, misurabile, raggiungibile, tracciabile"], e: "La tracciabilità è il quinto criterio della validazione dei requisiti, non della revisione del modello." },
  { c: "req", q: "Revisione del modello: \"ogni oggetto è creato e usato in almeno uno use case?\" Quale criterio?", o: ["Completezza", "Correttezza", "Consistenza", "Realismo"], e: "Completezza: ogni oggetto, attributo e associazione serve davvero." },
  { c: "req", q: "Revisione del modello: due classi con lo stesso nome. Quale criterio è violato?", o: ["Consistenza", "Completezza", "Realismo", "Correttezza"], e: "Consistenza: niente nomi duplicati, niente concetti doppi, classi simili in gerarchia." },
  { c: "req", q: "Revisione del modello: le prestazioni richieste sono fattibili sull'hardware previsto? Quale criterio?", o: ["Realismo", "Correttezza", "Completezza", "Consistenza"], e: "Si verifica con studi o prototipi." },
  { c: "req", q: "Nella revisione dell'analisi, chi integra gli use case e i modelli dei diversi analisti?", o: ["L'architetto", "Il configuration manager", "L'utente finale", "Il reviewer"], e: "Integrazione: cliente e architetto. Generazione: utente finale e analista. Revisione: configuration manager e reviewer." },

  { c: "review", q: "A cosa servono le checklist nell'ispezione?", o: ["A tenere i meeting brevi ed efficaci, sugli errori più frequenti", "A sostituire il moderatore", "A registrare i tempi di lavoro", "A scegliere il linguaggio"], e: "Brevi e aggiornate di continuo." },
  { c: "review", q: "La code inspection tradizionale è…", o: ["Formale, manuale e sincrona", "Informale, basata su tool e asincrona", "Automatica", "Fatta solo dal cliente"], e: "Costosa: non si applica a ogni modifica." },
  { c: "review", q: "La modern code review è…", o: ["Informale, basata su tool e asincrona", "Formale, manuale e sincrona", "Sempre fatta in presenza", "Un test automatico"], e: "Es. GitHub, Microsoft CodeFlow." },
  { c: "review", q: "Perché nella modern code review non serve il recorder?", o: ["Perché è online e il tool tiene traccia dei commenti", "Perché non si trovano difetti", "Perché lo sostituisce il cliente", "Perché c'è il reader"], e: "Ed è di solito auto-moderata." },
  { c: "review", q: "Nella modern code review cosa si ispeziona?", o: ["Solo le nuove modifiche proposte (il diff)", "Tutto il codice del progetto a ogni review", "Solo la documentazione", "Solo i test"], e: "Con commenti sulle singole righe." },
  { c: "review", q: "Quale di questi NON è un obiettivo della modern code review?", o: ["Sostituire completamente il testing", "Trovare difetti", "Trasferire conoscenza", "Condividere la proprietà del codice"], e: "Obiettivi: difetti, miglioramenti, soluzioni alternative, knowledge transfer, team awareness, migliorare il processo, code ownership condivisa." },
  { c: "review", q: "\"Knowledge transfer\" nella code review significa…", o: ["Chi rivede impara il codice degli altri, e viceversa", "Spostare il codice in un altro repository", "Trasferire i diritti di merge", "Tradurre la documentazione"], e: "Insieme a team awareness e shared code ownership." },
  { c: "review", q: "Quale strumento è citato come esempio di modern code review in Microsoft?", o: ["CodeFlow", "Travis CI", "JUnit", "ArchUnit"], e: "Su GitHub la review avviene nelle pull request." },
  // ===== Deposito domande (PDF "Deposito domande a risposta chiusa/aperta"): d = numero nel deposito =====
  { d: 1, c: "cvs", q: "Si completi la frase: \"Un prototipo […]\"", o: ["Porta a un'implementazione più o meno incompleta che serve a comprendere i requisiti del sistema", "Porta sempre e comunque alla produzione completa di uno o più sottosistemi", "Porta sempre e comunque alla produzione completa dell'interfaccia utente", "Serve agli sviluppatori per dimostrare l'avanzamento ai project manager"], e: "Il prototipo serve a capire (e validare) i requisiti, non a consegnare pezzi completi." },
  { d: 2, c: "cvs", q: "Si completi la frase: \"Il modello a cascata […]\"", o: ["È un modello lineare, senza ricicli, che aiuta a tenere sotto controllo tempi e costi", "Consente di gestire i rischi di cattiva comprensione dei requisiti", "È stato il primo modello a prendere in considerazione la gestione dei rischi", "È facile da applicare ma non gode di buona trasparenza"], e: "La gestione dei rischi arriva con la spirale; la cascata è lineare e prevedibile." },
  { d: 3, c: "cvs", q: "Si completi la frase: \"Un processo software è un […]\"", o: ["Insieme organizzato di attività che sovrintendono alla costruzione del prodotto da parte del team", "Catalogo di standard, regolamenti e procedure per realizzare sottosistemi", "Metodo basato sulla prototipazione rapida per gestire i requisiti funzionali", "Catalogo di pratiche dei project manager per parlare con gli stakeholder"], e: "Processo = attività organizzate per costruire il prodotto." },
  { d: 4, c: "cvs", q: "Si completi la frase: \"Uno strumento Upper-CASE […]\"", o: ["Supporta l'analisi e la specifica dei requisiti, oltre alla progettazione", "Supporta l'interazione con gli stakeholder", "Supporta la progettazione di basso livello e l'implementazione", "Supporta verifica e convalida, in particolare il testing di accettazione"], e: "Upper = fasi alte (requisiti, analisi, progettazione). Lower = fasi basse (progettazione di dettaglio, codifica)." },
  { d: 5, c: "cvs", q: "Si completi la frase: \"Uno strumento Lower-CASE […]\"", o: ["Supporta la progettazione di basso livello, inclusa la selezione e l'implementazione di strumenti di riuso", "Supporta l'analisi e la specifica dei requisiti, oltre alla progettazione", "Supporta l'interazione con gli stakeholder", "Supporta verifica e convalida, in particolare il testing di accettazione"], e: "Attenzione: nel PDF del deposito la risposta segnata è uguale a quella dell'Upper-CASE, ma è un errore di copia. Lower-CASE = fasi basse." },
  { d: 6, c: "cvs", q: "Quale NON è una caratteristica/vantaggio dello sviluppo incrementale?", o: ["Tutte le funzionalità sono implementate subito, per poi essere raffinate", "Il rischio di fallimento è ridotto grazie ai continui rilasci", "I requisiti a priorità più alta sono quelli più testati", "I requisiti a priorità più alta vengono rilasciati per primi"], e: "Nell'incrementale si consegna un pezzo alla volta, partendo dai requisiti più importanti." },
  { d: 7, c: "scrum", q: "Quale delle seguenti meglio riflette la definizione di sprint in Scrum?", o: ["L'insieme di attività di progettazione, codifica e verifica di uno o più requisiti in un periodo di 2–4 settimane", "Lo sforzo del team per rilasciare il sistema nei tempi stabiliti col cliente", "La specifica dei requisiti che il team dovrà sviluppare", "Le attività con cui il team prioritizza i requisiti non funzionali"], e: "Lo sprint è un'iterazione a tempo fisso (timebox)." },
  { d: 34, c: "scrum", q: "Si completi la frase: \"Una user story […]\"", o: ["Rappresenta le esigenze degli utenti esprimendo in modo generale, non dettagliato, caratteristiche e funzioni del prodotto", "Definisce solo a chi è rivolto un requisito funzionale", "Porta sempre alla produzione di un prototipo throw-away", "Serve ai project manager per stimare costi e rischi dei requisiti non funzionali"], e: "\"Come <ruolo> voglio <funzione> per <beneficio>\": generale, non dettagliata." },
  { d: 9, c: "req", q: "Quale delle seguenti meglio riflette la definizione di manutenzione del software?", o: ["Uno stakeholder richiede modifiche a un sistema già esistente", "Lo sviluppo parte da zero, senza sistema preesistente", "Un sistema esistente deve essere adattato a una nuova tecnologia", "Un sistema esistente deve essere migrato in un diverso ambiente"], e: "Da zero = greenfield; nuova tecnologia = re-engineering." },
  { d: 10, c: "req", q: "Quale delle seguenti meglio riflette la definizione di re-engineering?", o: ["Un sistema esistente deve essere adattato a una nuova tecnologia", "Lo sviluppo parte da zero, senza sistema preesistente", "Un sistema esistente deve essere migrato in un diverso ambiente", "Uno stakeholder richiede modifiche a un sistema già esistente"], e: "Il re-engineering è attivato da un technology enabler." },
  { d: 13, c: "req", q: "Quale dei seguenti punti NON è descritto in un problem statement?", o: ["La specifica dei requisiti non funzionali", "La situazione corrente del problema da risolvere", "I deliverable attesi dagli stakeholder", "Le date di rilascio dei deliverable"], e: "Il problem statement è breve (1–2 pagine): la specifica dei requisiti arriva dopo, con elicitation e analisi." },
  { d: 14, c: "req", q: "Si completi la frase: \"Un vincolo […]\"", o: ["È una condizione imposta dal cliente o dall'ambiente in cui il sistema dovrà operare", "È un aspetto visibile all'utente ma non connesso al comportamento funzionale", "Descrive le interazioni tra utente e sistema", "È il limite massimo di risorse del team per realizzare i requisiti"], e: "Il primo distrattore è la definizione di requisito non funzionale." },
  { d: 27, c: "reqq", q: "Quale caratteristica dei requisiti funzionali, come tecnica di specifica, è FALSA?", o: ["Nessuna delle altre", "Un requisito funzionale dovrebbe essere tracciabile", "Un requisito funzionale dovrebbe essere realizzabile", "Un requisito funzionale dovrebbe essere specifico"], e: "Tracciabile, realizzabile e specifico sono tutte lettere di SMART: sono tutte vere." },
  { d: 15, c: "uc", q: "Quale linea guida sulla scrittura dei casi d'uso è FALSA?", o: ["Un caso d'uso dovrebbe descrivere un'interfaccia del sistema", "Il nome di un caso d'uso dovrebbe includere dei verbi", "Un caso d'uso dovrebbe descrivere una transazione utente completa", "Le relazioni causali tra i passi dovrebbero essere chiare"], e: "Il caso d'uso descrive cosa fa l'utente col sistema, non l'interfaccia grafica." },
  { d: 20, c: "uc", q: "Si completi la frase: \"Un caso d'uso è […]\"", o: ["Una modellazione delle funzionalità del sistema dal punto di vista dell'utente", "Una descrizione narrativa delle azioni e delle esperienze delle persone quando usano il sistema", "Usato esclusivamente per descrivere un sistema che verrà sviluppato in futuro", "Una descrizione delle azioni che gli sviluppatori compiranno per implementarlo"], e: "La descrizione narrativa è lo scenario." },
  { d: 24, c: "uc", q: "Si completi la frase: \"Uno scenario è […]\"", o: ["Una descrizione narrativa delle azioni e delle esperienze delle persone quando usano un sistema", "Usato esclusivamente per descrivere un sistema futuro", "Una modellazione sistematica del sistema dal punto di vista dell'utente", "Una descrizione delle azioni degli sviluppatori per implementarlo"], e: "La modellazione sistematica dal punto di vista dell'utente è il caso d'uso." },
  { d: 32, c: "uml", q: "Si completi la frase: \"Nella modellazione UML, una generalizzazione […]\"", o: ["Consente di organizzare concetti in gerarchie, identificando concetti astratti a partire da quelli di più basso livello", "Consente di identificare concetti più specifici a partire da quelli di più alto livello", "Consente di modellare la delega del lavoro di una classe a un'altra", "Consente di definire le molteplicità di un'associazione"], e: "Dal basso verso l'alto. L'opposto (dall'alto al basso) è la specializzazione. Nel PDF sono segnate due risposte: sono le due metà di questa." },
  { d: 35, c: "uml", q: "Quale euristica si usa per identificare le associazioni tra gli oggetti del dominio?", o: ["Esaminare i verbi nelle frasi", "Esaminare il soggetto delle frasi", "Esaminare i complementi oggetto", "Esaminare gli avverbi"], e: "Gestisce, scrive, riporta… sono associazioni." },
  { d: 16, c: "dyn", q: "Quale affermazione sui sequence diagram è FALSA?", o: ["La sequenza dei messaggi scambiati tra gli oggetti è mostrata su una linea verticale", "Descrivono le interazioni tra oggetti che collaborano per svolgere un compito", "Possono corrispondere a uno scenario specifico o a un intero caso d'uso", "Evidenziano la sequenza temporale delle azioni"], e: "Risposta del deposito: i messaggi sono frecce orizzontali tra le lifeline; è il tempo a scorrere dall'alto in basso." },
  { d: 23, c: "dyn", q: "Si completi la frase: \"Gli oggetti entity […]\"", o: ["Rappresentano l'informazione persistente (es. oggetti del dominio di applicazione)", "Rappresentano le interazioni tra attori e sistema", "Rappresentano le entità che useranno il sistema", "Realizzano gli use case e contengono la logica"], e: "Interazioni = boundary; logica = control; chi usa il sistema = attori." },
  { d: 60, c: "dyn", q: "Si completi la frase: \"Una postcondizione […]\"", o: ["È un predicato associato a un'operazione che deve essere vero dopo la sua invocazione", "È un predicato sempre vero per tutte le istanze", "È un predicato associato a un'operazione, vero prima dell'invocazione", "È un predicato associato a tutti i casi d'uso"], e: "La postcondizione è la garanzia dell'operazione." },
  { d: 36, c: "sd", q: "Si completi la frase: \"La metrica di coesione […]\"", o: ["Indica il grado di connessione tra gli elementi (metodi o classi) all'interno di una classe o di un sottosistema", "Indica il grado di connessione tra due generiche classi o sottosistemi", "Indica il grado di connessione tra due classi qualsiasi del sistema", "Indica il grado di connessione tra requisiti non funzionali e design goal"], e: "Coesione = dentro; accoppiamento = tra. Si vuole alta coesione e basso accoppiamento." },
  { d: 37, c: "sd", q: "Si completi la frase: \"La metrica di accoppiamento […]\"", o: ["Indica il grado di connessione tra due generiche classi o sottosistemi", "Indica il grado di connessione tra gli elementi all'interno di una classe o sottosistema", "Indica il grado di connessione tra una classe e la sua user story", "Indica il grado di connessione tra requisiti non funzionali e design goal"], e: "Basso accoppiamento: un cambio in un sottosistema tocca poco gli altri." },
  { d: 38, c: "sd", q: "Si completi la frase: \"In un'architettura software chiusa […]\"", o: ["I sottosistemi di un livello possono accedere solo a quelli del livello immediatamente inferiore", "I sottosistemi di un livello possono accedere a qualunque livello inferiore", "I sottosistemi del livello centrale accedono a tutti gli altri", "I sottosistemi accedono solo a quelli dello stesso livello"], e: "Chiusa (opaca): solo il livello sotto. Aperta (trasparente): qualunque livello sotto." },
  { d: 39, c: "sd", q: "Si completi la frase: \"In un'architettura software aperta […]\"", o: ["I sottosistemi di un livello possono accedere a quelli di qualunque livello inferiore", "I sottosistemi possono accedere solo al livello immediatamente inferiore", "I sottosistemi del livello centrale accedono a tutti gli altri", "I sottosistemi accedono solo a quelli dello stesso livello"], e: "Più efficiente, ma più accoppiata." },
  { d: 40, c: "sd", q: "Quale attività è collegata al mapping hardware/software?", o: ["Gestione e comunicazione dei nodi dell'applicazione", "Identificazione degli oggetti persistenti", "Identificazione e gestione dei processi concorrenti", "Gestione di come gli utenti accedono alle funzionalità"], e: "Persistenti = gestione dei dati; accesso degli utenti = controllo degli accessi." },
  { d: 41, c: "sd", q: "Quale affermazione sul deployment diagram è FALSA?", o: ["Mostra le dipendenze tra componenti e interfacce dei sottosistemi", "Mostra il mapping hardware/software", "Mostra la struttura del sistema a run-time", "Usa box 3-D che rappresentano i nodi"], e: "Le dipendenze tra componenti e interfacce sono nel component diagram." },
  { d: 42, c: "sd", q: "Quale proprietà NON è associata alla maintainability di un sistema?", o: ["Robustezza", "Estensibilità", "Adattabilità", "Leggibilità"], e: "La robustezza è un criterio di dependability (affidabilità), non di manutenibilità." },
  { d: 43, c: "sd", q: "Quale affermazione sull'architettura Model-View-Controller è VERA?", o: ["Il Controller accede e modifica una singola struttura dati implementata nel Model", "La View può richiedere e fornire servizi al Model", "È particolarmente adatta a processori geograficamente separati", "Nessuna delle altre opzioni"], e: "MVC è un caso particolare di repository: il Model è la struttura dati centrale." },
  { d: 44, c: "sd", q: "Quale affermazione sull'architettura MVC è FALSA?", o: ["L'aggiornamento delle View avviene attraverso messaggi dai Controller", "MVC è un caso particolare dell'architettura Repository", "I Model mantengono la conoscenza del dominio", "MVC è appropriata per i sistemi interattivi"], e: "Le View sono avvisate dal Model (Observer), non dal Controller." },
  { d: 45, c: "sd", q: "Si completi la frase: \"I design goal […]\"", o: ["Descrivono le qualità del sistema che uno sviluppatore dovrebbe ottimizzare", "Sono i requisiti non funzionali del sistema", "Indicano come mappare le componenti sui nodi hardware", "Sono template di soluzioni per problemi ricorrenti"], e: "Derivano dai requisiti non funzionali, ma non coincidono con essi. I template sono i design pattern." },
  { d: 46, c: "sd", q: "Si completi la frase: \"Le interfacce dei sottosistemi […]\"", o: ["Descrivono i servizi offerti da un sottosistema agli altri sottosistemi", "Mappano i requisiti non funzionali sui design goal", "Descrivono l'hardware necessario a un sottosistema", "Forniscono template di soluzioni ricorrenti"], e: "Interfaccia = operazioni dei servizi (API)." },
  { d: 47, c: "sd", q: "Quale affermazione sul layering è FALSA?", o: ["Organizza i sottosistemi come peer che si forniscono servizi a vicenda", "Permette ai sottosistemi di un livello superiore di usare i servizi di un livello inferiore", "Organizza il sistema come una gerarchia di sottosistemi", "Nessuna delle opzioni"], e: "I peer che si servono a vicenda sono il partitioning (o peer-to-peer), non il layering." },
  { d: 48, c: "sd", q: "Si completi la frase: \"In un'architettura client/server […]\"", o: ["Gli utenti interagiscono solo con il client", "I client non conoscono i servizi offerti dal server", "I server conoscono le interfacce dei client", "Il flusso di controllo nei client e nei server è vincolato"], e: "Il client conosce l'interfaccia del server; il server non conosce i client; i flussi di controllo sono indipendenti." },
  { d: 50, c: "sd", q: "Si completi la frase: \"Un servizio è […]\"", o: ["Un insieme di operazioni correlate fornite da un sottosistema per uno specifico scopo", "Un metodo implementato in una classe Java", "Un insieme di operazioni fornite da un nodo hardware", "Descritto in termini di prototipi"], e: "Il servizio si concretizza nell'interfaccia del sottosistema." },
  { d: 51, c: "sd", q: "Si completi la frase: \"Nella gestione della memorizzazione, i file […]\"", o: ["Necessitano dell'aggiunta di codice per fornire un opportuno livello di astrazione", "Consentono un recupero elastico delle informazioni", "Non supportano operazioni di basso livello", "Nessuna delle precedenti"], e: "I file sono di basso livello: per usarli serve codice che li astragga (al contrario dei database)." },
  { d: 57, c: "sd", q: "Quale affermazione sul flusso di controllo procedure-driven è VERA?", o: ["I controlli risiedono nel codice del programma", "Il sistema crea un numero arbitrario di thread, uno per evento", "Il controllo risiede in un dispatcher che chiama le funzioni", "Il ciclo principale attende un evento esterno"], e: "Thread = threads; dispatcher e ciclo che attende eventi = event-driven." },
  { d: 53, c: "map", q: "Quale delle seguenti meglio riflette la definizione di reverse engineering?", o: ["Una trasformazione che consente al codice sorgente di essere rappresentato con un modello a oggetti", "Una trasformazione che migliora il codice senza cambiarne il comportamento", "Una trasformazione che mappa il modello a oggetti sul codice", "Una trasformazione che semplifica il modello a oggetti"], e: "Reverse: dal codice al modello." },
  { d: 61, c: "map", q: "Quale attività NON è associata all'object design?", o: ["Convalida dell'adeguatezza delle operazioni rispetto ai requisiti", "Definizione della visibilità di attributi e operazioni", "Definizione di tipi e signature", "Specifica di vincoli e contratti"], e: "La convalida rispetto ai requisiti è validazione, non object design." },
  { d: 62, c: "riuso", q: "Quale strumento NON abilita il riuso durante l'object design?", o: ["Modellazione logica", "Ereditarietà", "Composizione", "Design pattern"], e: "Si riusa con ereditarietà, composizione (delega) e design pattern." },
  { d: 64, c: "riuso", q: "Quali strumenti si usano per il riuso durante l'object design?", o: ["Ereditarietà, composizione, design pattern", "JavaDoc e documentazione", "Reverse engineering ed euristiche", "Modello logico e mapping hardware/software"], e: "Domanda gemella della precedente." },
  { d: 66, c: "test", q: "Quale affermazione sul testing è FALSA?", o: ["Fornisce la prova che il programma si comporta correttamente per tutti i possibili input", "Dovrebbe essere affiancato da altre tecniche di verifica, come le ispezioni", "Può mostrare la presenza di difetti, non la loro assenza", "È una tecnica dinamica che esegue il programma con input scelti e confronta atteso e osservato"], e: "Dijkstra: il testing mostra la presenza dei bug, non la loro assenza." },
  { d: 68, c: "test", q: "Si completi la frase: \"Una failure […]\"", o: ["È l'errore visualizzato da un utente in caso di fallimento del sistema", "È il risultato di un errore nella documentazione o nel codice", "È un'implementazione parziale dei componenti da cui dipende quello testato", "È un insieme di input e risultati attesi"], e: "L'insieme di input e risultati attesi è un test case; l'implementazione parziale è uno stub." },
  { d: 70, c: "its", q: "Quale affermazione sul testing di unità è vera?", o: ["Nessuna delle altre opzioni", "È fatto dagli sviluppatori per verificare l'integrazione dei sottosistemi", "È fatto dagli utenti per verificare la comprensibilità", "È fatto dagli sviluppatori usando esclusivamente il white-box"], e: "Verifica le singole unità (classi, componenti), con tecniche sia black-box sia white-box." },
  { d: 69, c: "its", q: "Quale meglio riflette la tecnica di integrazione top-down?", o: ["Si integrano prima i sottosistemi in alto nella gerarchia, poi quelli più in basso", "Si integrano prima i sottosistemi in basso, poi quelli più in alto", "Il sistema è visto come tre layer con il centrale come target", "Tutti i sottosistemi vengono integrati insieme"], e: "Top-down usa gli stub al posto dei livelli bassi." },
  { d: 75, c: "its", q: "Si completi la frase: \"Un test driver […]\"", o: ["È un'implementazione parziale di una componente che dipende dalla componente testata", "È un'implementazione parziale di componenti da cui la componente testata dipende", "È un'implementazione parziale dei requisiti da rilasciare", "È un'implementazione parziale di un intero sottosistema"], e: "Driver = chi chiama (sopra); stub = chi è chiamato (sotto)." },
  { d: 76, c: "its", q: "Si completi la frase: \"Un test stub […]\"", o: ["È un'implementazione parziale di componenti da cui la componente testata dipende", "È un'implementazione parziale di una componente che dipende da quella testata", "È un'implementazione parziale dei requisiti da rilasciare", "È un'implementazione parziale di un intero sottosistema"], e: "Lo stub sostituisce ciò che la componente usa." },
  { d: 176, c: "its", q: "Quale affermazione sull'impatto dei requisiti sulle attività di testing è FALSA?", o: ["Il mapping hardware/software influenza lo unit testing", "La specifica degli use case influenza il functional testing", "La decomposizione in sottosistemi influenza lo structural testing", "I requisiti non funzionali e i vincoli influenzano il performance testing"], e: "Il mapping hardware/software riguarda i test di sistema (installazione, configurazione), non le singole unità." },
  { d: 71, c: "cp", q: "Qual è il principale vantaggio del category partition?", o: ["Esplicita le relazioni semantiche tra le variabili, evitando casi di test concettualmente irrilevanti", "Permette di testare il codice in modo esaustivo", "Ottimizza il numero di stub e driver", "Nessuna delle altre opzioni"], e: "Vincoli come [error], [single], [property]/[if] tolgono le combinazioni senza senso." },
  { d: 77, c: "wb", q: "Quale dei seguenti è un tipo di white-box testing?", o: ["Path testing", "Sequence testing", "Boundary testing", "Method testing"], e: "Il boundary testing è black-box." },
  { d: 78, c: "bb", q: "Qual è il principale svantaggio dell'equivalence class testing?", o: ["Non permette di esplorare le combinazioni dei dati di input", "Non verifica i requisiti non funzionali", "È eccessivamente costoso", "Nessuna delle altre opzioni"], e: "Per le combinazioni servono il weak/strong o il category partition." },
  { d: 178, c: "wb", q: "Si completi la frase: \"La metrica di line coverage […]\"", o: ["Indica la percentuale di linee di codice eseguite durante i test", "Misura l'efficienza di un algoritmo", "Valuta la qualità dell'architettura del system design", "Quantifica il numero di failure del sistema"], e: "Linee eseguite / linee totali." },
  { d: 79, c: "sd", q: "Descrivi brevemente le attività del system design, soffermandoti sul mapping hardware/software: quali scelte si fanno e come si rappresentano in UML?", o: ["Attività: identificare i design goal; decomporre il sistema in sottosistemi; mapping hardware/software; gestione dei dati persistenti; controllo degli accessi; flusso di controllo globale; condizioni limite (avvio, spegnimento, guasti); revisione. Nel mapping hardware/software si sceglie la configurazione hardware e la piattaforma (quanti e quali nodi, sistema operativo, middleware), si assegnano i componenti software ai nodi e si decide come i nodi comunicano (protocolli, connessioni, cosa passa sulla rete). In UML si usa il deployment diagram: i nodi sono box 3-D, dentro si mettono i componenti e le linee tra i nodi sono le connessioni; il component diagram mostra invece componenti e dipendenze tra le loro interfacce."], e: "Ricorda le 8 attività e che il mapping si disegna con il deployment diagram." },
  { d: 80, c: "dp", q: "Descrivi il design pattern Adapter, con un problema di progettazione in cui adottarlo.", o: ["Adapter è un pattern strutturale che converte l'interfaccia di una classe esistente (Adaptee) in quella che il client si aspetta (Target). Il client chiama Target; l'Adapter implementa Target e inoltra le richieste all'Adaptee (con la delega, o con l'ereditarietà nella versione a classe). Serve quando una classe esistente, che non si può o non si vuole modificare (libreria, sistema legacy), ha un'interfaccia incompatibile. Esempio: il sistema usa un'interfaccia Pagamento con paga(importo), e va integrato il servizio di un fornitore che espone invia(cifra, valuta): un PagamentoAdapter implementa Pagamento e chiama invia."], e: "Adapter: interfacce che esistono già. Bridge: separazione progettata in anticipo." },
  { d: 81, c: "dp", q: "Descrivi il design pattern Observer, con un problema di progettazione in cui adottarlo.", o: ["Observer è un pattern comportamentale per una dipendenza uno-a-molti: quando un oggetto (Subject) cambia stato, tutti gli oggetti che dipendono da lui (Observer) vengono avvisati e si aggiornano. Il Subject mantiene la lista degli observer con attach/detach e, quando cambia, chiama notify, che invoca update su ciascuno; gli observer poi leggono lo stato (pull) o lo ricevono nel messaggio (push). Subject e observer restano poco accoppiati. Esempio: in MVC il Model è il Subject e le View sono observer, così più viste degli stessi dati (tabella e grafico) si aggiornano da sole."], e: "Esempio classico: Model e View in MVC." },
  { d: 82, c: "bb", q: "Descrivi le principali differenze tra testing black-box e testing white-box.", o: ["Il black-box considera il sistema una scatola nera: i casi di test si ricavano dalla specifica (casi d'uso, requisiti), guardando solo input e output attesi; verifica cosa il sistema dovrebbe fare. Tecniche: classi di equivalenza, boundary value analysis, robustness, category partition. Il white-box guarda la struttura interna del codice: i test si scelgono per esercitarne i percorsi; verifica cosa il codice fa davvero. Criteri: statement, branch, path coverage, complessità ciclomatica. Il black-box non trova codice in più o percorsi non previsti; il white-box non trova funzionalità mancanti rispetto alla specifica: per questo si usano insieme."], e: "Black-box: dalla specifica. White-box: dal codice." },
  { d: 83, c: "sd", q: "Descrivi la decomposizione in sottosistemi, con riferimento alle metriche di coesione e accoppiamento.", o: ["La decomposizione divide il sistema in sottosistemi: gruppi di classi che forniscono servizi agli altri tramite un'interfaccia. Serve a ridurre la complessità e a dividere il lavoro tra i team. Si valuta con due metriche: la coesione misura quanto sono legati gli elementi dentro un sottosistema (deve essere alta: classi che lavorano sullo stesso scopo stanno insieme); l'accoppiamento misura quanto i sottosistemi dipendono l'uno dall'altro (deve essere basso: un cambiamento in uno tocca poco gli altri). Si organizza con il layering (livelli; architettura chiusa o aperta) e il partitioning (sottosistemi alla pari), e con stili come repository, MVC, client/server."], e: "Alta coesione, basso accoppiamento." },
  { d: 84, c: "dp", q: "Descrivi il design pattern Facade, con un problema di progettazione in cui adottarlo.", o: ["Facade è un pattern strutturale che fornisce un'unica interfaccia semplice per usare un insieme di oggetti che compongono un sottosistema. Il client parla solo con la Facade, che inoltra le richieste alle classi interne: diminuisce l'accoppiamento e permette un'architettura chiusa, perché il sottosistema si può cambiare senza toccare i client. Esempio: un sottosistema di prenotazione con classi Volo, Hotel, Pagamento e Notifica; una PrenotazioneFacade offre prenotaViaggio(...) e coordina le classi interne."], e: "Una facciata davanti a un sottosistema intero." },
  { d: 85, c: "dp", q: "Descrivi il design pattern Proxy, con un problema di progettazione in cui adottarlo.", o: ["Proxy è un pattern strutturale: un oggetto sostituto (Proxy) con la stessa interfaccia dell'oggetto reale (RealSubject) ne controlla l'accesso; il client non vede la differenza. Usa ereditarietà di interfaccia (stessa interfaccia) e delega (inoltra al reale). Tipi: virtual proxy (crea l'oggetto costoso solo quando serve), remote proxy (rappresenta un oggetto su un'altra macchina), protection proxy (controlla i permessi), cache. Esempio: una galleria mostra subito le miniature e un ImmagineProxy carica l'immagine ad alta risoluzione solo quando l'utente la apre."], e: "Stessa interfaccia del reale, accesso controllato." },
  { d: 86, c: "its", q: "Descrivi la strategia di integrazione sandwich, con punti di forza e limiti.", o: ["Il sistema è visto come tre layer: si sceglie un layer target in mezzo; sopra si integra top-down (con gli stub) e sotto bottom-up (con i driver), convergendo sul target. Punti di forza: il livello alto (logica e interfaccia) e il livello basso si testano in parallelo, presto e con meno stub e driver che nelle strategie pure. Limite: il layer target non viene testato da solo prima dell'integrazione. Il sandwich modificato risolve il problema testando prima i tre layer singolarmente (in parallelo) e poi combinati, ma costa di più."], e: "Top-down sopra, bottom-up sotto, convergendo sul target." },
  { d: 87, c: "bb", q: "Definisci il testing di unità e descrivi weak e strong equivalence class testing, con le differenze.", o: ["Il testing di unità verifica le singole unità del sistema (classi, metodi, componenti) in isolamento, usando driver e stub; lo fanno gli sviluppatori, con tecniche black-box e white-box. Nell'equivalence class testing gli input si dividono in classi in cui il programma dovrebbe comportarsi allo stesso modo. Weak (WECT): ogni classe di ogni variabile compare almeno in un test, quindi i test sono tanti quante le classi della variabile con più classi. Strong (SECT): si prova ogni combinazione di classi, cioè il prodotto cartesiano (es. 3 e 5 classi: WECT 5 test, SECT 15). Lo strong è più completo ma cresce in fretta; il weak è economico ma non esplora le combinazioni."], e: "WECT = massimo numero di classi; SECT = prodotto." },
  { d: 88, c: "cp", q: "Descrivi il category partition, con punti di forza e campi di utilizzo.", o: ["È un metodo sistematico (Ostrand e Balcer, 1988) per i test funzionali, a partire dalla specifica. Passi: si scompone la specifica in unità funzionali testabili; per ognuna si individuano parametri e oggetti dell'ambiente; si definiscono le categorie (caratteristiche dei parametri) e le scelte (choices) di ogni categoria; si aggiungono vincoli ([error], [single], [property] / [if]) per eliminare combinazioni impossibili o inutili; si generano le test frame e poi i casi di test concreti. Punti di forza: è sistematico, esplicita le relazioni semantiche tra le variabili ed evita casi di test irrilevanti, tenendo basso il numero di test. Si usa nel testing funzionale (black-box) di unità e di sistema, a partire da specifiche in linguaggio naturale."], e: "Vantaggio chiave: i vincoli tolgono le combinazioni senza senso." },
  { d: 89, c: "sd", q: "Definisci coesione e accoppiamento e spiega come si usano per suddividere il sistema in sottosistemi.", o: ["La coesione misura il grado di connessione tra gli elementi (metodi, classi) all'interno di una classe o di un sottosistema; l'accoppiamento misura il grado di connessione tra due classi o sottosistemi. Un buon design ha alta coesione e basso accoppiamento. Nella suddivisione si mettono nello stesso sottosistema le classi che collaborano molto (aumenta la coesione) e si riducono le dipendenze tra sottosistemi, esponendo solo interfacce e usando layer chiusi o una Facade (diminuisce l'accoppiamento). Spesso c'è un compromesso: più sottosistemi piccoli aumentano la coesione ma anche il numero di interfacce."], e: "Coesione = dentro, accoppiamento = tra." },
  { d: 90, c: "uml", q: "Descrivi come si usa l'euristica di Abbott nell'analisi dei requisiti.", o: ["L'euristica di Abbott parte dal testo dei requisiti (problem statement, scenari, casi d'uso) e associa le parti del discorso ai componenti del modello a oggetti: nome proprio → istanza (Alice); nome comune → classe (FieldOfficer); verbo d'azione → operazione (crea, invia); verbo essere / \"è un tipo di\" → ereditarietà; verbo avere / \"consiste di\" → aggregazione; aggettivo o frase possessiva → attributo. Si usa soprattutto per trovare i candidati Entity e le loro relazioni, poi si filtrano e si classificano (Entity, Boundary, Control). Vantaggio: usa i termini dell'utente. Svantaggi: è impreciso e dipende dallo stile di scrittura del testo, quindi va sempre rivisto con la conoscenza del dominio."], e: "Nomi → classi/istanze, verbi → operazioni/relazioni, aggettivi → attributi." },
  // Domande della prova intercorso del 5 novembre 2026 (tema A): x: 1 le fa entrare nella simulazione
  { x: 1, c: "dyn", q: "Durante la revisione del modello di analisi, quale di queste domande aiuta a verificare la completezza?", o: ["Per ogni oggetto: in quale use case è creato, modificato o distrutto?", "Gli oggetti Entity e Boundary hanno nomi significativi?", "Ci sono classi con lo stesso nome?", "Le richieste di performance possono essere soddisfatte?"], e: "Cross-checking: per ogni oggetto ti chiedi quale use case lo crea, lo modifica, lo usa e lo distrugge, per verificare completezza e correttezza. Nomi e classi omonime riguardano la consistenza, le performance il realismo." },
  { x: 1, c: "uml", q: "Nel modello di analisi, le associazioni tra oggetti:", o: ["Rappresentano la struttura e le relazioni tra gli oggetti", "Sono sempre bidirezionali", "Devono essere definite solo per gli oggetti Entity", "Devono sempre avere una molteplicità fissa di 1 a 1"], e: "Le associazioni collegano gli oggetti e ne mostrano struttura e relazioni. Non sono sempre bidirezionali, non riguardano solo gli Entity e la molteplicità può essere qualsiasi (1:1, 1:N, N:M)." },
  { x: 1, c: "req", q: "Qual è il principale vantaggio della formalizzazione dei requisiti?", o: ["Costringe a risolvere subito questioni difficili e individuare errori nelle richieste", "Permette di evitare completamente gli errori nel software", "Elimina la necessità di coinvolgere il cliente nel processo", "Permette di scrivere codice più velocemente"], e: "La formalizzazione costringe il team a decidere che cosa significano le parole e a fare domande prima che ipotesi non dichiarate diventino codice. Non elimina gli errori e non sostituisce il cliente." },
  { x: 1, c: "dyn", q: "Quale tecnica è comunemente utilizzata per identificare gli oggetti Entity?", o: ["Euristica di Abbott", "Analisi statica del codice sorgente", "Test di regressione", "Diagrammi ER"], e: "Abbott lavora sul testo dei requisiti: nomi comuni → classi, nomi propri → istanze, verbi → operazioni. Le altre sono tecniche che riguardano il codice o il testing." },
  { x: 1, c: "req", q: "Qual è la differenza principale tra requisiti funzionali e non funzionali?", o: ["I requisiti funzionali descrivono ciò che il sistema deve fare, mentre i non funzionali descrivono le qualità del sistema", "I requisiti funzionali si riferiscono all'efficienza, mentre i non funzionali riguardano la sicurezza", "I requisiti funzionali sono opzionali, mentre i non funzionali sono obbligatori", "I requisiti non funzionali descrivono solo i vincoli hardware"], e: "Funzionali = interazioni tra sistema e ambiente (cosa fa). Non funzionali = qualità e vincoli (FURPS+), non solo hardware. Nessuno dei due gruppi è opzionale." },
  { x: 1, c: "uc", q: "Perché gli scenari sono utili nella raccolta dei requisiti?", o: ["Perché aiutano a comprendere meglio l'uso del sistema da parte degli utenti", "Perché descrivono i dettagli tecnici del sistema", "Perché sostituiscono completamente la specifica dei requisiti", "Perché evitano la necessità di fare test di accettazione"], e: "Lo scenario racconta un caso concreto d'uso con le parole dell'utente, così cliente e sviluppatori si capiscono. Non descrive dettagli tecnici e non sostituisce la specifica." },
  { x: 1, c: "cvs", q: "Qual è la differenza tra verifica e validazione?", o: ["La verifica controlla l'aderenza alle specifiche, la validazione verifica che il sistema soddisfi i bisogni dell'utente", "La verifica controlla l'aderenza ai requisiti funzionali, la validazione verifica che il sistema soddisfi i casi di test definiti in fase di pianificazione dei test", "La verifica viene effettuata staticamente, ad esempio tramite code review, mentre la validazione viene condotta eseguendo i casi di test", "Non esiste una differenza significativa"], e: "Verifica = il prodotto è costruito nel modo giusto (rispetta la specifica). Validazione = è il prodotto giusto (serve al cliente). Trucco: Validazione = Volontà del cliente." },
  { x: 1, c: "uc", q: "Quale relazione tra casi d'uso viene usata per modellare una funzionalità opzionale che si attiva solo in determinate condizioni?", o: ["Extend", "Include", "Generalization", "Association"], e: "Extend = comportamento opzionale, che si attiva solo a certe condizioni. Include = comportamento sempre eseguito dal caso d'uso base." },
  { x: 1, c: "req", q: "Quale tra i seguenti è un problema tipico nella raccolta dei requisiti?", o: ["Ambiguità nella definizione dei requisiti", "Eccessiva disponibilità di informazioni", "Presenza di un unico stakeholder", "Sovrabbondanza di requisiti funzionali"], e: "Nella raccolta i problemi tipici sono requisiti ambigui, incompleti o in conflitto tra stakeholder diversi: non l'eccesso di informazioni né l'avere un solo stakeholder." },
  { x: 1, c: "sd", q: "Quale delle seguenti affermazioni è vera riguardo ai criteri di coupling e cohesion nei sottosistemi?", o: ["Un basso coupling consente ai sottosistemi di essere più indipendenti e ridurre l'impatto dei cambiamenti", "Un alto coupling tra i sottosistemi è desiderabile per migliorare la scalabilità del sistema", "Un sottosistema con bassa coesione è più efficiente perché può eseguire più operazioni diverse", "Il coupling non influisce sulla manutenibilità del software"], e: "Coesione alta, accoppiamento basso: sottosistemi indipendenti, modifiche che non si propagano." },
  { x: 1, c: "sd", q: "Cosa si intende per condizioni limite in un sistema?", o: ["Il comportamento del sistema in condizioni di avvio, arresto e gestione delle eccezioni", "I vincoli di tempo imposti dal cliente", "Le restrizioni sulle tecnologie utilizzate", "Le performance minime richieste"], e: "Condizioni limite = avvio, spegnimento e gestione dei guasti; diventano nuovi casi d'uso limite." },
  { x: 1, c: "reqq", q: "Quale delle seguenti caratteristiche appartiene ai requisiti di supportabilità nel modello FURPS+?", o: ["La capacità di adattarsi a nuovi concetti nel dominio applicativo", "La gestione delle transazioni nel database", "La velocità con cui un server può elaborare le richieste", "Il tempo medio tra due guasti del sistema"], e: "Supportability = facilità di modifica dopo il rilascio (adattabilità, manutenibilità). Velocità = Performance; tempo medio tra guasti = Reliability. Trabocchetto: la portabilità (es. più sistemi operativi) non è una lettera di FURPS, sta dentro Supportability secondo ISO 9126." },
  { x: 1, c: "sd", q: "Quale strategia è comunemente utilizzata per il controllo del flusso in un sistema?", o: ["Event-driven control", "Hardcoding dei percorsi di esecuzione", "Disattivazione del multithreading", "Eliminazione della concorrenza"], e: "Flusso di controllo globale: procedure-driven, event-driven o thread. Nell'event-driven un main loop aspetta un evento e lo passa all'oggetto giusto." },
  { x: 1, c: "dyn", q: "Quale delle seguenti affermazioni, riferite ai sequence diagram, è corretta?", o: ["Un sequence diagram consente di identificare oggetti mancanti e/o aree non chiare nelle specifiche.", "Un sequence diagram è più intuitivo degli use case dalla prospettiva degli utenti.", "Un sequence diagram è adatto alla comunicazione con il cliente.", "Un sequence diagram consente di modellare il comportamento statico del sistema software."], e: "Il sequence diagram serve agli sviluppatori per assegnare responsabilità e trovare oggetti mancanti o zone poco chiare della specifica. Non è per il cliente ed è dinamico, non statico." },
  { x: 1, c: "req", q: "Qual è il principale obiettivo della validazione dei requisiti?", o: ["Assicurarsi che i requisiti siano corretti, completi e consistenti", "Implementare il sistema in modo più rapido", "Evitare di coinvolgere il cliente nel processo di sviluppo", "Garantire che i requisiti siano scritti in linguaggio tecnico"], e: "Si validano correttezza, completezza, consistenza, realismo e tracciabilità, con il cliente coinvolto." },
