<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quiz di Ingegneria del Software</title>
<meta name="description" content="Domande a risposta multipla sui capitoli 01–09 di Ingegneria del Software, per la prima prova.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: una colonna di lettura. Scelta del capitolo → una domanda alla volta → risultato con gli errori da rivedere.
   Colore del corso (viola) per l'avanzamento, verde/rosso solo per giusto/sbagliato. */
:root{
  --bg:#f6f6f4; --surface:#ffffff; --ink:#111418; --muted:#5d636b; --line:#dcdddb; --soft:#efefec;
  --c:var(--ua-c-is,#5b3fa3); --c-soft:#ece7f8;
  --ok:#22744a; --ok-bg:#e3f2e9; --ko:#b3261e; --ko-bg:#fbe9e7;
  --f-display:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1012; --surface:#15181b; --ink:#eceef0; --muted:#9aa1a9; --line:#272b30; --soft:#1c2024;
  --c-soft:#251f38; --ok:#6fd398; --ok-bg:#15291e; --ko:#ff8a80; --ko-bg:#33191a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1012; --surface:#15181b; --ink:#eceef0; --muted:#9aa1a9; --line:#272b30; --soft:#1c2024;
  --c-soft:#251f38; --ok:#6fd398; --ok-bg:#15291e; --ko:#ff8a80; --ko-bg:#33191a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
a{color:inherit}
.wrap{max-width:780px;margin:0 auto;padding-block:40px 80px;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-mono);font-size:12.5px;color:var(--c);letter-spacing:.02em}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(32px,6vw,48px);line-height:1.02;letter-spacing:-.02em;margin:8px 0 12px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 28px;max-width:60ch}
button{font:inherit;color:inherit}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.opt:focus-visible,.chap:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.solid:hover{opacity:.88}
.btn[disabled]{opacity:.4;cursor:default}
.label{font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 10px}

/* scelta */
.sim{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 20px;align-items:center;padding:20px;border-radius:10px;
  background:var(--ink);color:var(--bg);margin-bottom:30px}
.sim h2{font-family:var(--f-display);font-size:22px;margin:0}
.sim p{margin:0;opacity:.75;font-size:14.5px}
.sim .tot{font-family:var(--f-mono);font-size:12.5px;opacity:.65}
.sim .tot b{font-weight:600}
.sim .btn{grid-row:1 / span 3;grid-column:2;background:var(--bg);color:var(--ink);border-color:var(--bg)}
.chaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.chap{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 16px;cursor:pointer;
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;transition:border-color .15s,transform .15s}
.chap:hover{border-color:var(--c);transform:translateY(-1px)}
.chap .n{grid-row:1 / span 4;font-family:var(--f-mono);font-weight:500;color:var(--c);font-size:14px;padding-top:2px}
.chap .t{font-weight:600;line-height:1.3}
.chap .t,.chap .s{grid-column:2}
.chap .s{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chap .s b{font-weight:500;color:var(--ok)}
.chap .s b.mid{color:var(--c)}
.chap .m{grid-column:2;height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:8px}
.chap .m i{display:block;height:100%;background:var(--ok);border-radius:2px}
.note{margin-top:22px;color:var(--muted);font-size:14px}

/* domanda */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.qhead a{color:var(--muted)}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-bottom:26px}
.bar i{display:block;height:100%;width:0;background:var(--c);transition:width .3s}
.tag{display:inline-block;font-family:var(--f-mono);font-size:12px;color:var(--c);background:var(--c-soft);border-radius:999px;padding:3px 10px;margin-bottom:12px}
.q{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,3.6vw,25px);line-height:1.3;margin:0 0 20px;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{appearance:none;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:13px 16px;cursor:pointer;
  display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--muted)}
.opt .k{font-family:var(--f-mono);font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:6px;text-align:center;line-height:22px;height:24px}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .k{border-color:var(--ok);color:var(--ok)}
.opt.wrong{border-color:var(--ko);background:var(--ko-bg)}
.opt.wrong .k{border-color:var(--ko);color:var(--ko)}
.opt.dim{opacity:.55}
.fb{margin-top:18px;padding:14px 16px;border-radius:10px;border-left:3px solid var(--c);background:var(--surface)}
.fb b.ok{color:var(--ok)} .fb b.ko{color:var(--ko)}
.fb p{margin:4px 0 0}
.fb a{font-size:14px;color:var(--c);text-underline-offset:3px}
.next{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.hint{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:14px;text-align:right}

/* risultato */
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.score b{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.score span{color:var(--muted)}
.verdict{margin:0 0 24px;font-size:17px}
.byc{list-style:none;margin:0 0 28px;padding:0;border-top:1px solid var(--line)}
.byc li{display:grid;grid-template-columns:minmax(0,1fr) 120px 52px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.byc .m{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.byc .m i{display:block;height:100%;background:var(--c)}
.byc .v{font-family:var(--f-mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.errs{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
.err{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--surface)}
.err .eq{font-weight:600;margin:0 0 6px}
.err p{margin:4px 0 0;font-size:14.5px;color:var(--muted)}
.err p b{color:var(--ink);font-weight:600}
.err .yours{color:var(--ko)}
.err a{font-size:14px;color:var(--c)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
body.running .lede{display:none}
@media (hover:none),(max-width:640px){.hint{display:none}}
@media (max-width:560px){.sim{grid-template-columns:1fr}.sim .btn{grid-row:auto;grid-column:1;justify-self:start;margin-top:8px}.byc li{grid-template-columns:minmax(0,1fr) 70px 46px}}
@media (prefers-reduced-motion:reduce){.chap,.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Ingegneria del Software · prima prova</div>
  <h1>Quiz di Ingegneria del Software</h1>
  <p class="lede">Domande a risposta multipla sui capitoli 01–09, quelli della prima prova. Ogni risposta ha la spiegazione e il link al punto del quaderno da ripassare.</p>
  <main id="app" aria-live="polite"></main>
</div>

<script>
/* Domande: c = capitolo (id della sezione nel quaderno), q = domanda, o = opzioni (la PRIMA è quella giusta,
   vengono mescolate a ogni giro), e = spiegazione. Tutto preso dal Quaderno di Ingegneria del Software. */
const CHAPTERS = [
  { id: "cvs", n: "01", t: "Ciclo di vita del software" },
  { id: "scrum", n: "02", t: "Scrum" },
  { id: "minuta", n: "03", t: "Riunioni e minuta" },
  { id: "uml", n: "04", t: "UML: use case e classi" },
  { id: "state", n: "05", t: "Statechart, activity e package" },
  { id: "req", n: "06", t: "Requisiti ed elicitation" },
  { id: "reqq", n: "07", t: "Scrivere buoni requisiti" },
  { id: "uc", n: "08", t: "Scenari e casi d'uso" },
  { id: "dyn", n: "09", t: "Modello dinamico e sequence" }
];
const Q = [
  // 01 · Ciclo di vita
  { c: "cvs", q: "Qual è la differenza tra ciclo di vita e ciclo di sviluppo del software?", o: ["Il ciclo di sviluppo va dalla decisione di sviluppare alla consegna ed è una parte del ciclo di vita", "Il ciclo di vita va dalla decisione di sviluppare alla consegna, il ciclo di sviluppo comprende anche la manutenzione", "Sono sinonimi", "Il ciclo di sviluppo comprende il ritiro del prodotto, il ciclo di vita no"], e: "Il ciclo di vita (IEEE 610.12) va dall'idea al ritiro, uso e manutenzione inclusi. Il ciclo di sviluppo è solo il tratto dalla decisione di sviluppare alla consegna." },
  { c: "cvs", q: "Quale macro-fase è spesso la più lunga e costosa?", o: ["Manutenzione", "Codifica", "Analisi dei requisiti", "Test di integrazione"], e: "La manutenzione (il \"dopo\": correggere, adattare, aggiungere funzioni) è spesso la fase più lunga e costosa." },
  { c: "cvs", q: "\"Stiamo costruendo il prodotto giusto?\" è la domanda di…", o: ["Validazione", "Verifica", "α-test", "Ispezione del codice"], e: "Validazione = il prodotto giusto, cioè quello che serve al cliente. Verifica = il prodotto nel modo giusto, cioè rispetta la specifica (Boehm)." },
  { c: "cvs", q: "\"Il prodotto rispetta la specifica?\" riguarda…", o: ["La verifica", "La validazione", "Il β-test", "Lo studio di fattibilità"], e: "Verifica: \"stiamo costruendo il prodotto nel modo giusto?\", cioè conforme alla specifica." },
  { c: "cvs", q: "Nel modello a V, il test di accettazione corrisponde a…", o: ["L'analisi dei requisiti", "Il progetto di sistema", "Il progetto di dettaglio", "La codifica"], e: "Requisiti ↔ accettazione, progetto di sistema ↔ test di sistema, progetto di dettaglio ↔ test di unità e integrazione." },
  { c: "cvs", q: "Qual è il problema principale del modello a cascata?", o: ["È rigido: servono requisiti chiari subito e gli errori nei requisiti si scoprono tardi", "Produce poca documentazione", "Rende difficile controllare tempi e costi", "Coinvolge il cliente troppo spesso"], e: "La cascata è semplice e pianificabile, con molta documentazione, ma il cliente vede il prodotto solo alla fine e gli errori nei requisiti costano tantissimo." },
  { c: "cvs", q: "Chi esegue il β-test?", o: ["Utenti veri, fuori dall'azienda", "Gli sviluppatori, in casa", "Un tool automatico di unit test", "Il Product Owner"], e: "α-test: fatto in casa dagli sviluppatori. β-test: fatto da utenti veri, fuori." },
  { c: "cvs", q: "Cosa si fa con un prototipo usa e getta (throw-away)?", o: ["Si butta dopo aver capito i requisiti, poi si sviluppa il prodotto in modo classico", "Si raffina fino a farlo diventare il prodotto finale", "Si consegna al cliente come prima release", "Si usa come specifica formale"], e: "\"Il prototipo deve essere gettato!\" Quello che diventa prodotto finale è il prototipo esplorativo/evolutivo." },
  { c: "cvs", q: "Un mock-up è un prototipo che contiene…", o: ["Solo l'interfaccia, senza logica dietro", "Solo la logica, senza interfaccia vera", "La specifica matematica del sistema", "Componenti COTS già esistenti"], e: "Mock-up = solo interfaccia. Breadboard = solo logica, senza interfaccia vera." },
  { c: "cvs", q: "Perché il modello a spirale di Boehm è detto meta-modello?", o: ["Perché, in base ai rischi, ogni giro può comportarsi come un altro modello (cascata, prototipo…)", "Perché descrive i metadati del progetto", "Perché è il primo modello storico da cui derivano gli altri", "Perché ignora l'analisi dei rischi"], e: "È guidato dal rischio: se i rischi sono bassi e i requisiti chiari ogni giro è una cascata, se l'interfaccia è incerta ogni giro è un prototipo." },
  { c: "cvs", q: "Quale di questi NON è un quadrante della spirale?", o: ["Rilascio e ritiro del prodotto", "Determinare obiettivi, alternative e vincoli", "Valutare le alternative e risolvere i rischi", "Pianificare il giro successivo"], e: "I 4 quadranti: obiettivi e vincoli · alternative e rischi · sviluppo e verifica · pianificazione della fase successiva." },
  { c: "cvs", q: "Quale di queste NON è una delle 12 regole di XP?", o: ["Scrivere la documentazione completa prima del codice", "Pair programming", "40 ore di lavoro a settimana", "Proprietà collettiva del codice"], e: "XP: iterazioni velocissime, refactoring, progettare al minimo, cliente presente, integrazione continua… niente documentazione completa in anticipo." },
  { c: "cvs", q: "Per quali sistemi è adatto il modello a trasformazioni formali?", o: ["Sistemi critici (safety critical)", "Interfacce grafiche da esplorare col cliente", "Progetti con requisiti che cambiano spesso", "Sistemi costruiti assemblando COTS"], e: "Si scrive una specifica matematica e la si trasforma in codice con passi che preservano la correttezza: adatto ai sistemi critici." },
  { c: "cvs", q: "Il modello incrementale…", o: ["Consegna il prodotto in più rilasci, ognuno aggiunge funzioni", "Ripete lo stesso ciclo raffinando ogni volta tutto il sistema", "Assembla componenti già esistenti", "Trasforma una specifica formale in codice"], e: "Incrementale = più rilasci, ognuno con nuove funzioni (utile anche se il cliente non ha subito i soldi per tutto). Iterativo = si ripete il ciclo raffinando tutto il sistema." },

  // 02 · Scrum
  { c: "scrum", q: "Chi decide le priorità del product backlog?", o: ["Il Product Owner", "Lo ScrumMaster", "Il team", "Il cliente finale, direttamente nello sprint backlog"], e: "Il Product Owner definisce le funzionalità, le ordina per valore e accetta o rifiuta il lavoro." },
  { c: "scrum", q: "Lo ScrumMaster è…", o: ["Un facilitatore: fa rispettare Scrum, rimuove gli ostacoli, protegge il team", "Il capo del team che assegna i task", "Chi decide cosa entra nel prodotto", "Il responsabile dei test"], e: "Non è un capo: è un facilitatore." },
  { c: "scrum", q: "Quali sono le 3 domande del daily scrum?", o: ["Cosa ho fatto ieri? Cosa farò oggi? Ho ostacoli?", "Cosa abbiamo consegnato? Cosa manca? Chi è in ritardo?", "Cosa iniziare, smettere e continuare a fare?", "Quante ore restano? Quanti story point? Quale priorità?"], e: "15 minuti, in piedi, ogni giorno. Non serve a risolvere problemi né è un report al capo. Start/Stop/Continue è la retrospective." },
  { c: "scrum", q: "Differenza tra sprint review e sprint retrospective?", o: ["Review = il prodotto (demo); retrospective = come abbiamo lavorato (il processo)", "Review = il processo; retrospective = la demo", "Sono la stessa cerimonia con due nomi", "La retrospective si fa prima della review"], e: "La review mostra cosa si è fatto (demo informale, niente slide). La retrospective, dopo, riflette sul processo: Start, Stop, Continue." },
  { c: "scrum", q: "Team di 6 persone, 8 ore al giorno, sprint di 10 giorni, focus factor 0,7. Capacità reale?", o: ["336 ore", "480 ore", "288 ore", "384 ore"], e: "6 × 8 × 10 = 480 ore teoriche; 480 × 0,7 = 336 ore da pianificare." },
  { c: "scrum", q: "Team di 5 persone, 8 ore, sprint di 10 giorni, focus factor 0,6. Capacità reale?", o: ["240 ore", "400 ore", "300 ore", "320 ore"], e: "5 × 8 × 10 = 400 ore teoriche; 400 × 0,6 = 240 ore reali. Pianificare tutte le 400 sarebbe un disastro." },
  { c: "scrum", q: "Quando conviene un focus factor basso (vicino a 0,6)?", o: ["Team nuovo, prima volta con Scrum o dominio complesso", "Team esperto che lavora solo su questo progetto", "Sprint molto lunghi", "Quando il Product Owner è sempre presente"], e: "Basso se il team è nuovo, usa Scrum per la prima volta, il dominio è complesso o le persone sono su più progetti. Oltre 0,8 è rischioso." },
  { c: "scrum", q: "Cosa misura la velocity?", o: ["Gli story point consegnati in uno sprint", "Le ore lavorate dal team", "Quanto è bravo il team", "Il numero di bug risolti"], e: "È uno strumento di pianificazione, non un voto. Chiedere più velocity porta solo a \"inflazione\" degli story point." },
  { c: "scrum", q: "Durante lo sprint, chi può modificare lo sprint backlog?", o: ["Solo il team", "Solo il Product Owner", "Lo ScrumMaster", "Il cliente"], e: "Lo sprint backlog è il sottoinsieme scelto per lo sprint, spezzato in task: durante lo sprint lo modifica solo il team." },
  { c: "scrum", q: "Un burndown \"up to the sky\" (che sale invece di scendere) indica…", o: ["Task aggiunti ogni giorno senza progressi, tipico del primo sprint", "Il team ha finito prima del previsto", "Il team non aggiorna i progressi", "Uno sprint ideale"], e: "Too early = finiscono prima; let's have a rest = linea piatta, nessun aggiornamento; ideal = scende regolare fino a zero." },
  { c: "scrum", q: "Secondo il Manifesto Agile si dà più valore a…", o: ["Software funzionante più che documentazione esaustiva", "Seguire un piano più che rispondere al cambiamento", "Processi e strumenti più che individui e interazioni", "Negoziazione del contratto più che collaborazione col cliente"], e: "Individui e interazioni, software funzionante, collaborazione col cliente, rispondere al cambiamento." },
  { c: "scrum", q: "Quante persone ha un team Scrum?", o: ["Da 5 a 9 (7 ± 2)", "Da 2 a 4", "Da 10 a 15", "Non c'è un limite"], e: "Team di 5–9 persone, auto-organizzato e interfunzionale. Per progetti grandi si usa lo Scrum of scrums." },
  { c: "scrum", q: "Come si scrive una user story?", o: ["Come <tipo di utente> voglio <obiettivo> così che <motivo>", "Il sistema deve <azione> entro <vincolo>", "Quando <evento> [guardia] / <azione>", "I[n] → P[n.i] → R[n]"], e: "Esempio: \"Come studente voglio comprare un abbonamento al parcheggio così che posso andare a scuola in auto\"." },

  // 03 · Minuta
  { c: "minuta", q: "Nella minuta, cosa indica P[2.3]?", o: ["La terza proposta per l'issue numero 2", "La seconda proposta per l'issue numero 3", "Il secondo action item del punto 3", "La risoluzione dell'issue 2"], e: "P[n.i] = proposta i-esima per l'issue n." },
  { c: "minuta", q: "Chi controlla i tempi della riunione?", o: ["Il timekeeper", "Il facilitatore", "Il minute taker", "Il Product Owner"], e: "Facilitatore = guida la riunione e dà la parola. Timekeeper = controlla i tempi. Minute taker = scrive la minuta." },
  { c: "minuta", q: "Cos'è un action item AI[m]?", o: ["Un compito con responsabile e scadenza", "Un argomento contro una proposta", "Un problema da discutere", "Una proposta di soluzione"], e: "Esempio: AI[3] Mario installa MySQL entro venerdì." },
  { c: "minuta", q: "Cosa succede a una issue che non ha una R[n]?", o: ["Resta aperta e torna alla riunione successiva", "Viene cancellata", "Diventa automaticamente un action item", "Si considera risolta"], e: "R[n] è la risoluzione: senza, l'issue rimane aperta." },
  { c: "minuta", q: "Nella discussione, \"−A\" indica…", o: ["Un argomento contro una proposta", "Un action item annullato", "Un assente alla riunione", "Un'issue respinta"], e: "+A = argomento a favore, −A = argomento contro una proposta." },
  { c: "minuta", q: "Cosa contiene la sezione Wrap up?", o: ["Nuovi action item e una breve critica della riunione", "L'elenco dei presenti e degli assenti", "Le comunicazioni per tutti", "L'obiettivo della riunione"], e: "Le sezioni: obiettivo, comunicazioni, status, discussione, wrap up, prossima riunione." },
  { c: "minuta", q: "Cosa contiene la sezione Status?", o: ["Le attività pianificate e la tabella degli action item aperti", "Le issue discusse con proposte e risoluzioni", "Data, ora e luogo della prossima riunione", "I ruoli della riunione"], e: "3.1 attività pianificate (Task, Responsabile, Data prevista, Status, Note) e 3.2 action item aperti." },

  // 04 · UML
  { c: "uml", q: "UML è…", o: ["Una notazione grafica standard, non un metodo", "Un metodo di sviluppo che dice in che ordine lavorare", "Un linguaggio di programmazione a oggetti", "Un processo agile"], e: "UML dice come disegnare, non in che ordine lavorare." },
  { c: "uml", q: "Il class diagram appartiene al modello…", o: ["A oggetti (com'è fatto)", "Funzionale (cosa fa)", "Dinamico (come si comporta)", "Di deployment"], e: "Funzionale = use case; a oggetti = class diagram; dinamico = sequence, statechart, activity." },
  { c: "uml", q: "In che verso va la freccia di <<extend>>?", o: ["Dal caso che estende verso il caso base", "Dal caso base verso il caso che estende", "È bidirezionale", "Non ha una direzione"], e: "Trappola classica: la freccia di extend punta al caso base. Quella di include va dal caso base al caso incluso." },
  { c: "uml", q: "Quando si usa <<include>>?", o: ["Per un comportamento sempre usato, messo a fattor comune", "Per un comportamento eccezionale che si attiva solo in certe condizioni", "Per specializzare un caso d'uso", "Per collegare un attore a un caso d'uso"], e: "Include: \"lo uso SEMPRE\". Extend: \"a volte succede anche questo\"." },
  { c: "uml", q: "Le stanze di una casa non esistono senza la casa. Che relazione è?", o: ["Composizione (rombo pieno)", "Aggregazione (rombo vuoto)", "Ereditarietà (triangolo vuoto)", "Associazione semplice"], e: "Composizione: le parti muoiono con il tutto. Aggregazione: le parti possono vivere da sole." },
  { c: "uml", q: "Come si riconosce un'istanza (oggetto) in UML?", o: ["Il nome è sottolineato, nella forma nome:Classe", "Il nome è in corsivo", "Ha uno stereotipo <<instance>>", "È disegnata con un ovale"], e: "Esempio: tarif2006:TarifSchedule, sottolineato, con gli attributi valorizzati." },
  { c: "uml", q: "Un attore in uno use case diagram è…", o: ["Un ruolo esterno che interagisce col sistema, persona o altro sistema", "Una classe interna al sistema", "Sempre e solo una persona fisica", "Un'istanza di una classe"], e: "Una stessa persona può avere più ruoli, e un attore può anche essere un altro sistema." },
  { c: "uml", q: "Il dominio applicativo (il mondo del problema) è modellato da…", o: ["L'analisi", "Il design", "Il testing", "Il deployment"], e: "Dominio applicativo → analisi. Dominio della soluzione (classi, database, rete) → design." },
  { c: "uml", q: "Generalizzazione tra casi d'uso: come si disegna?", o: ["Freccia dal figlio al padre con triangolo vuoto", "Freccia dal padre al figlio con rombo pieno", "Linea tratteggiata con <<include>>", "Linea semplice senza frecce"], e: "Es. ValidateUser specializzato in CheckPassword e CheckFingerprint." },
  { c: "uml", q: "Cosa indica la molteplicità su un'associazione (1, *, 0..1)?", o: ["Quanti oggetti per parte sono collegati", "Quante volte si chiama un metodo", "La visibilità dell'attributo", "Il numero di sottoclassi"], e: "Es. un Polygon ha molti Point (1-a-molti), ogni Country ha una capitale City (1-a-1)." },

  // 05 · Statechart, activity, package
  { c: "state", q: "Uno statechart diagram descrive…", o: ["Gli stati di un singolo oggetto e le transizioni tra di essi", "Un processo con più attori e i suoi passi", "I messaggi tra oggetti nel tempo", "La struttura statica delle classi"], e: "Statechart = UN oggetto e i suoi stati. Activity = UN processo e i suoi passi." },
  { c: "state", q: "Come si legge l'etichetta \"moneta [credito ≥ prezzo] / eroga\"?", o: ["Evento moneta; se la guardia è vera si esegue l'azione eroga e si cambia stato", "Azione moneta, evento eroga, guardia credito ≥ prezzo", "Si eroga sempre, poi si controlla il credito", "Si ripete eroga finché credito ≥ prezzo"], e: "Transizione: evento [guardia] / azione." },
  { c: "state", q: "Dentro uno stato, cosa indica do/?", o: ["Un'attività che dura finché si resta nello stato", "Un'azione all'ingresso nello stato", "Un'azione all'uscita dallo stato", "La guardia della transizione"], e: "entry/ = all'ingresso, exit/ = all'uscita, do/ = attività che dura finché si resta lì." },
  { c: "state", q: "Decomposizione AND di uno stato significa…", o: ["Regioni concorrenti: l'oggetto è in uno stato per ciascuna regione", "L'oggetto è in un solo sotto-stato alla volta", "Lo stato ha due transizioni in uscita", "Lo stato è sia iniziale sia finale"], e: "OR: un solo sotto-stato. AND: regioni parallele separate da linea tratteggiata." },
  { c: "state", q: "In un activity diagram, quale elemento crea parallelismo?", o: ["Il fork (barra spessa)", "Il branch (rombo)", "Il merge", "La swimlane"], e: "Il fork divide il flusso in rami paralleli e il join li aspetta tutti. Il branch sceglie un solo ramo." },
  { c: "state", q: "A cosa servono le swimlane?", o: ["A mostrare chi svolge ogni attività", "A indicare l'ordine temporale dei messaggi", "A separare gli stati concorrenti", "A raggruppare le classi in sottosistemi"], e: "Le corsie dicono chi fa cosa (Cliente, Vendite, Magazzino)." },
  { c: "state", q: "Come si disegna lo stato iniziale?", o: ["Pallino pieno", "Pallino cerchiato", "Rettangolo arrotondato", "Rombo"], e: "Stato iniziale = pallino pieno; stato finale = pallino cerchiato; stato = rettangolo arrotondato." },
  { c: "state", q: "Cosa rappresentano le frecce tratteggiate tra package?", o: ["Dipendenze: un cambio nel package puntato può toccare l'altro", "Ereditarietà tra package", "Flussi di oggetti", "Messaggi asincroni"], e: "Se A dipende da B, un cambio in B può toccare A. I package servono a gestire la complessità." },

  // 06 · Requisiti ed elicitation
  { c: "req", q: "\"Il sistema deve essere scritto in Java\" è un requisito…", o: ["Vincolo (pseudo-requisito)", "Funzionale", "Non funzionale di performance", "Di usabilità"], e: "Vincoli imposti da cliente o ambiente: linguaggio, tecnologia, metodologia." },
  { c: "req", q: "\"Il tempo di risposta deve essere sotto 1 secondo\" è un requisito…", o: ["Non funzionale", "Funzionale", "Vincolo implementativo", "Di dominio"], e: "Aspetto visibile all'utente ma non legato direttamente a una funzione." },
  { c: "req", q: "\"Un operatore ARENA deve poter definire un nuovo gioco\" è un requisito…", o: ["Funzionale", "Non funzionale", "Vincolo", "Di supportabilità"], e: "Descrive un'interazione tra sistema e ambiente, indipendente dall'implementazione." },
  { c: "req", q: "Rifare in versione web un gestionale degli anni '90 è un progetto…", o: ["Re-engineering", "Greenfield", "Interface engineering", "Evaluation"], e: "Re-engineering = riprogettare o riscrivere un sistema esistente con nuova tecnologia." },
  { c: "req", q: "Lasciare il sistema com'è e dargli solo una nuova GUI è…", o: ["Interface engineering", "Re-engineering", "Greenfield", "Forward engineering"], e: "Interface engineering: si migliora solo l'interfaccia del sistema esistente." },
  { c: "req", q: "Quali sono i 5 criteri di validazione dei requisiti?", o: ["Correttezza, completezza, consistenza, realismo, tracciabilità", "Correttezza, usabilità, consistenza, performance, tracciabilità", "Completezza, consistenza, efficienza, sicurezza, realismo", "Specific, Measurable, Attainable, Realisable, Traceable"], e: "SMART riguarda il singolo requisito scritto; questi 5 sono i criteri per validare l'insieme dei requisiti." },
  { c: "req", q: "Due requisiti si contraddicono. Quale criterio è violato?", o: ["Consistenza", "Correttezza", "Completezza", "Realismo"], e: "Consistenza: ci sono requisiti che si contraddicono?" },
  { c: "req", q: "Quale tecnica di elicitation scopre cose che gli utenti non sanno spiegare?", o: ["Osservazione", "Questionari", "Analisi della concorrenza", "Suggerimenti spontanei"], e: "L'osservazione mostra come si lavora davvero. Contro: richiede tempo e chi è osservato cambia comportamento." },
  { c: "req", q: "Svantaggio tipico dei focus group?", o: ["Chi parla di più domina il gruppo", "Raccolgono risposte superficiali", "Costano poco ma sono pochi e non rappresentativi", "Rischio di copiare invece di innovare"], e: "Superficiali = questionari; pochi e non rappresentativi = suggerimenti spontanei; copiare = analisi della concorrenza." },
  { c: "req", q: "Chi scrive il problem statement?", o: ["Il cliente", "Il team di sviluppo", "Lo ScrumMaster", "Il tester"], e: "Si chiama anche Statement of Work: situazione attuale, scenari, requisiti, calendario, ambiente, criteri di accettazione." },
  { c: "req", q: "Cos'è il RAD?", o: ["Il Requirements Analysis Document, risultato dell'analisi", "Un modello di ciclo di vita rapido", "Il diagramma delle attività", "Il registro delle decisioni del meeting"], e: "Contiene introduzione, sistema attuale, sistema proposto (requisiti e modelli) e glossario." },
  { c: "req", q: "La requirements elicitation definisce…", o: ["Cosa deve fare il sistema, senza ancora dire come", "Come implementare il sistema", "La struttura del database", "Il piano dei test di unità"], e: "È la fase più delicata: un errore qui si propaga in tutto il resto." },

  // 07 · Scrivere buoni requisiti
  { c: "reqq", q: "Nella sintassi ISO 29148, \"shall\" indica…", o: ["Un requisito obbligatorio, vincolante", "Una preferenza non obbligatoria", "Un suggerimento", "Un testo descrittivo"], e: "shall = obbligatorio; should = preferenza; may = suggerimento; is/are = testo descrittivo." },
  { c: "reqq", q: "Perché è meglio evitare \"must\" nei requisiti?", o: ["Crea confusione con \"shall\"", "È troppo informale", "Indica un requisito opzionale", "Non è inglese standard"], e: "\"Shall\" è la parola riservata ai requisiti obbligatori." },
  { c: "reqq", q: "Qual è l'ordine della sintassi consigliata da ISO/IEC/IEEE 29148?", o: ["[Condizione] [Soggetto] [Azione] [Oggetto] [Vincolo]", "[Soggetto] [Condizione] [Oggetto] [Azione] [Vincolo]", "[Azione] [Oggetto] [Soggetto] [Vincolo] [Condizione]", "[Soggetto] [Azione] [Vincolo] [Condizione] [Oggetto]"], e: "\"Quando riceve il segnale x, il sistema deve impostare il bit di segnale ricevuto entro 2 secondi.\"" },
  { c: "reqq", q: "Quale di queste formulazioni è verificabile?", o: ["Mostrare il risultato della ricerca entro 2 secondi nel 95% dei casi", "Il sistema deve essere veloce", "Il sistema deve essere user friendly", "Il sistema deve minimizzare i tempi di attesa"], e: "Veloce, user friendly, minimizzare: parole ambigue, non verificabili." },
  { c: "reqq", q: "In SMART, che differenza c'è tra Attainable e Realisable?", o: ["Attainable = raggiungibile con risorse e tempi; Realisable = tecnicamente fattibile", "Attainable = tecnicamente fattibile; Realisable = raggiungibile con le risorse", "Sono sinonimi", "Attainable = misurabile; Realisable = tracciabile"], e: "Un'app avanzata è realizzabile (la tecnologia c'è) ma non raggiungibile con 2 settimane e 1 persona." },
  { c: "reqq", q: "\"Tempo medio tra due guasti di almeno 1000 ore\": categoria FURPS?", o: ["Reliability", "Performance", "Supportability", "Usability"], e: "Reliability: fare le funzioni richieste per un certo tempo (oggi dependability)." },
  { c: "reqq", q: "La Supportability (FURPS) riguarda…", o: ["Facilità di modifica dopo il rilascio: manutenibilità, adattabilità", "Facilità di imparare a usare il sistema", "Tempo di risposta e throughput", "Licenze e norme"], e: "Supportability: manutenibilità, adattabilità, internazionalizzazione." },
  { c: "reqq", q: "\"Il sistema turni HR deve scambiare dati con il software paghe esistente\": attributo ISO 25010?", o: ["Compatibilità", "Portabilità", "Affidabilità", "Operabilità"], e: "È l'esempio delle slide: scambiare dati con un sistema esistente → compatibilità." },
  { c: "reqq", q: "Cosa significa la W di MoSCoW?", o: ["Won't have: non in questa versione", "Would have: lo faremmo se avanza tempo", "Wish: desiderio del cliente", "Weighted: priorità pesata"], e: "Must, Should, Could, Won't have." },
  { c: "reqq", q: "A cosa serve la matrice di tracciabilità?", o: ["Collega ogni requisito alla sua origine e a ciò che lo realizza (casi d'uso, classi, test)", "Elenca le priorità MoSCoW", "Calcola la capacità del team", "Mostra le dipendenze tra package"], e: "Serve a capire l'impatto di un cambiamento e a verificare che tutto sia coperto." },
  { c: "reqq", q: "Un requisito \"singolare\" è…", o: ["Uno che esprime una sola cosa", "Uno che ha una sola interpretazione", "Uno che non contraddice altri", "Uno che si può testare"], e: "Una sola interpretazione = non ambiguo; non contraddice = consistente; si può testare = verificabile." },
  { c: "reqq", q: "Quale di queste NON è una parola da evitare nei requisiti?", o: ["shall", "robusto", "il più possibile", "e/o"], e: "Shall è la parola giusta per i requisiti obbligatori. Robusto, il più possibile, e/o sono ambigui." },

  // 08 · Scenari e casi d'uso
  { c: "uc", q: "\"Mario prenota il volo AZ123 per Parigi\" è…", o: ["Uno scenario", "Un caso d'uso", "Un attore", "Un requisito non funzionale"], e: "Scenario = storia concreta con nomi veri (istanza). Il caso d'uso sarebbe PrenotaVolo (classe di scenari)." },
  { c: "uc", q: "In un progetto greenfield, che tipo di scenario si usa?", o: ["Visionary", "As-is", "Evaluation", "Training"], e: "As-is = situazione attuale, tipico del re-engineering. Visionary = sistema futuro, tipico del greenfield." },
  { c: "uc", q: "Uno scenario \"training\" è…", o: ["Istruzioni passo passo per insegnare a usare il sistema", "I compiti su cui verrà valutato il sistema", "La situazione attuale", "Il sistema futuro"], e: "Evaluation = compiti dell'utente su cui verrà valutato il sistema." },
  { c: "uc", q: "Nel template, un flusso numerato 4.1 è…", o: ["Un flusso alternativo o di errore che parte dal passo 4", "Il quarto passo del primo flusso", "La quarta versione del caso d'uso", "Il primo include del passo 4"], e: "Flusso alternativo 3.1 = \"al passo 3 può succedere anche questo\"." },
  { c: "uc", q: "Quale nome di caso d'uso è scritto bene?", o: ["ReportEmergency", "Emergency", "EmergencyManager", "Report"], e: "Nome = verbo + complemento. Gli attori invece sono sostantivi." },
  { c: "uc", q: "Quanto deve essere lungo al massimo un caso d'uso?", o: ["1–2 pagine, con le eccezioni descritte a parte", "Mezza pagina, senza eccezioni", "Nessun limite", "Una riga per passo, massimo 5 passi"], e: "E le parole del dominio vanno nel glossario." },
  { c: "uc", q: "Nel template, \"Exit condition on failure\" indica…", o: ["Lo stato finale se il caso d'uso va male", "Cosa deve essere vero prima di iniziare", "Il punto in cui si aggancia un'estensione", "Il flusso di errore principale"], e: "Exit condition on success / on failure: lo stato finale se va bene e se va male." },
  { c: "uc", q: "Cos'è un extension point nel template?", o: ["Il punto in cui si aggancia un caso d'uso che lo estende: <condizione, UCE>", "Il caso d'uso padre", "Un requisito non funzionale", "Il passo in cui si fa include(UCIn)"], e: "Generalization of = il padre; include(UCIn) è un passo del flusso principale." },
  { c: "uc", q: "In che ordine si trovano i casi d'uso?", o: ["Attori → scenari → casi d'uso → raffinamento", "Casi d'uso → attori → scenari → raffinamento", "Scenari → classi → attori → casi d'uso", "Raffinamento → attori → casi d'uso → scenari"], e: "Trova chi usa il sistema, raccogli gli scenari, generalizzali in casi d'uso, poi raffina (eccezioni, include/extend, non funzionali)." },
  { c: "uc", q: "Scenario e caso d'uso stanno tra loro come…", o: ["Istanza e classe", "Classe e istanza", "Attore e sistema", "Requisito e vincolo"], e: "Lo scenario è un'istanza di un caso d'uso; il caso d'uso è una classe di scenari." },

  // 09 · Modello dinamico e sequence
  { c: "dyn", q: "Come si rappresenta la distruzione di un oggetto in un sequence diagram?", o: ["Con una X sulla lifeline", "Con una freccia tratteggiata verso l'oggetto", "Con un rettangolo di attivazione vuoto", "Con un frame end"], e: "Da quel punto l'oggetto non si può più usare." },
  { c: "dyn", q: "Quale frame usi per \"ripeti per ogni elemento del carrello\"?", o: ["loop", "opt", "alt", "ref"], e: "loop = while/for. In alternativa si scrive *[condizione] sul messaggio." },
  { c: "dyn", q: "Un if senza else in un sequence diagram è il frame…", o: ["opt", "alt", "loop", "par"], e: "alt = if/else con più alternative; opt = il blocco si esegue solo se la condizione è vera." },
  { c: "dyn", q: "Un oggetto entity può chiamare un boundary?", o: ["No, mai", "Sì, sempre", "Solo se il boundary l'ha creato", "Solo nei messaggi asincroni"], e: "Gli entity sono usati da control e boundary, ma non chiamano mai boundary o control." },
  { c: "dyn", q: "Quale struttura supporta meglio i cambiamenti, fork o stair?", o: ["Fork (controllo centralizzato)", "Stair (controllo decentralizzato)", "Sono equivalenti", "Nessuna delle due"], e: "Con il fork si può cambiare l'ordine e aggiungere operazioni. Lo stair va bene se le operazioni sono fortemente collegate e sempre nello stesso ordine." },
  { c: "dyn", q: "Il messaggio di ritorno (freccia tratteggiata) è obbligatorio?", o: ["No, è opzionale", "Sì, sempre", "Solo per i messaggi asincroni", "Solo per le self-call"], e: "Il ritorno si può omettere." },
  { c: "dyn", q: "Un messaggio sincrono si disegna con…", o: ["Freccia piena chiusa: il chiamante aspetta la fine del metodo", "Freccia aperta: il chiamante continua senza aspettare", "Freccia tratteggiata", "Una X"], e: "Asincrono = freccia aperta, il chiamante non aspetta." },
  { c: "dyn", q: "Passando da un caso d'uso al sequence, cosa c'è nella seconda colonna?", o: ["Un oggetto boundary, con cui l'attore interagisce", "Un oggetto control", "Un oggetto entity", "Il database"], e: "Prima colonna = attore; seconda = boundary; terza = control, che gestisce il resto del caso d'uso." },
  { c: "dyn", q: "L'oggetto control…", o: ["Coordina il caso d'uso ed è creato dal boundary", "Contiene i dati persistenti del dominio", "È l'interfaccia con l'attore", "Non può creare altri oggetti"], e: "Boundary = interfaccia (form, bottoni); Control = logica del flusso; Entity = dati persistenti (Torneo, Conto)." },
  { c: "dyn", q: "Cosa rappresenta il rettangolino stretto sulla lifeline?", o: ["L'attivazione: il tempo in cui un metodo è in esecuzione", "La creazione dell'oggetto", "Un frame opt", "Un messaggio di ritorno"], e: "Lifeline = linea tratteggiata verticale (la vita dell'oggetto); attivazione = il rettangolino sopra." },
  { c: "dyn", q: "Il collaboration diagram rispetto al sequence…", o: ["Mostra gli stessi messaggi ma evidenzia i collegamenti tra oggetti; l'ordine è dato dai numeri", "Mostra gli stati di un oggetto", "Non mostra i messaggi", "Mette in evidenza il tempo più del sequence"], e: "I messaggi annidati si numerano con la notazione puntata (2.1, 2.2)." },

  // ——— Domande aggiunte per il quiz dinamico ———
  // 01 · Ciclo di vita (altre)
  { c: "cvs", q: "Secondo IEEE 610.12, il ciclo di vita del software comprende…", o: ["Tutto il periodo dall'idea al ritiro del prodotto, uso e manutenzione inclusi", "Solo la progettazione e la codifica", "Solo il tratto dalla decisione di sviluppare alla consegna", "Solo la manutenzione dopo il rilascio"], e: "Ciclo di vita = dall'idea al ritiro, uso e manutenzione compresi. Il tratto decisione → consegna è il ciclo di sviluppo, che ne è solo una parte." },
  { c: "cvs", q: "Studio di fattibilità e analisi dei requisiti appartengono alla macro-fase di…", o: ["Definizione (il cosa)", "Sviluppo (il come)", "Manutenzione (il dopo)", "Validazione"], e: "Definizione = capire il problema e i vincoli. Sviluppo = progettare, codificare, testare, integrare. Manutenzione = correggere, adattare, aggiungere." },
  { c: "cvs", q: "Progettare, scrivere il codice, testare e integrare è la macro-fase di…", o: ["Sviluppo (il come)", "Definizione (il cosa)", "Manutenzione (il dopo)", "Fattibilità"], e: "Le tre macro-fasi: Definizione (il cosa), Sviluppo (il come), Manutenzione (il dopo)." },
  { c: "cvs", q: "Adattare il software a un nuovo sistema operativo rientra nella…", o: ["Manutenzione", "Definizione", "Codifica iniziale", "Analisi dei requisiti"], e: "La manutenzione (il dopo) comprende correggere errori, adattare a nuovi ambienti e aggiungere funzioni." },
  { c: "cvs", q: "Il modello a cascata è nato come reazione a…", o: ["Il \"code and fix\": scrivere codice e aggiustare a caso", "Il modello a spirale", "Extreme Programming", "La prototipazione evolutiva"], e: "Royce, anni '70: la cascata mette ordine al \"code and fix\", ispirandosi all'industria manifatturiera." },
  { c: "cvs", q: "Chi ha proposto il modello a cascata?", o: ["Royce, negli anni '70", "Boehm, insieme alla spirale", "Basili, col modello di riuso", "Jacobson, con OOSE"], e: "Cascata: Royce, anni '70. Spirale: Boehm. Riuso completo con COTS: Basili." },
  { c: "cvs", q: "Nel modello a cascata, cosa succede alla fine di ogni fase?", o: ["C'è una milestone e i prodotti della fase vengono \"congelati\"", "Si torna alla fase precedente per ricontrollarla", "Si consegna una versione al cliente", "Si esegue il β-test"], e: "Ogni fase produce semilavorati (documenti, codice) che sono l'input della successiva; la fine della fase è una milestone." },
  { c: "cvs", q: "Quale di questi è un VANTAGGIO del modello a cascata?", o: ["È semplice da capire e da pianificare, con controllo su tempi e costi", "Il cliente vede il prodotto fin dall'inizio", "Accoglie facilmente requisiti che cambiano", "Richiede pochissima documentazione"], e: "Pro: semplice, pianificabile, tempi e costi sotto controllo, tanta documentazione. Contro: rigida, il cliente vede tutto solo alla fine." },
  { c: "cvs", q: "Nel modello a V, il test di sistema corrisponde a…", o: ["Il progetto di sistema", "L'analisi dei requisiti", "Il progetto di dettaglio", "La codifica"], e: "Requisiti ↔ accettazione · progetto di sistema ↔ test di sistema · progetto di dettaglio ↔ test di unità e integrazione." },
  { c: "cvs", q: "Nel modello a V, i test di unità e di integrazione corrispondono a…", o: ["Il progetto di dettaglio", "Il progetto di sistema", "L'analisi dei requisiti", "Lo studio di fattibilità"], e: "Più si scende a sinistra (dettaglio), più il test corrispondente a destra è piccolo (unità e integrazione)." },
  { c: "cvs", q: "Cosa sta al vertice (al centro) del modello a V?", o: ["La codifica", "Il test di accettazione", "L'analisi dei requisiti", "La manutenzione"], e: "È la cascata \"piegata\": a sinistra il progetto, a destra i test, al centro la codifica." },
  { c: "cvs", q: "Nel modello a V un test a destra fallisce. Cosa si fa?", o: ["Si torna alla fase collegata a sinistra e la si migliora", "Si ricomincia tutto da capo", "Si passa comunque alla manutenzione", "Si rimanda il problema al β-test"], e: "Il modello a V rende esplicito che si può iterare, migliorando requisiti, progetto e codice." },
  { c: "cvs", q: "Quando conviene usare la prototipazione?", o: ["Quando il cliente non sa bene cosa vuole", "Quando i requisiti sono chiari e stabili", "Solo per sistemi safety critical", "Quando si assemblano componenti COTS"], e: "Il prototipo, una versione finta o parziale, serve a far vedere qualcosa al cliente e capire i requisiti." },
  { c: "cvs", q: "Un breadboard è un prototipo che contiene…", o: ["La logica, senza interfaccia vera", "Solo l'interfaccia, senza logica", "La specifica matematica", "Il prodotto finale già completo"], e: "Breadboard = logica senza interfaccia. Mock-up = interfaccia senza logica." },
  { c: "cvs", q: "Un prototipo esplorativo (evolutivo)…", o: ["Viene raffinato fino a diventare il prodotto finale", "Si butta appena chiariti i requisiti", "Contiene solo l'interfaccia grafica", "È una specifica formale da trasformare in codice"], e: "Usa e getta: si butta dopo aver capito i requisiti. Evolutivo: si raffina fino al prodotto finale." },
  { c: "cvs", q: "Cosa significa COTS?", o: ["Commercial Off-The-Shelf: componenti già pronti sul mercato", "Component Oriented Testing System", "Code Of The System", "Common Object Transfer Standard"], e: "Il modello basato su componenti costruisce il sistema assemblando COTS: è il modello di riuso completo di Basili." },
  { c: "cvs", q: "Il modello basato su componenti…", o: ["Costruisce il sistema assemblando componenti già esistenti", "Trasforma una specifica matematica in codice", "Consegna il prodotto in più rilasci", "Ripete lo stesso ciclo raffinando tutto il sistema"], e: "Componenti COTS assemblati: è il modello di riuso completo di Basili." },
  { c: "cvs", q: "Il modello iterativo…", o: ["Ripete più volte lo stesso ciclo, raffinando ogni volta tutto il sistema", "Consegna più rilasci, ognuno con funzioni nuove", "Assembla componenti già esistenti", "Non torna mai indietro tra le fasi"], e: "Iterativo = rifaccio il ciclo migliorando tutto. Incrementale = aggiungo funzioni a ogni rilascio." },
  { c: "cvs", q: "Il cliente non ha subito i soldi per l'intero progetto. Quale modello aiuta?", o: ["Incrementale", "A cascata", "Trasformazioni formali", "A V"], e: "Con l'incrementale si consegna in più rilasci: il cliente paga e riceve un pezzo alla volta. Utile anche per i grandi progetti." },
  { c: "cvs", q: "Nella spirale di Boehm, cosa rappresenta il raggio che cresce a ogni giro?", o: ["Il costo speso fino a quel momento", "Il numero di requisiti raccolti", "La qualità del prodotto", "Il numero di persone nel team"], e: "Più si va avanti nella spirale, più il raggio, cioè il costo speso, cresce." },
  { c: "cvs", q: "Nella spirale, in quale quadrante si usa spesso un prototipo?", o: ["Valutare le alternative e risolvere i rischi", "Determinare obiettivi e vincoli", "Pianificare il giro successivo", "Rilasciare il prodotto"], e: "Il secondo quadrante analizza i rischi, spesso costruendo un prototipo. Poi si sviluppa e verifica, poi si pianifica il giro dopo." },
  { c: "cvs", q: "Spirale con rischi bassi e requisiti chiari: ogni giro si comporta come…", o: ["Una cascata", "Un prototipo", "Un ciclo XP", "Un'ispezione del codice"], e: "Per questo è un meta-modello: se le interfacce utente sono incerte invece ogni giro diventa un prototipo." },
  { c: "cvs", q: "Spirale con interfacce utente molto incerte: ogni giro diventa…", o: ["Un prototipo", "Una cascata", "Una trasformazione formale", "Un rilascio definitivo"], e: "La spirale si adatta ai rischi: incertezza sull'interfaccia → prototipo; rischi bassi e requisiti chiari → cascata." },
  { c: "cvs", q: "Qual è l'ordine corretto dei 4 quadranti della spirale?", o: ["Obiettivi e vincoli → alternative e rischi → sviluppo e verifica → pianificazione", "Sviluppo → rischi → obiettivi → pianificazione", "Pianificazione → sviluppo → obiettivi → rischi", "Rischi → obiettivi → pianificazione → sviluppo"], e: "1 obiettivi, alternative e vincoli · 2 valutare le alternative e risolvere i rischi · 3 sviluppare e verificare · 4 pianificare il giro successivo." },
  { c: "cvs", q: "In XP, \"pair programming\" significa…", o: ["Due persone lavorano sullo stesso computer", "Due team sviluppano lo stesso modulo in parallelo", "Ogni funzione ha due implementazioni", "Il cliente e il capo progetto scrivono il codice insieme"], e: "Regola 12 di XP: due persone, un computer." },
  { c: "cvs", q: "Quale di queste È una regola di XP?", o: ["Integrare continuamente", "Congelare i requisiti all'inizio", "Fare straordinari nelle settimane finali", "Ogni modulo ha un solo proprietario del codice"], e: "XP: integrazione continua, proprietà collettiva del codice, 40 ore a settimana, cliente presente, refactoring, pair programming…" },
  // 02 · Scrum (altre)
  { c: "scrum", q: "Quanto dura di solito uno sprint?", o: ["Da 2 a 4 settimane", "Un giorno", "Da 3 a 6 mesi", "Un anno"], e: "Scrum lavora in cicli brevi, gli sprint, di 2–4 settimane." },
  { c: "scrum", q: "Cosa si ottiene alla fine di ogni sprint?", o: ["Un incremento di prodotto potenzialmente rilasciabile", "La documentazione completa del sistema", "Il product backlog definitivo", "Un prototipo da buttare"], e: "A ogni sprint si consegna un pezzo di prodotto funzionante, cominciando da quello che vale di più." },
  { c: "scrum", q: "Manifesto Agile: individui e interazioni più che…", o: ["Processi e strumenti", "Documentazione esaustiva", "Negoziazione del contratto", "Seguire un piano"], e: "Individui e interazioni > processi e strumenti · software funzionante > documentazione · collaborazione col cliente > contratto · rispondere al cambiamento > piano." },
  { c: "scrum", q: "Manifesto Agile: collaborazione col cliente più che…", o: ["Negoziazione del contratto", "Processi e strumenti", "Seguire un piano", "Documentazione esaustiva"], e: "Le quattro coppie del Manifesto: impara a riconoscere il termine giusto per ciascuna." },
  { c: "scrum", q: "Manifesto Agile: rispondere al cambiamento più che…", o: ["Seguire un piano", "Negoziazione del contratto", "Processi e strumenti", "Software funzionante"], e: "Attenzione al trabocchetto: \"software funzionante\" è il lato che il Manifesto valorizza, non quello a cui si dà meno valore." },
  { c: "scrum", q: "Come è fatto il team in Scrum?", o: ["Auto-organizzato, interfunzionale e a tempo pieno", "Guidato dallo ScrumMaster, che assegna i task", "Composto solo da programmatori", "Formato da persone su più progetti part-time"], e: "Team di 5–9 persone, auto-organizzato, interfunzionale (programmatori, tester, designer…), a tempo pieno." },
  { c: "scrum", q: "Chi decide COME fare il lavoro dello sprint?", o: ["Il team", "Il Product Owner", "Lo ScrumMaster", "Il cliente"], e: "Il PO decide cosa fare (e le priorità), il team decide come farlo." },
  { c: "scrum", q: "Chi accetta o rifiuta il lavoro fatto?", o: ["Il Product Owner", "Lo ScrumMaster", "Il team stesso", "Il tester più esperto"], e: "Il PO definisce le funzionalità, le ordina per valore e accetta o rifiuta il lavoro." },
  { c: "scrum", q: "Ogni quanto il Product Owner può cambiare le priorità?", o: ["A ogni sprint", "Ogni giorno, durante il daily scrum", "Mai, una volta definite", "Solo a fine progetto"], e: "Il PO può riordinare il product backlog a ogni sprint; durante lo sprint lo sprint backlog lo tocca solo il team." },
  { c: "scrum", q: "Un manager esterno interrompe di continuo il team. Chi deve proteggerlo?", o: ["Lo ScrumMaster", "Il Product Owner", "Il membro più anziano del team", "Il cliente"], e: "Lo ScrumMaster fa rispettare le regole, rimuove gli ostacoli e protegge il team dalle interferenze esterne." },
  { c: "scrum", q: "Cosa succede nello sprint planning?", o: ["Si scelgono elementi dal product backlog e si crea lo sprint backlog, con task stimati in ore", "Si mostra la demo al cliente", "Si discute come migliorare il processo", "Ognuno dice cosa ha fatto ieri"], e: "Planning a inizio sprint: le storie scelte si spezzano in task stimati in ore." },
  { c: "scrum", q: "Quanto dura il daily scrum?", o: ["15 minuti, in piedi", "Un'ora, seduti", "Mezza giornata", "Quanto serve per risolvere i problemi"], e: "15 minuti ogni giorno, in piedi. Non serve a risolvere i problemi." },
  { c: "scrum", q: "Quale di questi NON è uno scopo del daily scrum?", o: ["Risolvere i problemi tecnici emersi", "Dire cosa si è fatto ieri", "Dire cosa si farà oggi", "Segnalare gli ostacoli"], e: "Il daily non serve a risolvere problemi né è un report al capo: si risponde alle 3 domande e basta." },
  { c: "scrum", q: "Come si prepara la sprint review?", o: ["In modo informale: massimo 2 ore di preparazione, niente slide", "Con una presentazione di slide dettagliata", "Con un report scritto per il management", "Non si prepara: si salta se lo sprint è andato male"], e: "La review è una demo informale di cosa si è fatto." },
  { c: "scrum", q: "\"Start, Stop, Continue\" è la tecnica tipica della…", o: ["Sprint retrospective", "Sprint review", "Sprint planning", "Daily scrum"], e: "Nella retrospective il team decide cosa iniziare, smettere e continuare a fare." },
  { c: "scrum", q: "Com'è ordinato il product backlog?", o: ["In alto gli elementi a priorità alta, dettagliati; in basso quelli meno importanti, più vaghi", "In ordine di inserimento", "In ordine alfabetico", "In alto i task più facili"], e: "È una pila ordinata per priorità dal Product Owner." },
  { c: "scrum", q: "Cosa mostra il burndown chart?", o: ["Le ore di lavoro rimanenti, giorno per giorno", "Gli story point consegnati negli sprint passati", "Le ore lavorate da ogni persona", "Il numero di bug aperti"], e: "Deve scendere fino a zero alla fine dello sprint." },
  { c: "scrum", q: "Come si ottiene ogni punto del burndown?", o: ["Sommando le ore rimanenti di tutti i task in quel giorno", "Contando i task completati quel giorno", "Moltiplicando persone per ore", "Chiedendo una stima al Product Owner"], e: "Nello sprint backlog ogni riga è un task e ogni colonna un giorno: la somma della colonna è il punto del grafico." },
  { c: "scrum", q: "Burndown \"too late\" (in ritardo per tutto lo sprint): cosa fare?", o: ["Abbassare la capacità pianificata nel prossimo sprint", "Aumentare il focus factor", "Aggiungere più storie", "Smettere di aggiornare il grafico"], e: "Too late: impegno non completato, si era preso troppo lavoro." },
  { c: "scrum", q: "Burndown \"too early\" (finiscono prima): cosa indica?", o: ["Storie sovrastimate o velocity stimata male; servono altre storie pronte", "Il team non aggiorna i progressi", "Task aggiunti ogni giorno", "Il PO ha tolto storie"], e: "Se si finisce prima del tempo bisogna avere altre storie pronte da prendere." },
  { c: "scrum", q: "Burndown con linea piatta (\"let's have a rest\"): cosa indica?", o: ["Non aggiornano i progressi, o il PO aggiunge lavoro quanto ne viene fatto", "Il team ha finito in anticipo", "Il team è ideale", "Il primo sprint di un team nuovo"], e: "Piatta = non scende: nessuno aggiorna, oppure entra lavoro alla stessa velocità con cui esce." },
  { c: "scrum", q: "Burndown \"nice team\": com'è l'andamento?", o: ["Lento all'inizio, poi adattano lo scope e finiscono in tempo", "Scende regolare fino a zero", "Sale invece di scendere", "Resta piatto"], e: "Ideal team: discesa regolare. Nice team: partenza lenta ma scope adattato e sprint chiuso in tempo." },
  { c: "scrum", q: "Nell'esempio delle slide, il team aveva preso troppo lavoro (quasi 600 ore al giorno 13). Cosa ha salvato lo sprint?", o: ["Il Product Owner ha tolto delle storie", "Il team ha fatto straordinari", "Lo sprint è stato allungato", "Lo ScrumMaster ha aggiunto persone"], e: "Il salto in giù nel grafico è il PO che riduce lo scope." },
  { c: "scrum", q: "Come si scala Scrum a progetti con centinaia di persone?", o: ["Scrum of scrums: un rappresentante per team si incontra con gli altri", "Un unico team molto grande", "Un solo Product Owner che coordina tutti i task", "Sprint di sei mesi"], e: "Team da 7 ± 2 persone; i team si coordinano con lo Scrum of scrums." },
  { c: "scrum", q: "Team di 4 persone, 6 ore al giorno, sprint di 10 giorni, focus factor 0,75. Capacità reale?", o: ["180 ore", "240 ore", "160 ore", "200 ore"], e: "4 × 6 × 10 = 240 ore teoriche; 240 × 0,75 = 180 ore da pianificare." },
  { c: "scrum", q: "Team di 7 persone, 8 ore al giorno, sprint di 15 giorni, focus factor 0,8. Capacità reale?", o: ["672 ore", "840 ore", "588 ore", "560 ore"], e: "7 × 8 × 15 = 840 ore teoriche; 840 × 0,8 = 672 ore." },
  { c: "scrum", q: "Pianifico 30 story point e ne consegno 24. Qual è la velocity?", o: ["24", "30", "27", "6"], e: "La velocity conta gli story point effettivamente consegnati, non quelli pianificati." },
  { c: "scrum", q: "Differenza tra capacità e velocity?", o: ["Capacità = ore disponibili nello sprint; velocity = story point consegnati", "Sono la stessa misura", "Capacità = story point; velocity = ore", "Capacità misura la bravura, velocity il tempo"], e: "Capacità serve a pianificare lo sprint in ore; velocity misura i punti consegnati." },
  { c: "scrum", q: "Un focus factor di 0,9 è…", o: ["Rischioso: oltre 0,8 si sovrastima il tempo davvero disponibile", "Consigliato per team nuovi", "Il valore standard di Scrum", "Obbligatorio per sprint lunghi"], e: "Si usa 0,6–0,8: le persone hanno riunioni, mail, imprevisti." },
  // 03 · Riunioni e minuta (altre)
  { c: "minuta", q: "Chi guida la riunione, segue l'agenda e dà la parola?", o: ["Il facilitatore", "Il timekeeper", "Il minute taker", "Il Product Owner"], e: "Facilitatore = guida. Timekeeper = tempi. Minute taker = scrive la minuta." },
  { c: "minuta", q: "Chi scrive la minuta?", o: ["Il minute taker", "Il facilitatore", "Il timekeeper", "Tutti i presenti a turno"], e: "Il minute taker è il ruolo che verbalizza la riunione." },
  { c: "minuta", q: "Quali sono i ruoli indicati nell'intestazione della minuta?", o: ["Facilitatore, timekeeper, minute taker (più presenti e assenti)", "Product Owner, ScrumMaster, team", "Cliente, analista, programmatore", "Presidente, segretario, revisore"], e: "Non confondere con i ruoli di Scrum." },
  { c: "minuta", q: "Cosa contiene l'intestazione della minuta?", o: ["Progetto, numero della riunione, data, ora di inizio e fine, luogo e ruoli", "Solo l'elenco degli action item", "Le risoluzioni prese", "La critica della riunione"], e: "Poi vengono le sezioni: obiettivo, comunicazioni, status, discussione, wrap up, prossima riunione." },
  { c: "minuta", q: "Qual è l'ordine delle sezioni della minuta?", o: ["Obiettivo → Comunicazioni → Status → Discussione → Wrap up → Prossima riunione", "Discussione → Obiettivo → Wrap up → Status → Comunicazioni", "Status → Discussione → Obiettivo → Comunicazioni → Wrap up", "Comunicazioni → Wrap up → Status → Discussione → Obiettivo"], e: "Il template è fisso: impararlo fa risparmiare tempo." },
  { c: "minuta", q: "Cosa va nella sezione Comunicazioni?", o: ["Informazioni da dare a tutti", "I problemi da discutere", "I nuovi action item", "Data e luogo della prossima riunione"], e: "Le comunicazioni sono informazioni, non problemi da discutere: quelli vanno in Discussione." },
  { c: "minuta", q: "Quali colonne ha la tabella delle attività pianificate (Status 3.1)?", o: ["Task, Responsabile, Data prevista, Status, Note", "Issue, Proposta, Argomento, Risoluzione", "Nome, Ruolo, Presente, Assente", "Story, Story point, Priorità, Sprint"], e: "Status: 3.1 attività pianificate e 3.2 tabella degli action item aperti." },
  { c: "minuta", q: "In quale sezione si usa la notazione I[n], P[n.i], R[n]?", o: ["Discussione", "Comunicazioni", "Status", "Intestazione"], e: "La Discussione riporta i problemi discussi con una notazione precisa." },
  { c: "minuta", q: "Cosa indica I[n]?", o: ["Una issue: il problema da discutere", "Un'informazione per tutti", "Un incarico già completato", "L'intervento n-esimo di un presente"], e: "I[1] Che database usiamo?" },
  { c: "minuta", q: "Cosa indica R[n]?", o: ["La risoluzione dell'issue n", "Il responsabile del task n", "Il rischio numero n", "La riunione numero n"], e: "R[1] Si usa MySQL, vedi AI[3]." },
  { c: "minuta", q: "Cosa indica \"+A\" nella discussione?", o: ["Un argomento a favore di una proposta", "Un action item aggiunto", "Un'approvazione della minuta", "Un assente giustificato"], e: "+A = a favore, −A = contro." },
  { c: "minuta", q: "In P[n.i], cosa indica la n?", o: ["Il numero dell'issue a cui la proposta si riferisce", "Il numero della proposta", "Il numero della riunione", "Il numero di voti ricevuti"], e: "P[n.i] = proposta i-esima per l'issue n." },
  { c: "minuta", q: "Cosa indica P[3.1]?", o: ["La prima proposta per l'issue numero 3", "La terza proposta per l'issue numero 1", "L'issue 3 della riunione 1", "Il punto 3.1 dello status"], e: "Prima il numero dell'issue, poi il numero della proposta." },
  { c: "minuta", q: "\"Che database usiamo?\" come si annota nella discussione?", o: ["I[1]", "P[1.1]", "R[1]", "AI[1]"], e: "È il problema da discutere: un'issue." },
  { c: "minuta", q: "\"MongoDB\" proposto come seconda opzione per l'issue 1 si scrive…", o: ["P[1.2]", "P[2.1]", "I[2]", "R[1.2]"], e: "P[1.1] MySQL · P[1.2] MongoDB." },
  { c: "minuta", q: "\"Lo conosciamo tutti\", detto a sostegno di MySQL, si annota come…", o: ["+A", "−A", "R[1]", "P[1.1]"], e: "È un argomento a favore di una proposta." },
  { c: "minuta", q: "\"Ha uno schema rigido\", detto contro una proposta, si annota come…", o: ["−A", "+A", "I[n]", "AI[m]"], e: "−A = argomento contro." },
  { c: "minuta", q: "\"Mario installa MySQL entro venerdì\" si annota come…", o: ["AI[m]: action item con responsabile e scadenza", "R[n]: risoluzione", "P[n.i]: proposta", "I[n]: issue"], e: "Un action item ha sempre un responsabile e una scadenza." },
  { c: "minuta", q: "Cosa significa \"R[1] Si usa MySQL, vedi AI[3]\"?", o: ["L'issue 1 è risolta con MySQL e c'è un compito collegato, l'action item 3", "La proposta 1 è stata rifiutata", "MySQL è la terza proposta", "L'issue 3 è stata riaperta"], e: "La risoluzione chiude l'issue e rimanda all'action item che la mette in pratica." },
  { c: "minuta", q: "Un action item, oltre al compito, deve avere…", o: ["Un responsabile e una scadenza", "Un argomento a favore e uno contro", "Una proposta alternativa", "La firma del facilitatore"], e: "AI[3] Mario installa MySQL entro venerdì: chi, cosa, entro quando." },
  { c: "minuta", q: "Dove si trovano gli action item ancora aperti delle riunioni precedenti?", o: ["Nello Status, nella tabella 3.2", "Nelle Comunicazioni", "Nell'intestazione", "Nella Prossima riunione"], e: "Lo Status riporta le attività pianificate (3.1) e gli action item aperti (3.2)." },
  { c: "minuta", q: "Cosa va nella sezione Prossima riunione?", o: ["Data, ora e luogo", "Gli action item aperti", "La critica della riunione", "Le issue risolte"], e: "Sezione finale: quando e dove ci si rivede." },
  { c: "minuta", q: "Dove si scrive una breve critica della riunione stessa?", o: ["Nel Wrap up", "Nella Discussione", "Nelle Comunicazioni", "Nello Status"], e: "Wrap up: nuovi action item e una breve critica della riunione." },
  { c: "minuta", q: "A cosa serve la minuta nel progetto del corso?", o: ["A verbalizzare le riunioni del team con una struttura fissa", "A descrivere i casi d'uso", "A pianificare gli sprint", "A raccogliere i requisiti dal cliente"], e: "Le riunioni del team vanno verbalizzate con una minuta, seguendo il template." },
  { c: "minuta", q: "Nell'issue 2 sono state fatte tre proposte, ma non si è deciso. Cosa manca nella minuta?", o: ["R[2]: senza risoluzione l'issue resta aperta", "P[2.4]", "Un −A", "AI[2]"], e: "Un'issue senza R[n] torna alla riunione successiva." },
  // 04 · UML (altre)
  { c: "uml", q: "Cos'è un modello?", o: ["Un'astrazione: tiene i dettagli importanti e butta via il resto", "Il codice sorgente del sistema", "Una copia fedele di ogni dettaglio", "Un documento di requisiti"], e: "Si modella per capire sistemi troppo complessi da tenere in testa." },
  { c: "uml", q: "Il dominio della soluzione (classi, database, rete) è modellato da…", o: ["Il design", "L'analisi", "Il cliente", "Il test di accettazione"], e: "Dominio applicativo = il mondo del problema, modellato dall'analisi. Dominio della soluzione = la tecnologia, modellata dal design." },
  { c: "uml", q: "Da quali metodi nasce UML?", o: ["Booch, OMT (Rumbaugh) e OOSE (Jacobson)", "Cascata, spirale e XP", "Scrum, Kanban e XP", "FURPS+, SMART e MoSCoW"], e: "UML è la fusione di più metodi object-oriented; standard OMG dal 1997." },
  { c: "uml", q: "UML è uno standard di quale organizzazione, e da quando?", o: ["OMG, dal novembre 1997", "ISO, dal 2010", "IEEE, dal 1985", "W3C, dal 2005"], e: "Standard OMG dal novembre 1997; oggi UML 2.5." },
  { c: "uml", q: "Cosa dice la regola 80/20 su UML?", o: ["Con il 20% di UML si modella l'80% dei sistemi", "L'80% dei diagrammi è sbagliato", "Il 20% del tempo va speso a modellare", "L'80% dei sistemi non ha bisogno di UML"], e: "Conviene imparare bene quel 20%." },
  { c: "uml", q: "Il modello funzionale (cosa fa il sistema) si descrive con…", o: ["Lo use case diagram", "Il class diagram", "Il sequence diagram", "Il package diagram"], e: "Funzionale = use case · a oggetti = class · dinamico = sequence, statechart, activity." },
  { c: "uml", q: "Quali diagrammi descrivono il modello dinamico?", o: ["Sequence, statechart e activity", "Use case e class", "Solo il class diagram", "Package e deployment"], e: "Il modello dinamico descrive il comportamento nel tempo." },
  { c: "uml", q: "In uno use case diagram, come si disegnano attore e caso d'uso?", o: ["Attore = omino, caso d'uso = ovale", "Attore = ovale, caso d'uso = rettangolo", "Attore = rettangolo, caso d'uso = omino", "Attore = cerchio, caso d'uso = rombo"], e: "Omino per il ruolo esterno, ovale per la funzionalità." },
  { c: "uml", q: "Cos'è lo use case model?", o: ["L'insieme di tutti i casi d'uso, che descrivono completamente il sistema", "Un singolo caso d'uso molto dettagliato", "Il class diagram degli attori", "Il template del corso"], e: "Tutti i casi d'uso insieme descrivono il sistema completo." },
  { c: "uml", q: "Una stessa persona può corrispondere a più attori?", o: ["Sì: l'attore è un ruolo, e una persona può avere più ruoli", "No, ogni persona è un solo attore", "Solo se è un amministratore", "Solo se gli attori sono sistemi esterni"], e: "Attore = ruolo esterno, persona o altro sistema." },
  { c: "uml", q: "ValidateUser specializzato in CheckPassword e CheckFingerprint. Che relazione è?", o: ["Generalizzazione", "<<include>>", "<<extend>>", "Composizione"], e: "Generalizzazione tra casi d'uso: freccia dal figlio al padre, triangolo vuoto." },
  { c: "uml", q: "\"Il pagamento richiede SEMPRE l'autenticazione\", messa a fattor comune. Che relazione è?", o: ["<<include>>", "<<extend>>", "Generalizzazione", "Aggregazione"], e: "Include: \"lo uso sempre\". Extend: \"a volte succede anche questo\"." },
  { c: "uml", q: "\"Se il credito non basta, mostra un avviso\": un comportamento che si attiva solo in certe condizioni. Che relazione è?", o: ["<<extend>>", "<<include>>", "Generalizzazione", "Associazione"], e: "Extend = comportamento eccezionale o opzionale." },
  { c: "uml", q: "In che verso va la freccia di <<include>>?", o: ["Dal caso base al caso incluso", "Dal caso incluso al caso base", "Dall'attore al caso d'uso", "Non ha verso"], e: "Include: base → incluso. Extend: estensione → base (il verso opposto, ed è lì il trabocchetto)." },
  { c: "uml", q: "Un rombo vuoto su un'associazione indica…", o: ["Aggregazione: le parti possono vivere da sole", "Composizione: le parti muoiono col tutto", "Ereditarietà", "Dipendenza"], e: "Rombo vuoto = aggregazione. Rombo pieno = composizione." },
  { c: "uml", q: "Come si disegna l'ereditarietà nel class diagram?", o: ["Freccia con triangolo vuoto verso la superclasse", "Rombo pieno", "Linea tratteggiata con <<extend>>", "Rombo vuoto"], e: "La sottoclasse è un tipo speciale della superclasse." },
  { c: "uml", q: "\"Ogni Country ha una capitale City\" e \"un Polygon ha molti Point\" sono associazioni…", o: ["1-a-1 e 1-a-molti", "1-a-molti e 1-a-1", "Entrambe 1-a-molti", "Entrambe molti-a-molti"], e: "I numeri sulla linea sono la molteplicità." },
  { c: "uml", q: "\"tarif2006:TarifSchedule\" scritto sottolineato è…", o: ["Un oggetto (istanza) della classe TarifSchedule", "Una classe astratta", "Un attore", "Un package"], e: "Istanza: nome sottolineato nella forma nome:Classe, con attributi che hanno valori." },
  { c: "uml", q: "Cosa contiene una classe nel class diagram?", o: ["Nome, attributi e operazioni", "Solo il nome", "Attori e casi d'uso", "Stati e transizioni"], e: "Esempio: TarifSchedule con attributo zone2price e operazione getPrice(Zone)." },
  { c: "uml", q: "In quali attività si usa il class diagram?", o: ["Analisi, system design e object design", "Solo nella codifica", "Solo nel test", "Solo nella raccolta dei requisiti"], e: "In analisi descrive i concetti del dominio, in system design i sottosistemi, in object design i dettagli." },
  { c: "uml", q: "Differenza tra attore e classe?", o: ["L'attore è esterno al sistema; la classe modella un'entità dentro il sistema", "Sono la stessa cosa disegnata in modo diverso", "L'attore è un'istanza di una classe", "La classe è sempre una persona"], e: "Attore = fuori e interagisce. Classe = astrazione dentro. Oggetto = istanza di una classe." },
  { c: "uml", q: "Nel sequence diagram, cosa sono le linee tratteggiate verticali?", o: ["Le lifeline degli oggetti", "I messaggi di ritorno", "Le dipendenze tra package", "Le transizioni"], e: "Rettangoli = istanze, linee tratteggiate = lifeline, frecce = messaggi, rettangolini stretti = attivazioni." },
  { c: "uml", q: "A cosa serve il sequence diagram in analisi?", o: ["A raffinare i casi d'uso e trovare oggetti nuovi", "A descrivere gli stati di un oggetto", "A raggruppare i sottosistemi", "A elencare i requisiti non funzionali"], e: "In system design serve invece a definire le interfacce dei sottosistemi." },
  { c: "uml", q: "\"UML dice in che ordine lavorare\". Vero o falso?", o: ["Falso: UML è un linguaggio, dice come disegnare, non in che ordine lavorare", "Vero: è un metodo di sviluppo completo", "Vero, ma solo per la fase di analisi", "Falso: UML serve solo per il codice"], e: "UML è una notazione, non un metodo." },
  // 05 · Statechart, activity, package (altre)
  { c: "state", q: "Come si disegna lo stato finale in uno statechart?", o: ["Pallino cerchiato (a bersaglio)", "Pallino pieno", "Rombo", "Barra spessa"], e: "Stato iniziale = pallino pieno. Stato finale = pallino cerchiato." },
  { c: "state", q: "Come si disegna uno stato?", o: ["Rettangolo con angoli arrotondati", "Ovale", "Rombo", "Omino"], e: "Lo stato è una condizione dell'oggetto, disegnata come rettangolo arrotondato." },
  { c: "state", q: "Dentro uno stato, cosa indica entry/?", o: ["Un'azione eseguita all'ingresso nello stato", "Un'azione eseguita all'uscita", "Un'attività che dura finché si resta nello stato", "L'evento che fa uscire dallo stato"], e: "entry/ all'ingresso · exit/ all'uscita · do/ attività che dura finché si resta lì." },
  { c: "state", q: "Dentro uno stato, cosa indica exit/?", o: ["Un'azione eseguita all'uscita dallo stato", "Lo stato finale", "Un'azione all'ingresso", "La guardia della transizione"], e: "exit/ si esegue quando si lascia lo stato." },
  { c: "state", q: "Quando scatta una transizione \"evento [guardia] / azione\"?", o: ["Quando arriva l'evento e la guardia è vera", "Appena la guardia diventa vera, anche senza evento", "Quando finisce l'azione", "Sempre, dopo un tempo fisso"], e: "Arriva l'evento, si controlla la guardia: se è vera si esegue l'azione e si cambia stato." },
  { c: "state", q: "Nell'etichetta di una transizione, cosa sta tra parentesi quadre?", o: ["La guardia, cioè una condizione", "L'azione da eseguire", "Il nome dello stato di arrivo", "L'evento"], e: "Forma: evento [guardia] / azione." },
  { c: "state", q: "Nell'etichetta \"moneta [credito ≥ prezzo] / eroga\", qual è l'azione?", o: ["eroga", "moneta", "credito ≥ prezzo", "Non c'è azione"], e: "moneta = evento · [credito ≥ prezzo] = guardia · eroga = azione." },
  { c: "state", q: "Decomposizione OR di uno stato significa…", o: ["L'oggetto è in uno solo dei sotto-stati", "L'oggetto è in tutti i sotto-stati insieme", "Lo stato ha due stati finali", "Le transizioni sono facoltative"], e: "OR = un sotto-stato alla volta. AND = uno per ogni regione concorrente." },
  { c: "state", q: "Nella decomposizione AND, come si separano le regioni concorrenti?", o: ["Con una linea tratteggiata", "Con una barra spessa", "Con un rombo", "Con una freccia"], e: "Le regioni parallele sono separate da linee tratteggiate dentro lo stato." },
  { c: "state", q: "Uno stato con decomposizione AND ha 2 regioni. In quanti sotto-stati è l'oggetto contemporaneamente?", o: ["2, uno per regione", "1", "Tutti i sotto-stati", "Nessuno finché non arriva un evento"], e: "AND = concorrenza: un sotto-stato attivo per ciascuna regione." },
  { c: "state", q: "Cambio automatico: MarciaAvanti contiene Prima, Seconda e Terza. Che tipo di stato è MarciaAvanti?", o: ["Uno stato composto con decomposizione OR", "Uno stato con decomposizione AND", "Uno stato finale", "Un'attività"], e: "Si è in una sola marcia alla volta: decomposizione OR." },
  { c: "state", q: "Qual è la differenza tra statechart e activity diagram?", o: ["Statechart = gli stati di UN oggetto; activity = i passi di UN processo", "Sono equivalenti", "Statechart = un processo; activity = un oggetto", "L'activity mostra solo le classi"], e: "Statechart: come cambia un oggetto. Activity: come scorre un'attività." },
  { c: "state", q: "Cos'è un activity diagram?", o: ["Un diagramma di flusso moderno: la sequenza di attività di un processo, anche in parallelo", "La struttura statica delle classi", "L'elenco dei casi d'uso", "La vita di un singolo oggetto"], e: "Elementi: attività, start ed end, fork e join, branch e merge." },
  { c: "state", q: "Cosa fa il join in un activity diagram?", o: ["Aspetta che finiscano tutti i rami paralleli", "Sceglie un ramo in base a una condizione", "Divide il flusso in rami paralleli", "Termina il diagramma"], e: "Fork divide in parallelo, join aspetta tutti. Entrambi sono barre spesse." },
  { c: "state", q: "Come si disegna un branch e cosa fa?", o: ["Rombo: sceglie un solo ramo in base a una [condizione]", "Barra spessa: crea rami paralleli", "Pallino pieno: inizio del flusso", "Linea tratteggiata: separa le corsie"], e: "Branch e merge sono rombi; il merge riunisce i rami." },
  { c: "state", q: "Cosa fa il merge?", o: ["Riunisce i rami alternativi aperti da un branch", "Aspetta la fine di rami paralleli", "Divide il flusso", "Crea una swimlane"], e: "Merge chiude un branch (scelta), join chiude un fork (parallelismo)." },
  { c: "state", q: "\"Il pagamento e la preparazione del pacco avvengono in parallelo, poi si spedisce\": che elementi usi?", o: ["Fork e join", "Branch e merge", "Due stati finali", "Decomposizione OR"], e: "Parallelismo = fork (divide) e join (aspetta entrambi)." },
  { c: "state", q: "\"Se l'utente è registrato fa il login, altrimenti si registra\": che elementi usi?", o: ["Branch e merge", "Fork e join", "Swimlane", "Object flow"], e: "Una scelta con condizione: branch, poi merge per riunire." },
  { c: "state", q: "In un activity diagram, cosa mostra un object flow?", o: ["Gli oggetti che passano tra le attività, con il loro stato tra parentesi quadre", "Le chiamate di metodo nel tempo", "Le dipendenze tra package", "Gli stati di un oggetto"], e: "Esempio: Order [pagato] che passa da un'attività all'altra." },
  { c: "state", q: "Cos'è un package?", o: ["Una cartellina che raggruppa elementi del modello per gestire la complessità", "Un tipo di stato composto", "Un messaggio asincrono", "Un attore esterno"], e: "Ad esempio si usa per i sottosistemi." },
  { c: "state", q: "Il package A dipende dal package B. Cosa significa?", o: ["Un cambio in B può toccare A", "Un cambio in A può toccare B", "A e B non possono cambiare", "A contiene B"], e: "La freccia tratteggiata va da A (che dipende) a B." },
  { c: "state", q: "Vuoi descrivere come un ordine online passa da \"creato\" a \"pagato\" a \"spedito\". Quale diagramma?", o: ["Statechart", "Activity", "Use case", "Package"], e: "Gli stati di un singolo oggetto (l'ordine): statechart." },
  { c: "state", q: "Vuoi descrivere i passi del processo di reso, con chi fa cosa tra cliente e magazzino. Quale diagramma?", o: ["Activity con swimlane", "Statechart", "Class diagram", "Use case diagram"], e: "Un processo a passi, con corsie per chi lo svolge." },
  { c: "state", q: "Gli stati di un libro in biblioteca (acquisito, in prestito, in ritardo…) sono un esempio di…", o: ["Statechart", "Activity diagram", "Sequence diagram", "Package diagram"], e: "Un singolo oggetto, il libro, e come cambia stato." },
  // 06 · Requisiti (altre)
  { c: "req", q: "Il laser che doveva puntare a 10.023 piedi e puntava a 10.023 miglia è un esempio di…", o: ["Specifica ambigua", "Funzionalità indesiderata", "Requisito non realistico", "Vincolo implementativo"], e: "Un'unità di misura non definita: il requisito poteva essere letto in due modi." },
  { c: "req", q: "Il treno di Londra che partiva senza il macchinista è un esempio di…", o: ["Funzionalità indesiderata: un caso che nessuno aveva previsto", "Specifica ambigua sulle unità di misura", "Requisito non funzionale violato", "Errore di codifica"], e: "Nessuno aveva previsto quel caso: i requisiti erano incompleti." },
  { c: "req", q: "Con quale altro nome si chiama il problem statement?", o: ["Statement of Work", "Requirements Analysis Document", "Use case model", "Product backlog"], e: "Lo scrive il cliente ed è il punto di partenza dell'analisi." },
  { c: "req", q: "Quale di questi NON è un ingrediente del problem statement?", o: ["Il class diagram di design", "La situazione attuale", "Il calendario con milestone e consegna", "I criteri di accettazione del cliente"], e: "Ingredienti: situazione attuale, scenari, requisiti e vincoli, calendario, ambiente di destinazione, criteri di accettazione." },
  { c: "req", q: "\"Il server deve essere disponibile 24 ore su 24\" è un requisito…", o: ["Non funzionale", "Funzionale", "Vincolo (pseudo-requisito)", "Di dominio della soluzione"], e: "Aspetto visibile all'utente ma non legato a una funzione specifica." },
  { c: "req", q: "I requisiti funzionali descrivono…", o: ["Le interazioni tra sistema e ambiente, indipendenti dall'implementazione", "Il linguaggio di programmazione da usare", "Tempi di risposta e disponibilità", "La struttura interna del sistema"], e: "Esempio: \"Un operatore ARENA deve poter definire un nuovo gioco\"." },
  { c: "req", q: "\"Il sistema deve usare un database Oracle\", imposto dal cliente, è…", o: ["Un vincolo (pseudo-requisito)", "Un requisito funzionale", "Un requisito non funzionale di performance", "Uno scenario"], e: "Vincoli: imposti dal cliente o dall'ambiente (linguaggio, piattaforma…)." },
  { c: "req", q: "Cosa di solito NON dovrebbe stare nei requisiti?", o: ["Struttura del sistema, tecnologia, metodologia e linguaggio di sviluppo", "Le funzioni che l'utente userà", "I tempi di risposta attesi", "I criteri di accettazione"], e: "Se il cliente prova a imporli, il consiglio delle slide è: \"combatti!\"" },
  { c: "req", q: "Un progetto greenfield…", o: ["Parte da zero: non c'è un sistema precedente e i requisiti vengono da utenti e cliente", "Riscrive un sistema esistente con nuova tecnologia", "Cambia solo l'interfaccia di un sistema esistente", "Assembla componenti COTS"], e: "Greenfield = da zero. Re-engineering = riscrivere. Interface engineering = nuova interfaccia." },
  { c: "req", q: "Un'app per un servizio che prima non esisteva in nessuna forma è un progetto…", o: ["Greenfield", "Re-engineering", "Interface engineering", "Di manutenzione"], e: "Nessun sistema precedente: si parte da zero." },
  { c: "req", q: "Vuoi raccogliere opinioni da 500 utenti con dati confrontabili, spendendo poco. Quale tecnica?", o: ["Questionari", "Interviste", "Osservazione", "Focus group"], e: "Questionari: economici, tante persone, dati confrontabili; ma risposte superficiali." },
