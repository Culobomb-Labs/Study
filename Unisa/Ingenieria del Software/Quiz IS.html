  { c: "req", q: "Qual è lo svantaggio tipico dei questionari?", o: ["Risposte superficiali, senza possibilità di approfondire", "Sono lenti e costosi", "Chi parla di più domina", "Le persone osservate cambiano comportamento"], e: "Per approfondire servono le interviste, con domande di follow-up." },
  { c: "req", q: "Pro e contro delle interviste?", o: ["Dettagliate, con domande di follow-up; ma lente, costose e con poche persone", "Economiche e con tante persone; ma superficiali", "Fanno emergere idee di gruppo; ma qualcuno domina", "Scoprono cose non dette; ma le persone cambiano comportamento"], e: "Ogni tecnica ha un pro e un contro tipici: impara le coppie." },
  { c: "req", q: "Qual è il contro dell'osservazione?", o: ["Richiede tempo e le persone osservate cambiano comportamento", "Le risposte sono superficiali", "Costa poco ma dà idee poche e non rappresentative", "Rischia di copiare invece di innovare"], e: "Il pro è che scopre cose che gli utenti non sanno dire." },
  { c: "req", q: "Qual è il rischio dell'analisi della concorrenza?", o: ["Copiare invece di innovare", "Risposte superficiali", "Costi altissimi", "Nessun dato confrontabile"], e: "Il pro: idee già collaudate." },
  { c: "req", q: "Qual è il limite dei suggerimenti spontanei degli utenti?", o: ["Sono pochi e non rappresentativi", "Costano troppo", "Richiedono un workshop", "Sono sempre ambigui"], e: "Costano poco e danno idee reali, ma arrivano da pochi utenti." },
  { c: "req", q: "Cos'è il JAD (Joint Application Design)?", o: ["Un workshop in cui utenti, clienti e sviluppatori scrivono insieme i requisiti", "Un tipo di diagramma UML", "Un questionario standardizzato", "Un test di accettazione automatico"], e: "Sessioni intensive in cui tutti scrivono i requisiti insieme." },
  { c: "req", q: "Criterio di validazione \"completezza\": cosa chiede?", o: ["Sono descritti tutti gli scenari, anche quelli eccezionali?", "I requisiti si contraddicono?", "Si possono implementare e consegnare?", "Rappresentano il punto di vista del cliente?"], e: "Il caso del treno senza macchinista è un difetto di completezza." },
  { c: "req", q: "Criterio di validazione \"realismo\": cosa chiede?", o: ["Si possono implementare e consegnare?", "Ci sono contraddizioni?", "Ogni funzione si riconduce a un requisito?", "Sono descritti anche i casi eccezionali?"], e: "Correttezza, completezza, consistenza, realismo, tracciabilità." },
  { c: "req", q: "Criterio \"tracciabilità\": cosa chiede?", o: ["Ogni funzione del sistema si può ricondurre a un requisito?", "I requisiti sono scritti in voce attiva?", "Il sistema è disponibile 24 ore su 24?", "Il cliente ha firmato il contratto?"], e: "Si deve poter seguire il filo da ogni funzione al requisito che la giustifica." },
  { c: "req", q: "Criterio \"correttezza\": cosa chiede?", o: ["I requisiti rappresentano il punto di vista del cliente?", "Il codice è privo di bug?", "Ci sono requisiti che si contraddicono?", "Ogni requisito ha una priorità?"], e: "Correttezza qui riguarda i requisiti rispetto al cliente, non il codice." },
  { c: "req", q: "Quando si validano i requisiti?", o: ["All'inizio e poi alla consegna, con il test di accettazione", "Solo alla fine del progetto", "Solo durante la codifica", "Mai: li valida il cliente da solo"], e: "Prima si controllano coi 5 criteri, poi alla consegna li verifica il test di accettazione." },
  { c: "req", q: "Qual è il problema pratico durante l'elicitation?", o: ["I requisiti cambiano in fretta: servono strumenti con un repository condiviso", "Il cliente non scrive mai il problem statement", "Non esistono tecniche per raccoglierli", "I requisiti non funzionali non si possono scrivere"], e: "Per questo si tengono in un repository condiviso." },
  { c: "req", q: "Nel RAD, la sezione \"sistema proposto\" contiene…", o: ["Requisiti funzionali e non funzionali e i modelli: scenari, use case, object model, modello dinamico, interfaccia", "Solo il codice sorgente", "Solo il calendario di progetto", "Le minute delle riunioni"], e: "RAD: introduzione, sistema attuale, sistema proposto, glossario." },
  { c: "req", q: "Cos'è ARENA, l'esempio del libro?", o: ["Una piattaforma per comunità di giocatori online con tornei e punteggi", "Un sistema di gestione delle emergenze", "Un bancomat", "Un sistema di biglietteria ferroviaria"], e: "ARENA registra giochi e giocatori, organizza tornei, tiene i punteggi e ospita inserzionisti." },
  // 07 · Buoni requisiti (altre)
  { c: "reqq", q: "In ISO 29148, \"should\" (dovrebbe) indica…", o: ["Una preferenza, desiderata ma non obbligatoria", "Un requisito obbligatorio", "Un testo descrittivo", "Un suggerimento da ignorare"], e: "shall = obbligatorio · should = preferenza · may = concessione · is/are/was = descrizione." },
  { c: "reqq", q: "In ISO 29148, \"may\" (può) indica…", o: ["Un suggerimento, una concessione", "Un requisito obbligatorio", "Un obiettivo desiderato", "Un divieto"], e: "Le parole chiave hanno un significato preciso: usale sempre allo stesso modo." },
  { c: "reqq", q: "Frasi con \"is / are / was\" in un documento di requisiti sono…", o: ["Testo descrittivo, non requisiti", "Requisiti obbligatori", "Requisiti opzionali", "Vincoli legali"], e: "Solo \"shall\" introduce un requisito obbligatorio." },
  { c: "reqq", q: "Quale formulazione rispetta la voce attiva?", o: ["The system shall detect the error", "The error should be detected", "The error shall be detected by the system", "Detection of the error is required"], e: "Voce attiva: si capisce subito chi fa l'azione." },
  { c: "reqq", q: "Quale forma va evitata nei requisiti?", o: ["\"shall not\": meglio frasi positive", "\"shall\"", "Una condizione iniziale", "Un vincolo misurabile"], e: "Frasi positive, voce attiva, termini del glossario." },
  { c: "reqq", q: "Perché i termini dei requisiti vanno messi in un glossario?", o: ["Per definirli e usarli sempre allo stesso modo", "Per tradurli in inglese", "Per ordinarli per priorità", "Perché lo richiede MoSCoW"], e: "Un termine usato in due modi diversi crea ambiguità." },
  { c: "reqq", q: "\"Quando riceve il segnale x, il sistema deve impostare il bit entro 2 secondi\": cos'è \"entro 2 secondi\"?", o: ["Il vincolo", "La condizione", "L'oggetto", "Il soggetto"], e: "[Condizione] quando riceve x · [Soggetto] il sistema · [Azione] deve impostare · [Oggetto] il bit · [Vincolo] entro 2 secondi." },
  { c: "reqq", q: "Nella stessa frase, \"quando riceve il segnale x\" è…", o: ["La condizione", "Il vincolo", "L'azione", "L'oggetto"], e: "La sintassi ISO parte dalla condizione." },
  { c: "reqq", q: "\"Il sistema deve supportare circa 100 utenti\": qual è il problema?", o: ["\"Circa\" è ambiguo e non verificabile", "Manca il soggetto", "È un vincolo legale", "Usa la voce passiva"], e: "Parole da evitare: circa, almeno, veloce, robusto, user friendly, se possibile, e/o, ecc." },
  { c: "reqq", q: "Un requisito \"libero da implementazione\"…", o: ["Dice cosa deve fare il sistema, non come", "Non ha bisogno di essere testato", "Non ha una priorità", "È scritto senza la parola shall"], e: "Il come è compito del design." },
  { c: "reqq", q: "Un requisito \"verificabile\"…", o: ["Si può testare", "Viene dal cliente", "Non contraddice altri requisiti", "È scritto al passivo"], e: "Se non si può testare, non si può dire se è soddisfatto." },
  { c: "reqq", q: "\"Il sistema deve permettere il login e inviare un report settimanale\": quale caratteristica viola?", o: ["Singolare: esprime due cose", "Fattibile", "Necessario", "Tracciabile"], e: "Un requisito, una cosa sola: vanno separati." },
  { c: "reqq", q: "\"Il sistema deve salvare i clienti in una HashMap\": quale caratteristica viola?", o: ["Libero da implementazione", "Singolare", "Consistente", "Completo"], e: "Dice come farlo (una struttura dati), non cosa deve fare." },
  { c: "reqq", q: "L'INSIEME dei requisiti deve essere…", o: ["Completo, consistente, affordable e bounded", "Singolare, attivo e positivo", "Must, Should, Could e Won't", "Specific, Measurable e Traceable"], e: "Le caratteristiche del singolo requisito sono altre (necessario, non ambiguo, verificabile…)." },
  { c: "reqq", q: "Che cosa significa che l'insieme dei requisiti è \"bounded\"?", o: ["È limitato a ciò che serve", "È realizzabile con budget e tempi", "Non ha contraddizioni", "Copre tutti gli scenari"], e: "Affordable = realizzabile con budget e tempi. Bounded = limitato al necessario." },

const STORE = "quiz-ingsw";
const QUADERNO = "Quaderno%20di%20Ingegneria%20del%20Software.html";
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const chap = id => CHAPTERS.find(c => c.id === id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const load = () => { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; } };
const store = d => { try { localStorage.setItem(STORE, JSON.stringify(d)); } catch (e) {} };

/* Quiz dinamico: ogni giro di un capitolo pesca PER_GIRO domande dal capitolo intero.
   Per ogni domanda si ricorda: v = volte vista, w = volte sbagliata, s = risposte giuste di fila.
   Escono prima quelle sbagliate e non ancora recuperate, poi quelle mai viste; quelle già sapute escono di rado.
   Le domande dell'ultimo giro dello stesso capitolo vengono evitate, così i giri si somigliano poco. */
const STATS = "quiz-ingsw-domande";
const PER_GIRO = 10;
const SAPUTA = 2; // giuste di fila per considerarla saputa
const qid = q => { let h = 5381; const t = q.c + "|" + q.q; for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
Q.forEach(q => { q.id = qid(q); });
const loadStats = () => { try { return JSON.parse(localStorage.getItem(STATS)) || {}; } catch (e) { return {}; } };
const saveStats = d => { try { localStorage.setItem(STATS, JSON.stringify(d)); } catch (e) {} };
const known = (st, id) => { const x = st[id]; return !!x && x.s >= SAPUTA; };
function weight(x) {
  if (!x) return 3;                         // mai vista
  if (x.w > 0 && x.s < SAPUTA) return 6;    // sbagliata, da recuperare
  if (x.s >= SAPUTA + 1) return 0.35;       // la sai bene
  if (x.s >= SAPUTA) return 0.7;            // la sai
  return 1.5;
}
// estrazione pesata senza ripetizioni (chiave = random^(1/peso))
function pick(pool, n, avoid) {
  const st = loadStats(), skip = new Set(avoid || []);
  const scored = pool.map(q => {
    let w = weight(st[q.id]);
    if (skip.has(q.id) && w < 6) w *= 0.15;
    return { q, k: Math.pow(Math.random(), 1 / w) };
  });
  return scored.sort((a, b) => b.k - a.k).slice(0, n).map(x => x.q);
}
function chapterRun(cid) {
  const st = loadStats(), last = (st._ultimo || {})[cid] || [];
  return shuffle(pick(Q.filter(q => q.c === cid), PER_GIRO, last));
}
function simRun() {
  const st = loadStats(), last = (st._ultimo || {}).sim || [];
  let out = [];
  CHAPTERS.forEach(c => { out = out.concat(pick(Q.filter(q => q.c === c.id), 2, last)); });
  const used = new Set(out.map(q => q.id));
  out = out.concat(pick(Q.filter(q => !used.has(q.id)), 20 - out.length, last));
  return shuffle(out);
}
function rememberRun(key, items) {
  const st = loadStats(); st._ultimo = st._ultimo || {}; st._ultimo[key] = items.map(it => it.q.id); saveStats(st);
}
function record(q, ok) {
  const st = loadStats(), x = st[q.id] || { v: 0, w: 0, s: 0 };
  x.v++; if (ok) x.s++; else { x.w++; x.s = 0; }
  st[q.id] = x; saveStats(st);
}

let run = null; // { title, items: [{q, opts, right}], i, answers: [] }

function home() {
  run = null;
  document.body.classList.remove("running");
  const saved = load(), st = loadStats();
  const totKnown = Q.filter(q => known(st, q.id)).length;
  const chips = CHAPTERS.map(c => {
    const all = Q.filter(q => q.c === c.id), n = all.length, s = saved[c.id];
    const k = all.filter(q => known(st, q.id)).length, rip = all.filter(q => { const x = st[q.id]; return x && x.w > 0 && x.s < SAPUTA; }).length;
    const pct = s ? Math.round(100 * s.best / s.total) : null;
    const best = s ? `migliore <b class="${pct >= 80 ? "" : "mid"}">${s.best}/${s.total}</b>` : "non ancora fatto";
    return `<button class="chap" type="button" data-c="${c.id}"><span class="n">${c.n}</span><span class="t">${esc(c.t)}</span><span class="s">${PER_GIRO} a giro su ${n} · ${best}</span><span class="s">ne sai <b class="${k === n ? "" : "mid"}">${k}/${n}</b>${rip ? ` · ${rip} da recuperare` : ""}</span><span class="m"><i style="width:${100 * k / n}%"></i></span></button>`;
  }).join("");
  app.innerHTML = `
    <section class="sim">
      <h2>Simulazione della prova</h2>
      <p>20 domande miste, almeno 2 per ogni capitolo, diverse a ogni giro. Alla fine vedi il punteggio per capitolo.</p>
      <p class="tot">Domande che sai già: <b>${totKnown}</b> su ${Q.length}</p>
      <button class="btn" type="button" id="go-sim">Inizia →</button>
    </section>
    <p class="label">Un capitolo alla volta</p>
    <div class="chaps">${chips}</div>
    <p class="note">Consiglio: fai il quiz di un capitolo subito dopo averlo studiato, poi la simulazione la sera prima della prova. Punta ad almeno l'80% per capitolo.<br>Ogni giro pesca ${PER_GIRO} domande diverse dal capitolo. Quelle che sbagli tornano nei giri successivi finché non le azzecchi ${SAPUTA} volte di fila: a quel punto contano come sapute.</p>`;
  app.querySelector("#go-sim").onclick = () => start("Simulazione della prova", simRun(), null, "sim");
  app.querySelectorAll(".chap").forEach(b => b.onclick = () => {
    const c = chap(b.dataset.c);
    start(`${c.n} · ${c.t}`, chapterRun(c.id), c.id, c.id);
  });
  window.scrollTo({ top: 0 });
}

function start(title, questions, chapterId, key, from) {
  run = { title, chapterId, key, from, i: 0, answers: [], items: questions.map(q => {
    const opts = shuffle(q.o.map((t, k) => ({ t, ok: k === 0 })));
    return { q, opts };
  }) };
  if (key) rememberRun(key, run.items);
  ask();
}

function ask() {
  document.body.classList.add("running");
  const it = run.items[run.i], c = chap(it.q.c), n = run.items.length;
  app.innerHTML = `
    <div class="qhead"><span>${esc(run.title)}</span><span>Domanda ${run.i + 1} di ${n} · <a href="#" id="quit">esci</a></span></div>
    <div class="bar"><i style="width:${100 * run.i / n}%"></i></div>
    <span class="tag">${c.n} · ${esc(c.t)}</span>
    <h2 class="q">${esc(it.q.q)}</h2>
    <div class="opts" role="group" aria-label="Risposte">${it.opts.map((o, k) => `<button class="opt" type="button" data-k="${k}"><span class="k">${"ABCD"[k]}</span><span>${esc(o.t)}</span></button>`).join("")}</div>
    <div id="after"></div>
    <p class="hint">Tasti: 1–4 o A–D per rispondere · Invio per andare avanti</p>`;
  app.querySelector("#quit").onclick = e => { e.preventDefault(); home(); };
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.k));
  const first = app.querySelector(".opt"); if (first) first.focus({ preventScroll: true });
  window.scrollTo({ top: 0 });
}

function answer(k) {
  const it = run.items[run.i];
  if (run.answers[run.i] !== undefined) return;
  const ok = it.opts[k].ok;
  run.answers[run.i] = { k, ok };
  record(it.q, ok);
  app.querySelectorAll(".opt").forEach((b, j) => {
    b.disabled = true;
    if (it.opts[j].ok) b.classList.add("right");
    else if (j === k) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const last = run.i === run.items.length - 1;
  app.querySelector("#after").innerHTML = `
    <div class="fb"><b class="${ok ? "ok" : "ko"}">${ok ? "Giusto." : "Non è questa."}</b><p>${esc(it.q.e)}</p>
      <p><a href="${QUADERNO}#${it.q.c}">Rivedi il capitolo ${chap(it.q.c).n} nel quaderno →</a></p></div>
    <div class="next"><button class="btn solid" type="button" id="next">${last ? "Vedi il risultato" : "Avanti →"}</button></div>`;
  const nx = app.querySelector("#next");
  nx.onclick = () => { if (last) result(); else { run.i++; ask(); } };
  nx.focus({ preventScroll: true });
}

function result() {
  const n = run.items.length, good = run.answers.filter(a => a && a.ok).length, pct = Math.round(100 * good / n);
  if (run.chapterId) {
    const saved = load(), prev = saved[run.chapterId];
    saved[run.chapterId] = { best: Math.max(good, prev ? prev.best : 0), last: good, total: n };
    store(saved);
  }
  const by = {};
  run.items.forEach((it, i) => { const c = it.q.c; by[c] = by[c] || { ok: 0, n: 0 }; by[c].n++; if (run.answers[i] && run.answers[i].ok) by[c].ok++; });
  const rows = CHAPTERS.filter(c => by[c.id]).map(c => `<li><span>${c.n} · ${esc(c.t)}</span><span class="m"><i style="width:${100 * by[c.id].ok / by[c.id].n}%"></i></span><span class="v">${by[c.id].ok}/${by[c.id].n}</span></li>`).join("");
  const wrong = run.items.map((it, i) => ({ it, a: run.answers[i] })).filter(x => !x.a.ok);
  const errs = wrong.map(({ it, a }) => `<div class="err"><p class="eq">${esc(it.q.q)}</p>
      <p class="yours">La tua risposta: ${esc(it.opts[a.k].t)}</p>
      <p><b>Giusta:</b> ${esc(it.q.o[0])}</p><p>${esc(it.q.e)}</p>
      <p><a href="${QUADERNO}#${it.q.c}">Capitolo ${chap(it.q.c).n} nel quaderno →</a></p></div>`).join("");
  const from = run.key ? { title: run.title, cid: run.chapterId, key: run.key } : run.from;
  const verdict = pct >= 90 ? "Ottimo, questa parte la sai." : pct >= 70 ? "Buono. Ripassa gli errori qui sotto e rifallo." : pct >= 50 ? "Ci sei quasi: rileggi i capitoli segnati e riprova domani." : "Da ripassare: riprendi il quaderno e poi rifai il quiz.";
  app.innerHTML = `
    <p class="label">${esc(run.title)}</p>
    <div class="score"><b>${good}/${n}</b><span>${pct}% di risposte giuste</span></div>
    <p class="verdict">${verdict}</p>
    ${from && from.cid ? (() => { const st = loadStats(), all = Q.filter(q => q.c === from.cid), k = all.filter(q => known(st, q.id)).length; return `<p class="label">Capitolo ${chap(from.cid).n}: ne sai ${k} su ${all.length}</p><div class="bar"><i style="width:${100 * k / all.length}%"></i></div>`; })() : ""}
    ${Object.keys(by).length > 1 ? `<p class="label">Per capitolo</p><ul class="byc">${rows}</ul>` : ""}
    ${wrong.length ? `<p class="label">Da rivedere (${wrong.length})</p><div class="errs">${errs}</div>` : ""}
    <div class="actions">
      ${wrong.length ? `<button class="btn solid" type="button" id="redo">Rifai solo gli errori</button>` : ""}
      ${from ? `<button class="btn" type="button" id="again">${from.cid ? `Altre ${PER_GIRO} domande` : "Nuova simulazione"}</button>` : ""}
      <button class="btn" type="button" id="back">Torna ai capitoli</button>
    </div>`;
  const redo = app.querySelector("#redo");
  if (redo) redo.onclick = () => { start((from ? from.title : run.title) + " · errori", shuffle(wrong.map(w => w.it.q)), null, null, from); };
  const again = app.querySelector("#again");
  if (again && from) again.onclick = () => start(from.title, from.cid ? chapterRun(from.cid) : simRun(), from.cid, from.key);
  app.querySelector("#back").onclick = home;
  window.scrollTo({ top: 0 });
}

document.addEventListener("keydown", e => {
  if (!run || e.metaKey || e.ctrlKey || e.altKey) return;
  if (document.querySelector(".ua-pal:not([hidden])")) return;
  const key = e.key.toLowerCase();
  const idx = "1234".indexOf(key) !== -1 ? "1234".indexOf(key) : "abcd".indexOf(key);
  if (idx !== -1 && run.answers[run.i] === undefined && run.items[run.i] && idx < run.items[run.i].opts.length) { e.preventDefault(); answer(idx); }
  else if (e.key === "Enter" && run.answers[run.i] !== undefined) { const nx = document.getElementById("next"); if (nx && document.activeElement !== nx) { e.preventDefault(); nx.click(); } }
});

home();
</script>
</body>
</html>
