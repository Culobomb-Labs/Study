const STORE = "quiz-ingsw";
const QUADERNO = "Quaderno%20di%20Ingegneria%20del%20Software.html";
/* Link al punto del quaderno: si apre nella stessa pagina, il quaderno cerca il paragrafo che parla della domanda,
   lo evidenzia e mostra "Torna al quiz". Tornando, il quiz riprende dalla domanda o dal risultato (vedi saveRun). */
const qlink = (q, label) => `<a class="qlink" data-cap="${esc(chap(q.c).n + " · " + chap(q.c).t)}" href="${QUADERNO}?trova=${encodeURIComponent(q.q)}&risp=${encodeURIComponent(String(q.o[0]).slice(0, 300))}&perche=${encodeURIComponent(String(q.e || "").slice(0, 300))}&da=quiz#${q.c}">${label}</a>`;
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const chap = id => CHAPTERS.find(c => c.id === id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const load = () => { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; } };
const store = d => { try { localStorage.setItem(STORE, JSON.stringify(d)); } catch (e) {} };

/* Quiz dinamico: ogni giro di un capitolo pesca PER_GIRO domande dal capitolo intero.
   Per ogni domanda si ricorda: v = volte vista, w = volte sbagliata, s = risposte giuste di fila.
   Escono prima quelle sbagliate e non ancora recuperate, poi quelle mai viste; quelle già sapute escono di rado.
   Le domande dell'ultimo giro dello stesso capitolo vengono evitate, così i giri si somigliano poco. */
const STATS = "quiz-ingsw-domande";
const PER_GIRO = 10;
const SAPUTA = 2; // giuste di fila per considerarla saputa
const qid = q => { let h = 5381; const t = q.c + "|" + q.q; for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
Q.forEach(q => { q.id = qid(q); });
const loadStats = () => { try { return JSON.parse(localStorage.getItem(STATS)) || {}; } catch (e) { return {}; } };
const saveStats = d => { try { localStorage.setItem(STATS, JSON.stringify(d)); } catch (e) {} };
const known = (st, id) => { const x = st[id]; return !!x && x.s >= SAPUTA; };
function weight(x) {
  if (!x) return 3;                         // mai vista
  if (x.w > 0 && x.s < SAPUTA) return 6;    // sbagliata, da recuperare
  if (x.s >= SAPUTA + 1) return 0.35;       // la sai bene
  if (x.s >= SAPUTA) return 0.7;            // la sai
  return 1.5;
}
// estrazione pesata senza ripetizioni (chiave = random^(1/peso))
function pick(pool, n, avoid, boostDep) {
  const st = loadStats(), skip = new Set(avoid || []);
  const scored = pool.map(q => {
    let w = weight(st[q.id]);
    if (boostDep && q.d) w *= boostDep; // nelle simulazioni le domande del deposito escono più spesso
    if (skip.has(q.id) && w < 6) w *= 0.15;
    return { q, k: Math.pow(Math.random(), 1 / w) };
  });
  return scored.sort((a, b) => b.k - a.k).slice(0, Math.max(0, n)).map(x => x.q);
}
function chapterRun(cid) {
  const st = loadStats(), last = (st._ultimo || {})[cid] || [];
  return shuffle(pick(Q.filter(q => q.c === cid), PER_GIRO, last));
}
/* Due simulazioni: "sim" = prova intercorso (15 domande: 5 uscite alla prova del 5 novembre, almeno 1 per capitolo della prova),
   "simtutto" = tutto il corso (25 domande, almeno 1 per capitolo). */
/* Le domande con d: n vengono dal "Deposito domande" del corso (le più probabili all'esame):
   ogni simulazione ne contiene almeno metà; "dep" usa solo quelle. */
const SIMS = {
  sim: { title: "Simulazione prova intercorso", tot: 15, min: 1, x: 5, dep: 0.5, chaps: () => CHAPTERS.filter(c => c.p) },
  simtutto: { title: "Simulazione su tutto il corso", tot: 25, min: 1, dep: 0.5, chaps: () => CHAPTERS },
  dep: { title: "Domande del deposito", tot: 30, min: 0, dep: 1, chaps: () => CHAPTERS }
};
function simRun(key) {
  key = key || "sim";
  const S = SIMS[key], st = loadStats(), last = (st._ultimo || {})[key] || [];
  const ids = new Set(S.chaps().map(c => c.id));
  const pool = Q.filter(q => (ids.has(q.c) || (S.x && q.x)) && (S.dep < 1 || q.d || (S.x && q.x)));
  let out = [];
  // domande uscite davvero alla prova del 5 novembre (x: 1), di qualunque capitolo
  if (S.x) out = pick(pool.filter(q => q.x), S.x, last);
  if (S.min) S.chaps().forEach(c => {
    const have = out.filter(q => q.c === c.id).length, used0 = new Set(out.map(q => q.id));
    out = out.concat(pick(pool.filter(q => q.c === c.id && !used0.has(q.id)), S.min - have, last, 4));
  });
  // quota del deposito
  const wantDep = Math.min(Math.ceil(S.tot * S.dep), pool.filter(q => q.d).length);
  let used = new Set(out.map(q => q.id));
  const haveDep = out.filter(q => q.d).length;
  const addDep = Math.min(wantDep - haveDep, S.tot - out.length);
  if (addDep > 0) out = out.concat(pick(pool.filter(q => q.d && !used.has(q.id)), addDep, last));
  used = new Set(out.map(q => q.id));
  out = out.concat(pick(pool.filter(q => !used.has(q.id)), S.tot - out.length, last));
  return shuffle(out);
}
function rememberRun(key, items) {
  const st = loadStats(); st._ultimo = st._ultimo || {}; st._ultimo[key] = items.map(it => it.q.id); saveStats(st);
}
function record(q, ok) {
  const st = loadStats(), x = st[q.id] || { v: 0, w: 0, s: 0 };
  x.v++; if (ok) x.s++; else { x.w++; x.s = 0; }
  st[q.id] = x; saveStats(st);
}

let run = null; // { title, items: [{q, opts, right}], i, answers: [] }

function home() {
  run = null;
  document.body.classList.remove("running");
  const saved = load(), st = loadStats();
  const totKnown = Q.filter(q => known(st, q.id)).length;
  const chips = CHAPTERS.map(c => {
    const all = Q.filter(q => q.c === c.id), n = all.length, s = saved[c.id];
    const k = all.filter(q => known(st, q.id)).length, rip = all.filter(q => { const x = st[q.id]; return x && x.w > 0 && x.s < SAPUTA; }).length;
    const pct = s ? Math.round(100 * s.best / s.total) : null;
    const best = s ? `migliore <b class="${pct >= 80 ? "" : "mid"}">${s.best}/${s.total}</b>` : "non ancora fatto";
    return `<button class="chap" type="button" data-c="${c.id}"><span class="n">${c.n}</span><span class="t">${esc(c.t)}</span>${c.p ? `<span class="s pp">prova intercorso</span>` : ""}<span class="s">${PER_GIRO} a giro su ${n} · ${best}</span><span class="s">ne sai <b class="${k === n ? "" : "mid"}">${k}/${n}</b>${rip ? ` · ${rip} da recuperare` : ""}</span><span class="m"><i style="width:${100 * k / n}%"></i></span></button>`;
  }).join("");
  app.innerHTML = `
    <section class="sim">
      <h2>Simulazione</h2>
      <p>15 domande miste sui capitoli della prova intercorso di venerdì 6 novembre (02, 03, 04, 06, 07, 08 e 18), almeno 1 per capitolo, diverse a ogni giro. Oppure 25 domande su tutto il corso, almeno una per capitolo. Alla fine vedi il punteggio per capitolo.</p>
      <p class="tot">Domande che sai già: <b>${totKnown}</b> su ${Q.length}</p>
      <div class="actions"><button class="btn" type="button" id="go-sim">Prova intercorso →</button>
      <button class="btn" type="button" id="go-simtutto">Tutto il corso (25) →</button>
      <button class="btn" type="button" id="go-dep">Domande del deposito (30) →</button></div>
    </section>
    <p class="label">Un capitolo alla volta</p>
    <div class="chaps">${chips}</div>
    <p class="note">Consiglio: fai il quiz di un capitolo subito dopo averlo studiato, poi la simulazione la sera prima della prova. Punta ad almeno l'80% per capitolo.<br>Ogni giro pesca ${PER_GIRO} domande diverse dal capitolo. Quelle che sbagli tornano nei giri successivi finché non le azzecchi ${SAPUTA} volte di fila: a quel punto contano come sapute.</p>`;
  app.querySelector("#go-sim").onclick = () => start(SIMS.sim.title, simRun("sim"), null, "sim");
  app.querySelector("#go-simtutto").onclick = () => start(SIMS.simtutto.title, simRun("simtutto"), null, "simtutto");
  app.querySelector("#go-dep").onclick = () => start(SIMS.dep.title, simRun("dep"), null, "dep");
  app.querySelectorAll(".chap").forEach(b => b.onclick = () => {
    const c = chap(b.dataset.c);
    start(`${c.n} · ${c.t}`, chapterRun(c.id), c.id, c.id);
  });
  window.scrollTo({ top: 0 });
}

function start(title, questions, chapterId, key, from) {
  run = { title, chapterId, key, from, i: 0, answers: [], items: questions.map(q => {
    const opts = shuffle(q.o.map((t, k) => ({ t, ok: k === 0 })));
    return { q, opts };
  }) };
  if (key) rememberRun(key, run.items);
  try { if (history.state && history.state.quiz) history.replaceState({ quiz: 1 }, ""); else history.pushState({ quiz: 1 }, ""); } catch (e) {}
  ask();
}

function ask() {
  document.body.classList.add("running");
  const it = run.items[run.i], c = chap(it.q.c), n = run.items.length;
  app.innerHTML = `
    <a href="#" class="backq" id="quit">← Tutti i quiz</a>
    <div class="qhead"><span>${esc(run.title)}</span><span>Domanda ${run.i + 1} di ${n}</span></div>
    <div class="bar"><i style="width:${100 * run.i / n}%"></i></div>
    <span class="tag">${c.n} · ${esc(c.t)}</span>${it.q.x ? `<span class="tag dep">prova 5 novembre</span>` : ""}${it.q.d ? `<span class="tag dep">deposito · n. ${it.q.d > 100 ? it.q.d - 100 : it.q.d}</span>` : ""}${it.q.o.length === 1 ? `<span class="tag dep">risposta aperta</span>` : ""}
    <h2 class="q">${esc(it.q.q)}</h2>
    ${it.q.o.length === 1 ? openBox() : `<div class="opts" role="group" aria-label="Risposte">${it.opts.map((o, k) => `<button class="opt" type="button" data-k="${k}"><span class="k">${"ABCD"[k]}</span><span>${esc(o.t)}</span></button>`).join("")}</div>`}
    <div id="after"></div>
    <p class="hint">${it.q.o.length === 1 ? "Scrivi la tua risposta, poi confrontala con la soluzione e valutati." : "Tasti: 1–4 o A–D per rispondere · Invio per andare avanti"}</p>`;
  app.querySelector("#quit").onclick = e => { e.preventDefault(); backToList(); };
  if (it.q.o.length === 1) return askOpen(it);
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.k));
  const first = app.querySelector(".opt"); if (first) first.focus({ preventScroll: true });
  window.scrollTo({ top: 0 });
}

/* Domande aperte: si scrive la risposta, si mostra la soluzione modello e ci si autovaluta. */
const openBox = () => `<div class="answerbox"><label class="label" for="response">La tua risposta</label><textarea id="response" rows="6" placeholder="Scrivi con parole tue…"></textarea><div class="next"><button class="btn solid" type="button" id="reveal">Mostra la soluzione</button></div></div>`;
function askOpen(it) {
  const response = app.querySelector("#response");
  response.focus({ preventScroll: true });
  window.scrollTo({ top: 0 });
  app.querySelector("#reveal").onclick = () => {
    const typed = response.value.trim();
    response.disabled = true;
    app.querySelector("#reveal").remove();
    app.querySelector("#after").innerHTML = `
      <div class="fb"><b>Soluzione</b><p>${esc(it.q.o[0])}</p><p>${esc(it.q.e)}</p>
        <p>${qlink(it.q, `Rivedi questo punto nel quaderno (cap. ${chap(it.q.c).n}) →`)}</p></div>
      <div class="next"><button class="btn" type="button" id="mark-wrong">Da ripassare</button><button class="btn solid" type="button" id="mark-right">Risposta centrata</button></div>`;
    app.querySelector("#mark-wrong").onclick = () => answerOpen(false, typed);
    app.querySelector("#mark-right").onclick = () => answerOpen(true, typed);
    app.querySelector("#mark-right").focus({ preventScroll: true });
  };
}
function answerOpen(ok, response) {
  const it = run.items[run.i];
  if (run.answers[run.i] !== undefined) return;
  run.answers[run.i] = { ok, response };
  record(it.q, ok);
  const last = run.i === run.items.length - 1;
  app.querySelector("#after").innerHTML += `<div class="fb"><b class="${ok ? "ok" : "ko"}">${ok ? "Segnata come centrata." : "Segnata da ripassare."}</b></div>
    <div class="next"><button class="btn solid" type="button" id="next">${last ? "Vedi il risultato" : "Avanti →"}</button></div>`;
  app.querySelectorAll("#mark-wrong, #mark-right").forEach(b => b.closest(".next").remove());
  const nx = app.querySelector("#next");
  nx.onclick = () => { if (last) result(); else { run.i++; ask(); } };
  nx.focus({ preventScroll: true });
}

function answer(k) {
  const it = run.items[run.i];
  if (run.answers[run.i] !== undefined) return;
  const ok = it.opts[k].ok;
  run.answers[run.i] = { k, ok };
  record(it.q, ok);
  app.querySelectorAll(".opt").forEach((b, j) => {
    b.disabled = true;
    if (it.opts[j].ok) b.classList.add("right");
    else if (j === k) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const last = run.i === run.items.length - 1;
  app.querySelector("#after").innerHTML = `
    <div class="fb"><b class="${ok ? "ok" : "ko"}">${ok ? "Giusto." : "Non è questa."}</b><p>${esc(it.q.e)}</p>
      <p>${qlink(it.q, `Rivedi questo punto nel quaderno (cap. ${chap(it.q.c).n}) →`)}</p></div>
    <div class="next"><button class="btn solid" type="button" id="next">${last ? "Vedi il risultato" : "Avanti →"}</button></div>`;
  const nx = app.querySelector("#next");
  nx.onclick = () => { if (last) result(); else { run.i++; ask(); } };
  nx.focus({ preventScroll: true });
}

function result(restored) {
  const n = run.items.length, good = run.answers.filter(a => a && a.ok).length, pct = Math.round(100 * good / n);
  if (run.chapterId && !restored) {
    const saved = load(), prev = saved[run.chapterId];
    saved[run.chapterId] = { best: Math.max(good, prev ? prev.best : 0), last: good, total: n };
    store(saved);
  }
  const by = {};
  run.items.forEach((it, i) => { const c = it.q.c; by[c] = by[c] || { ok: 0, n: 0 }; by[c].n++; if (run.answers[i] && run.answers[i].ok) by[c].ok++; });
  const rows = CHAPTERS.filter(c => by[c.id]).map(c => `<li><span>${c.n} · ${esc(c.t)}</span><span class="m"><i style="width:${100 * by[c.id].ok / by[c.id].n}%"></i></span><span class="v">${by[c.id].ok}/${by[c.id].n}</span></li>`).join("");
  const wrong = run.items.map((it, i) => ({ it, a: run.answers[i] })).filter(x => !x.a.ok);
  const errs = wrong.map(({ it, a }) => `<div class="err"><p class="eq">${esc(it.q.q)}</p>
      <p class="yours">La tua risposta: ${esc(it.q.o.length === 1 ? (a.response || "(nessuna risposta scritta)") : it.opts[a.k].t)}</p>
      <p><b>${it.q.o.length === 1 ? "Soluzione" : "Giusta"}:</b> ${esc(it.q.o[0])}</p><p>${esc(it.q.e)}</p>
      <p>${qlink(it.q, `Rivedi questo punto nel quaderno (cap. ${chap(it.q.c).n}) →`)}</p></div>`).join("");
  const from = run.key ? { title: run.title, cid: run.chapterId, key: run.key } : run.from;
  const verdict = pct >= 90 ? "Ottimo, questa parte la sai." : pct >= 70 ? "Buono. Ripassa gli errori qui sotto e rifallo." : pct >= 50 ? "Ci sei quasi: rileggi i capitoli segnati e riprova domani." : "Da ripassare: riprendi il quaderno e poi rifai il quiz.";
  app.innerHTML = `
    <a href="#" class="backq" id="quit">← Tutti i quiz</a>
    <p class="label">${esc(run.title)}</p>
    <div class="score"><b>${good}/${n}</b><span>${pct}% di risposte giuste</span></div>
    <p class="verdict">${verdict}</p>
    ${from && from.cid ? (() => { const st = loadStats(), all = Q.filter(q => q.c === from.cid), k = all.filter(q => known(st, q.id)).length; return `<p class="label">Capitolo ${chap(from.cid).n}: ne sai ${k} su ${all.length}</p><div class="bar"><i style="width:${100 * k / all.length}%"></i></div>`; })() : ""}
    ${Object.keys(by).length > 1 ? `<p class="label">Per capitolo</p><ul class="byc">${rows}</ul>` : ""}
    ${wrong.length ? `<p class="label">Da rivedere (${wrong.length})</p><div class="errs">${errs}</div>` : ""}
    <div class="actions">
      ${wrong.length ? `<button class="btn solid" type="button" id="redo">Rifai solo gli errori</button>` : ""}
      ${from ? `<button class="btn" type="button" id="again">${from.cid ? `Altre ${PER_GIRO} domande` : "Nuova simulazione"}</button>` : ""}
      <button class="btn" type="button" id="back">Torna a tutti i quiz</button>
    </div>`;
  const redo = app.querySelector("#redo");
  if (redo) redo.onclick = () => { start((from ? from.title : run.title) + " · errori", shuffle(wrong.map(w => w.it.q)), null, null, from); };
  const again = app.querySelector("#again");
  if (again && from) again.onclick = () => start(from.title, from.cid ? chapterRun(from.cid) : simRun(from.key), from.cid, from.key);
  app.querySelector("#back").onclick = backToList;
  app.querySelector("#quit").onclick = e => { e.preventDefault(); backToList(); };
  if (!restored) window.scrollTo({ top: 0 });
  saveResult();
}

/* L'ultimo risultato resta in questa scheda: se ricarichi la pagina o ci torni con "indietro",
   ritrovi punteggio ed errori da rivedere invece dell'elenco dei quiz. */
const LAST_RES = STORE + "-ultimo-risultato";
function saveResult() {
  try {
    sessionStorage.setItem(LAST_RES, JSON.stringify({ title: run.title, chapterId: run.chapterId, key: run.key, from: run.from,
      answers: run.answers, items: run.items.map(it => ({ id: it.q.id, opts: it.opts })) }));
    history.replaceState({ quiz: 1, res: 1 }, "");
  } catch (e) {}
}
function restoreResult() {
  try {
    const s = JSON.parse(sessionStorage.getItem(LAST_RES));
    if (!s) return false;
    const byId = new Map(Q.map(q => [q.id, q]));
    const items = s.items.map(x => ({ q: byId.get(x.id), opts: x.opts || undefined }));
    if (!items.length || items.some(x => !x.q)) return false;
    run = { title: s.title, chapterId: s.chapterId, key: s.key, from: s.from, answers: s.answers, items, i: items.length - 1 };
    result(true);
    return true;
  } catch (e) { return false; }
}

document.addEventListener("keydown", e => {
  if (!run || e.metaKey || e.ctrlKey || e.altKey) return;
  if (document.querySelector(".ua-pal:not([hidden])")) return;
  if (document.activeElement && document.activeElement.tagName === "TEXTAREA") return; // domanda aperta: si sta scrivendo
  if (run.items[run.i] && run.items[run.i].q.o.length === 1 && e.key !== "Enter") return;
  const key = e.key.toLowerCase();
  const idx = "1234".indexOf(key) !== -1 ? "1234".indexOf(key) : "abcd".indexOf(key);
  if (idx !== -1 && run.answers[run.i] === undefined && run.items[run.i] && idx < run.items[run.i].opts.length) { e.preventDefault(); answer(idx); }
  else if (e.key === "Enter" && run.answers[run.i] !== undefined) { const nx = document.getElementById("next"); if (nx && document.activeElement !== nx) { e.preventDefault(); nx.click(); } }
});

/* Indietro: dal quiz si torna all'elenco dei quiz, non alla home.
   Avviando un quiz si aggiunge una voce alla cronologia: il tasto indietro del browser (o il gesto sul telefono)
   riporta all'elenco; il pulsante "Tutti i quiz" fa la stessa cosa. */
function backToList() {
  if (history.state && history.state.quiz) history.back(); else home();
}
window.addEventListener("popstate", () => { if (run && !(history.state && history.state.quiz)) home(); });
/* Quiz in corso: se esci (es. per il link al quaderno) e torni con "indietro", riprende dalla stessa domanda.
   Di solito il browser tiene la pagina in memoria; questo serve quando la ricarica da capo. */
const LAST_RUN = STORE + "-giro-in-corso";
window.addEventListener("pagehide", () => {
  try {
    if (!run || (history.state && history.state.res)) { sessionStorage.removeItem(LAST_RUN); return; }
    sessionStorage.setItem(LAST_RUN, JSON.stringify({ title: run.title, chapterId: run.chapterId, key: run.key, from: run.from, i: run.i,
      answers: run.answers, items: run.items.map(it => ({ id: it.q.id, opts: it.opts })) }));
  } catch (e) {}
});
function restoreRun() {
  try {
    const s = JSON.parse(sessionStorage.getItem(LAST_RUN)); sessionStorage.removeItem(LAST_RUN);
    if (!s) return false;
    const byId = new Map(Q.map(q => [q.id, q]));
    const items = s.items.map(x => ({ q: byId.get(x.id), opts: x.opts || undefined }));
    if (!items.length || items.some(x => !x.q)) return false;
    run = { title: s.title, chapterId: s.chapterId, key: s.key, from: s.from, answers: (s.answers || []).map(a => a === null ? undefined : a), items, i: s.i }; // JSON trasforma i buchi in null
    // domanda già risposta: si riparte dalla successiva (o dal risultato se era l'ultima)
    if (run.answers[run.i] !== undefined) { if (run.i >= items.length - 1) { result(); return true; } run.i++; }
    ask();
    return true;
  } catch (e) { return false; }
}
if (!(history.state && history.state.res && restoreResult()) && !(history.state && history.state.quiz && !history.state.res && restoreRun())) {
  if (history.state && history.state.quiz) { try { history.replaceState(null, ""); } catch (e) {} }
  home();
}
</script>
</body>
