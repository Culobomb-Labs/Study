  { c: "req", q: "\"Il server deve essere disponibile 24 ore su 24\" è un requisito…", o: ["Non funzionale", "Funzionale", "Vincolo (pseudo-requisito)", "Di dominio della soluzione"], e: "Aspetto visibile all'utente ma non legato a una funzione specifica." },
  { d: 26, c: "req", q: "I requisiti funzionali descrivono…", o: ["Le interazioni tra sistema e ambiente, indipendenti dall'implementazione", "Il linguaggio di programmazione da usare", "Tempi di risposta e disponibilità", "La struttura interna del sistema"], e: "Esempio: \"Un operatore ARENA deve poter definire un nuovo gioco\"." },
  { c: "req", q: "\"Il sistema deve usare un database Oracle\", imposto dal cliente, è…", o: ["Un vincolo (pseudo-requisito)", "Un requisito funzionale", "Un requisito non funzionale di performance", "Uno scenario"], e: "Vincoli: imposti dal cliente o dall'ambiente (linguaggio, piattaforma…)." },
  { c: "req", q: "Cosa di solito NON dovrebbe stare nei requisiti?", o: ["Struttura del sistema, tecnologia, metodologia e linguaggio di sviluppo", "Le funzioni che l'utente userà", "I tempi di risposta attesi", "I criteri di accettazione"], e: "Se il cliente prova a imporli, il consiglio delle slide è: \"combatti!\"" },
  { d: 8, c: "req", q: "Un progetto greenfield…", o: ["Parte da zero: non c'è un sistema precedente e i requisiti vengono da utenti e cliente", "Riscrive un sistema esistente con nuova tecnologia", "Cambia solo l'interfaccia di un sistema esistente", "Assembla componenti COTS"], e: "Greenfield = da zero. Re-engineering = riscrivere. Interface engineering = nuova interfaccia." },
  { c: "req", q: "Un'app per un servizio che prima non esisteva in nessuna forma è un progetto…", o: ["Greenfield", "Re-engineering", "Interface engineering", "Di manutenzione"], e: "Nessun sistema precedente: si parte da zero." },
  { c: "req", q: "Vuoi raccogliere opinioni da 500 utenti con dati confrontabili, spendendo poco. Quale tecnica?", o: ["Questionari", "Interviste", "Osservazione", "Focus group"], e: "Questionari: economici, tante persone, dati confrontabili; ma risposte superficiali." },
  { c: "req", q: "Qual è lo svantaggio tipico dei questionari?", o: ["Risposte superficiali, senza possibilità di approfondire", "Sono lenti e costosi", "Chi parla di più domina", "Le persone osservate cambiano comportamento"], e: "Per approfondire servono le interviste, con domande di follow-up." },
  { c: "req", q: "Pro e contro delle interviste?", o: ["Dettagliate, con domande di follow-up; ma lente, costose e con poche persone", "Economiche e con tante persone; ma superficiali", "Fanno emergere idee di gruppo; ma qualcuno domina", "Scoprono cose non dette; ma le persone cambiano comportamento"], e: "Ogni tecnica ha un pro e un contro tipici: impara le coppie." },
  { c: "req", q: "Qual è il contro dell'osservazione?", o: ["Richiede tempo e le persone osservate cambiano comportamento", "Le risposte sono superficiali", "Costa poco ma dà idee poche e non rappresentative", "Rischia di copiare invece di innovare"], e: "Il pro è che scopre cose che gli utenti non sanno dire." },
  { c: "req", q: "Qual è il rischio dell'analisi della concorrenza?", o: ["Copiare invece di innovare", "Risposte superficiali", "Costi altissimi", "Nessun dato confrontabile"], e: "Il pro: idee già collaudate." },
  { c: "req", q: "Qual è il limite dei suggerimenti spontanei degli utenti?", o: ["Sono pochi e non rappresentativi", "Costano troppo", "Richiedono un workshop", "Sono sempre ambigui"], e: "Costano poco e danno idee reali, ma arrivano da pochi utenti." },
  { c: "req", q: "Cos'è il JAD (Joint Application Design)?", o: ["Un workshop in cui utenti, clienti e sviluppatori scrivono insieme i requisiti", "Un tipo di diagramma UML", "Un questionario standardizzato", "Un test di accettazione automatico"], e: "Sessioni intensive in cui tutti scrivono i requisiti insieme." },
  { c: "req", q: "Criterio di validazione \"completezza\": cosa chiede?", o: ["Sono descritti tutti gli scenari, anche quelli eccezionali?", "I requisiti si contraddicono?", "Si possono implementare e consegnare?", "Rappresentano il punto di vista del cliente?"], e: "Il caso del treno senza macchinista è un difetto di completezza." },
  { c: "req", q: "Criterio di validazione \"realismo\": cosa chiede?", o: ["Si possono implementare e consegnare?", "Ci sono contraddizioni?", "Ogni funzione si riconduce a un requisito?", "Sono descritti anche i casi eccezionali?"], e: "Correttezza, completezza, consistenza, realismo, tracciabilità." },
  { c: "req", q: "Criterio \"tracciabilità\": cosa chiede?", o: ["Ogni funzione del sistema si può ricondurre a un requisito?", "I requisiti sono scritti in voce attiva?", "Il sistema è disponibile 24 ore su 24?", "Il cliente ha firmato il contratto?"], e: "Si deve poter seguire il filo da ogni funzione al requisito che la giustifica." },
  { c: "req", q: "Criterio \"correttezza\": cosa chiede?", o: ["I requisiti rappresentano il punto di vista del cliente?", "Il codice è privo di bug?", "Ci sono requisiti che si contraddicono?", "Ogni requisito ha una priorità?"], e: "Correttezza qui riguarda i requisiti rispetto al cliente, non il codice." },
  { c: "req", q: "Quando si validano i requisiti?", o: ["All'inizio e poi alla consegna, con il test di accettazione", "Solo alla fine del progetto", "Solo durante la codifica", "Mai: li valida il cliente da solo"], e: "Prima si controllano coi 5 criteri, poi alla consegna li verifica il test di accettazione." },
  { c: "req", q: "Qual è il problema pratico durante l'elicitation?", o: ["I requisiti cambiano in fretta: servono strumenti con un repository condiviso", "Il cliente non scrive mai il problem statement", "Non esistono tecniche per raccoglierli", "I requisiti non funzionali non si possono scrivere"], e: "Per questo si tengono in un repository condiviso." },
  { c: "req", q: "Nel RAD, la sezione \"sistema proposto\" contiene…", o: ["Requisiti funzionali e non funzionali e i modelli: scenari, use case, object model, modello dinamico, interfaccia", "Solo il codice sorgente", "Solo il calendario di progetto", "Le minute delle riunioni"], e: "RAD: introduzione, sistema attuale, sistema proposto, glossario." },
  { c: "req", q: "Cos'è ARENA, l'esempio del libro?", o: ["Una piattaforma per comunità di giocatori online con tornei e punteggi", "Un sistema di gestione delle emergenze", "Un bancomat", "Un sistema di biglietteria ferroviaria"], e: "ARENA registra giochi e giocatori, organizza tornei, tiene i punteggi e ospita inserzionisti." },
  // 04 · Buoni requisiti (altre)
  { c: "reqq", q: "In ISO 29148, \"should\" (dovrebbe) indica…", o: ["Una preferenza, desiderata ma non obbligatoria", "Un requisito obbligatorio", "Un testo descrittivo", "Un suggerimento da ignorare"], e: "shall = obbligatorio · should = preferenza · may = concessione · is/are/was = descrizione." },
  { c: "reqq", q: "In ISO 29148, \"may\" (può) indica…", o: ["Un suggerimento, una concessione", "Un requisito obbligatorio", "Un obiettivo desiderato", "Un divieto"], e: "Le parole chiave hanno un significato preciso: usale sempre allo stesso modo." },
  { c: "reqq", q: "Frasi con \"is / are / was\" in un documento di requisiti sono…", o: ["Testo descrittivo, non requisiti", "Requisiti obbligatori", "Requisiti opzionali", "Vincoli legali"], e: "Solo \"shall\" introduce un requisito obbligatorio." },
  { c: "reqq", q: "Quale formulazione rispetta la voce attiva?", o: ["The system shall detect the error", "The error should be detected", "The error shall be detected by the system", "Detection of the error is required"], e: "Voce attiva: si capisce subito chi fa l'azione." },
  { c: "reqq", q: "Quale forma va evitata nei requisiti?", o: ["\"shall not\": meglio frasi positive", "\"shall\"", "Una condizione iniziale", "Un vincolo misurabile"], e: "Frasi positive, voce attiva, termini del glossario." },
  { c: "reqq", q: "Perché i termini dei requisiti vanno messi in un glossario?", o: ["Per definirli e usarli sempre allo stesso modo", "Per tradurli in inglese", "Per ordinarli per priorità", "Perché lo richiede MoSCoW"], e: "Un termine usato in due modi diversi crea ambiguità." },
  { c: "reqq", q: "\"Quando riceve il segnale x, il sistema deve impostare il bit entro 2 secondi\": cos'è \"entro 2 secondi\"?", o: ["Il vincolo", "La condizione", "L'oggetto", "Il soggetto"], e: "[Condizione] quando riceve x · [Soggetto] il sistema · [Azione] deve impostare · [Oggetto] il bit · [Vincolo] entro 2 secondi." },
  { c: "reqq", q: "Nella stessa frase, \"quando riceve il segnale x\" è…", o: ["La condizione", "Il vincolo", "L'azione", "L'oggetto"], e: "La sintassi ISO parte dalla condizione." },
  { c: "reqq", q: "\"Il sistema deve supportare circa 100 utenti\": qual è il problema?", o: ["\"Circa\" è ambiguo e non verificabile", "Manca il soggetto", "È un vincolo legale", "Usa la voce passiva"], e: "Parole da evitare: circa, almeno, veloce, robusto, user friendly, se possibile, e/o, ecc." },
  { c: "reqq", q: "Un requisito \"libero da implementazione\"…", o: ["Dice cosa deve fare il sistema, non come", "Non ha bisogno di essere testato", "Non ha una priorità", "È scritto senza la parola shall"], e: "Il come è compito del design." },
  { c: "reqq", q: "Un requisito \"verificabile\"…", o: ["Si può testare", "Viene dal cliente", "Non contraddice altri requisiti", "È scritto al passivo"], e: "Se non si può testare, non si può dire se è soddisfatto." },
  { c: "reqq", q: "\"Il sistema deve permettere il login e inviare un report settimanale\": quale caratteristica viola?", o: ["Singolare: esprime due cose", "Fattibile", "Necessario", "Tracciabile"], e: "Un requisito, una cosa sola: vanno separati." },
  { c: "reqq", q: "\"Il sistema deve salvare i clienti in una HashMap\": quale caratteristica viola?", o: ["Libero da implementazione", "Singolare", "Consistente", "Completo"], e: "Dice come farlo (una struttura dati), non cosa deve fare." },
  { d: 12, c: "reqq", q: "L'INSIEME dei requisiti deve essere…", o: ["Completo, consistente, affordable e bounded", "Singolare, attivo e positivo", "Must, Should, Could e Won't", "Specific, Measurable e Traceable"], e: "Le caratteristiche del singolo requisito sono altre (necessario, non ambiguo, verificabile…)." },
  { c: "reqq", q: "Che cosa significa che l'insieme dei requisiti è \"bounded\"?", o: ["È limitato a ciò che serve", "È realizzabile con budget e tempi", "Non ha contraddizioni", "Copre tutti gli scenari"], e: "Affordable = realizzabile con budget e tempi. Bounded = limitato al necessario." },
  { c: "reqq", q: "Cosa significa la M di SMART?", o: ["Measurable: misurabile, così si può verificare", "Must have", "Maintainable", "Minimal"], e: "Specific, Measurable, Attainable, Realisable, Traceable." },
  { c: "reqq", q: "Cosa significa la T di SMART?", o: ["Traceable: tracciabile fino alla sua origine", "Testable", "Timely", "Technical"], e: "La tracciabilità si gestisce con la matrice di tracciabilità." },
  { c: "reqq", q: "Un'app con funzioni avanzate, ma hai 2 settimane e una sola persona. Il requisito è…", o: ["Realisable ma non attainable", "Attainable ma non realisable", "Né attainable né realisable", "Sia attainable sia realisable"], e: "La tecnologia c'è (realisable), ma non con le tue risorse e i tuoi tempi (attainable)." },
  { c: "reqq", q: "\"Quanti utenti contemporanei? Con che tempi di risposta?\": categoria FURPS?", o: ["Performance", "Usability", "Reliability", "Supportability"], e: "Performance: attributi misurabili come tempo di risposta, throughput, disponibilità, accuratezza." },
  { c: "reqq", q: "\"Riavviare dopo un guasto è accettabile? Quanti dati si possono perdere?\": categoria FURPS?", o: ["Reliability", "Performance", "Usability", "+ Operations"], e: "Reliability, oggi dependability: affidabilità, robustezza, safety." },
  { c: "reqq", q: "\"Che documentazione serve all'utente? Che esperienza ha?\": categoria FURPS?", o: ["Usability", "Supportability", "+ Packaging", "Performance"], e: "Usability = facilità di imparare e usare il sistema." },
  { c: "reqq", q: "\"Il sistema andrà portato su altre piattaforme?\": categoria FURPS?", o: ["Supportability", "+ Implementation", "Reliability", "+ Interface"], e: "Supportability: manutenibilità, adattabilità, internazionalizzazione (in ISO 9126 manutenibilità e portabilità)." },
  { c: "reqq", q: "\"Il sistema deve rispettare la normativa sulla privacy\": categoria FURPS+?", o: ["+ Legal", "+ Operations", "Usability", "+ Interface"], e: "Legal: licenze, norme, certificazioni." },
  { c: "reqq", q: "\"Chi installa il sistema e su che supporto?\": categoria FURPS+?", o: ["+ Packaging", "+ Implementation", "Supportability", "+ Operations"], e: "Packaging: come viene consegnato e installato." },
  { c: "reqq", q: "\"Deve scambiare dati con un sistema esterno esistente in un formato dato\": categoria FURPS+?", o: ["+ Interface", "+ Implementation", "Performance", "+ Legal"], e: "Interface: vincoli da sistemi esterni e formati di scambio." },
  { c: "reqq", q: "\"Deve girare su Linux, scritto in Java\": categoria FURPS+?", o: ["+ Implementation", "+ Packaging", "Supportability", "+ Interface"], e: "Implementation: strumenti, linguaggi, hardware imposti." },
  { c: "reqq", q: "\"Chi amministra il sistema quando è in esercizio?\": categoria FURPS+?", o: ["+ Operations", "Reliability", "+ Packaging", "Usability"], e: "Operations: amministrazione e gestione del sistema in esercizio." },
  { c: "reqq", q: "MoSCoW: cosa significa \"Should have\"?", o: ["Importante ma non vitale", "Indispensabile", "Bello da avere, se resta tempo", "Non in questa versione"], e: "Must = indispensabile · Should = importante ma non vitale · Could = bello da avere · Won't = non ora." },
  { c: "reqq", q: "MoSCoW: cosa significa \"Could have\"?", o: ["Bello da avere", "Indispensabile", "Importante ma non vitale", "Escluso per sempre"], e: "Could = se avanza tempo." },
  { c: "reqq", q: "Con la scala Alta / Media / Bassa, priorità \"media\" significa…", o: ["Si affronta in analisi e design, e si implementa nella seconda iterazione", "Si affronta in analisi, design e implementazione già nella prima iterazione", "Si affronta solo in analisi, per usi futuri", "Non si affronta mai"], e: "Alta = analisi, design e implementazione subito; media = analisi e design, implementata nella 2ª iterazione; bassa = solo analisi." },
  // 03 · Casi d'uso (altre)
  { c: "uc", q: "\"Bob, sulla sua auto, vede fumo uscire da un magazzino…\" è…", o: ["Uno scenario", "Un caso d'uso", "Un attore", "Un requisito non funzionale"], e: "Storia concreta, con nomi veri: scenario. Il caso d'uso è la descrizione generale (ReportEmergency)." },
  { d: 19, c: "uc", q: "Uno scenario \"as-is\" descrive…", o: ["La situazione attuale; tipico del re-engineering", "Il sistema futuro; tipico del greenfield", "I compiti su cui verrà valutato il sistema", "Le istruzioni per insegnare a usarlo"], e: "As-is = oggi. Visionary = futuro. Evaluation = valutazione. Training = formazione." },
  { c: "uc", q: "Uno scenario \"evaluation\" descrive…", o: ["I compiti dell'utente su cui verrà valutato il sistema", "La situazione attuale", "Il sistema futuro", "Le istruzioni passo passo per gli utenti"], e: "Serve a verificare che il sistema supporti bene quei compiti." },
  { c: "uc", q: "In un progetto di re-engineering vuoi descrivere come si lavora oggi. Che scenario scrivi?", o: ["As-is", "Visionary", "Training", "Evaluation"], e: "As-is è tipico del re-engineering, visionary del greenfield." },
  { c: "uc", q: "Dallo scenario \"Warehouse on Fire\" (FRIEND) si ricavano i casi d'uso…", o: ["ReportEmergency e AllocateResources", "WithdrawMoney e CheckPin", "PurchaseTicket e GetPrice", "CreateTournament e ApplyForTournament"], e: "Bob segnala l'incendio (ReportEmergency), Alice manda i vigili del fuoco (AllocateResources)." },
  { c: "uc", q: "Qual è il primo passo per trovare i casi d'uso?", o: ["Trovare gli attori: chi usa il sistema?", "Scrivere il flusso principale", "Disegnare il class diagram", "Definire gli extension point"], e: "Attori → scenari → casi d'uso → raffinamento." },
  { c: "uc", q: "Cosa si fa nell'ultimo passo, il raffinamento dei casi d'uso?", o: ["Si aggiungono eccezioni, include/extend e requisiti non funzionali", "Si trovano gli attori", "Si scrivono gli scenari con nomi veri", "Si scrive il codice"], e: "Prima si generalizzano gli scenari, poi si raffinano i casi d'uso." },
  { c: "uc", q: "Withdraw Money: qual è la entry condition?", o: ["Il cliente ha carta e PIN validi e il bancomat è attivo", "Il cliente ha i soldi e la carta", "Il saldo è aggiornato", "La carta è stata trattenuta"], e: "Entry = cosa deve essere vero prima di iniziare. Exit = lo stato finale." },
  { c: "uc", q: "Withdraw Money: qual è la exit condition?", o: ["Il cliente ha i soldi e la carta; il saldo è aggiornato", "Il cliente ha inserito la carta", "Il bancomat è attivo", "Il PIN è stato chiesto"], e: "La exit condition descrive come stanno le cose alla fine." },
  { c: "uc", q: "Withdraw Money: il cliente sbaglia il PIN 3 volte. Cosa succede?", o: ["Il bancomat trattiene la carta", "Il bancomat espelle la carta", "Si blocca il conto", "Il bancomat eroga comunque"], e: "Le eccezioni: carta non valida → espulsa; PIN errato → richiesto di nuovo, dopo 3 errori trattenuta; importo oltre limite → nuova richiesta." },
  { c: "uc", q: "Withdraw Money: la carta non è valida. Cosa fa il sistema?", o: ["La espelle", "La trattiene subito", "Chiede il PIN tre volte", "Mostra il menu"], e: "È una delle eccezioni del caso d'uso, descritte a parte rispetto al flusso principale." },
  { c: "uc", q: "Come vanno scritti attori e passi di un caso d'uso?", o: ["Attori come sostantivi; passi in voce attiva", "Attori come verbi; passi al passivo", "Attori in codice; passi in UML", "Non c'è una regola"], e: "Esempio: \"Il sistema invia…\", non \"Viene inviato…\"." },
  { c: "uc", q: "Quale passo di un caso d'uso è scritto bene?", o: ["Il sistema invia la conferma al cliente", "La conferma viene inviata", "Invio conferma", "Si procede con la conferma"], e: "Voce attiva e si capisce chi fa cosa." },
  { c: "uc", q: "Come si alternano i passi del flusso principale?", o: ["Tra attore e sistema", "Solo passi del sistema", "Solo passi dell'attore", "Tra attore principale e attori secondari"], e: "A ogni passo si capisce chi fa cosa." },
  { c: "uc", q: "Dove vanno le parole del dominio usate nei casi d'uso?", o: ["Nel glossario", "Negli extension point", "Nella exit condition", "Nel nome del caso d'uso"], e: "Come per i requisiti, i termini si definiscono una volta sola." },
  { c: "uc", q: "Nel template del corso, com'è fatto l'identificativo?", o: ["Un codice univoco tipo UC_Pack_TUC, più nome, data, versione e autore", "Solo il nome del caso d'uso", "Il numero di pagina del RAD", "L'ID del commit"], e: "Pacchetto + numero, per riferirlo in modo univoco." },
  { c: "uc", q: "Differenza tra attore principale e attori secondari nel template?", o: ["Il principale avvia il caso d'uso; i secondari partecipano, ognuno col suo interesse", "Il principale è sempre una persona, i secondari sistemi", "Non c'è differenza", "Il secondario sostituisce il principale se assente"], e: "Per ciascuno si scrive anche il suo interesse." },
  { c: "uc", q: "Cosa indica il campo \"Frequenza stimata\"?", o: ["Quante volte viene usato il caso d'uso, ad esempio 50 al giorno", "Quanto è importante", "Quanti passi ha", "Quante eccezioni ha"], e: "Quanto è importante va invece in Rilevanza / User priority." },
  { c: "uc", q: "Cosa va nel campo \"Generalization of\"?", o: ["Il caso d'uso padre, se questo è una specializzazione", "Il caso d'uso che lo estende", "La lista degli attori", "I requisiti non funzionali"], e: "Corrisponde alla generalizzazione tra casi d'uso nel diagramma." },
  { c: "uc", q: "Nel flusso principale, come si richiama un caso d'uso incluso?", o: ["Con un passo include(UCIn)", "Con un extension point", "Con un flusso 1.1", "Scrivendo il suo flusso per intero"], e: "Il comportamento comune non si riscrive: si include." },
  { c: "uc", q: "Cosa va nel campo \"Note / Special requirements\"?", o: ["I requisiti non funzionali legati a quel caso d'uso", "Il flusso principale", "L'elenco degli attori", "La data di creazione"], e: "Esempio: tempi di risposta di quel caso d'uso." },
  { c: "uc", q: "Un flusso alternativo numerato 3.1 significa…", o: ["Al passo 3 del flusso principale può succedere anche questo", "È il terzo caso d'uso del pacchetto 1", "È il primo errore del caso d'uso 3", "È la versione 3.1 del documento"], e: "Alternativi ed errori si numerano dal passo da cui partono." },
  { c: "uc", q: "Cosa va nel campo \"Entry condition\"?", o: ["Cosa deve essere vero prima di iniziare", "Lo stato finale se va bene", "Il primo passo del flusso", "Chi avvia il caso d'uso"], e: "On success e on failure appartengono invece alla exit condition." },
  // 08 · Sequence (altre)
  { c: "dyn", q: "In un sequence diagram, come scorre il tempo?", o: ["Verso il basso; gli oggetti sono disposti in orizzontale", "Da sinistra a destra", "Dal basso verso l'alto", "Non è rappresentato"], e: "Oggetti in alto in orizzontale, tempo che scende, frecce = messaggi." },
  { c: "dyn", q: "Come si scrivono gli oggetti in cima a un sequence diagram?", o: ["nomeOggetto:NomeClasse", "NomeClasse.nomeOggetto", "<<nomeOggetto>>", "nomeOggetto()"], e: "Come le istanze nel class diagram." },
  { c: "dyn", q: "Cos'è la lifeline?", o: ["La linea tratteggiata verticale che rappresenta la vita dell'oggetto", "Il rettangolino del metodo in esecuzione", "La freccia di ritorno", "Il frame loop"], e: "Sulla lifeline si disegnano le attivazioni." },
  { c: "dyn", q: "Come si disegna un messaggio asincrono?", o: ["Freccia aperta: il chiamante continua senza aspettare", "Freccia piena chiusa: il chiamante aspetta", "Freccia tratteggiata", "Una X sulla lifeline"], e: "Sincrono = freccia piena chiusa (aspetta). Asincrono = freccia aperta (non aspetta). Ritorno = tratteggiata." },
  { c: "dyn", q: "Come si rappresenta la creazione di un oggetto?", o: ["Una freccia new/create che punta al rettangolo del nuovo oggetto, disegnato più in basso", "Una X sulla lifeline", "Un frame opt", "Un oggetto disegnato in cima con gli altri"], e: "L'oggetto parte più in basso perché nasce in quel momento." },
  { c: "dyn", q: "Una freccia che parte e torna sullo stesso oggetto è…", o: ["Una self-call (anche ricorsione)", "Un messaggio di ritorno", "Una distruzione", "Un frame alt"], e: "L'oggetto chiama un proprio metodo." },
  { c: "dyn", q: "Dopo la X sulla lifeline, l'oggetto…", o: ["Non si può più usare", "Viene ricreato", "Diventa asincrono", "Torna all'inizio"], e: "La X indica la distruzione." },
  { c: "dyn", q: "Il frame alt corrisponde a…", o: ["if / else: più alternative, ciascuna con la sua [condizione]", "if senza else", "while / for", "una chiamata asincrona"], e: "alt = if/else · opt = if senza else · loop = ripetizione." },
  { c: "dyn", q: "\"Se la stampante è libera stampa, altrimenti metti in coda\": quale frame?", o: ["alt", "opt", "loop", "Nessuno: si usa una self-call"], e: "Due alternative con condizioni [printer free] e [printer busy]: alt." },
  { c: "dyn", q: "\"Invia l'email di conferma solo se l'utente l'ha richiesta\": quale frame?", o: ["opt", "alt", "loop", "fork"], e: "Una sola alternativa, eseguita solo se la condizione è vera." },
  { c: "dyn", q: "Oltre al frame loop, come si può indicare una ripetizione?", o: ["Scrivendo *[condizione] sul messaggio", "Con una X sulla lifeline", "Con una freccia tratteggiata", "Con un frame opt"], e: "L'asterisco indica l'iterazione." },
  { c: "dyn", q: "remove() parte solo se [hasStock] è vero. Come si chiama?", o: ["Esecuzione condizionata (guardia sul messaggio)", "Messaggio asincrono", "Self-call", "Distruzione"], e: "La condizione tra quadre davanti al messaggio decide se viene inviato." },
  { c: "dyn", q: "Un oggetto boundary è…", o: ["L'interfaccia con l'attore: form, bottoni, schermate", "Il dato persistente del dominio", "Chi coordina il caso d'uso", "Un sottosistema esterno"], e: "Boundary = interfaccia · Control = logica del flusso · Entity = dati persistenti." },
  { c: "dyn", q: "Torneo, Giocatore, Conto sono oggetti di tipo…", o: ["Entity", "Boundary", "Control", "Actor"], e: "Gli entity sono i dati persistenti del dominio." },
  { c: "dyn", q: "Passando da un caso d'uso al sequence, cosa c'è nella prima colonna?", o: ["L'attore che avvia il caso d'uso", "L'oggetto control", "Un oggetto entity", "Il database"], e: "1 attore · 2 boundary · 3 control." },
  { c: "dyn", q: "Passando da un caso d'uso al sequence, cosa c'è nella terza colonna?", o: ["L'oggetto control che gestisce il resto del caso d'uso", "L'attore", "Il boundary", "Il primo entity"], e: "Il control viene creato dal boundary." },
  { c: "dyn", q: "Chi può creare altri oggetti boundary?", o: ["Il control", "Un entity", "Solo l'attore", "Nessuno"], e: "Il control è creato dal boundary e può a sua volta creare altri boundary." },
  { c: "dyn", q: "Da chi sono usati gli oggetti entity?", o: ["Da control e boundary", "Solo dall'attore", "Da nessuno: sono passivi anche verso il control", "Solo da altri entity"], e: "Un entity però non chiama mai un boundary o un control." },
  { c: "dyn", q: "Nella notazione degli oggetti di analisi, il cerchio sottolineato è…", o: ["Entity", "Control", "Boundary", "Attore"], e: "Control = cerchio con freccia · Entity = cerchio sottolineato · Boundary = cerchio con trattino." },
  { c: "dyn", q: "Il cerchio con una freccia sopra rappresenta un oggetto…", o: ["Control", "Entity", "Boundary", "Package"], e: "La freccia ricorda il controllo del flusso." },
  { c: "dyn", q: "Struttura \"stair\" (a scala):", o: ["Ogni oggetto chiama il successivo; controllo decentralizzato", "Un oggetto chiama tutti gli altri; controllo centralizzato", "Tutti gli oggetti chiamano l'attore", "Nessun oggetto chiama gli altri"], e: "Stair = responsabilità distribuite. Fork = un oggetto comanda." },
  { c: "dyn", q: "Quando va bene la struttura stair?", o: ["Quando le operazioni sono fortemente collegate e si fanno sempre nello stesso ordine", "Quando l'ordine delle operazioni cambia spesso", "Quando si prevedono molti nuovi requisiti", "Sempre: è la migliore"], e: "Se invece servono cambiamenti, conviene il fork (centralizzato)." },
  { c: "dyn", q: "Nella struttura fork, chi chiama tutti gli altri oggetti?", o: ["Un oggetto, di solito il control", "L'entity", "Il boundary", "Ogni oggetto chiama il successivo"], e: "Controllo centralizzato: si può cambiare l'ordine e aggiungere operazioni." },
  { c: "dyn", q: "Nel collaboration diagram, come si capisce l'ordine dei messaggi?", o: ["Dai numeri, con notazione puntata per i messaggi annidati (2.1, 2.2)", "Dalla posizione verticale", "Dal colore delle frecce", "Non c'è ordine"], e: "Senza asse del tempo, l'ordine lo danno i numeri." },
  { c: "dyn", q: "Modellando CreateTournament (ARENA) con un sequence, cosa succede?", o: ["Saltano fuori classi nuove (un form, un controllo del torneo, l'entità Tournament) assenti nel class diagram", "Si scopre che il caso d'uso non serve", "Si ottiene il codice del sistema", "Si eliminano tutti gli entity"], e: "I sequence in analisi servono proprio a trovare nuovi oggetti e responsabilità." },
  // ——— Domande sui capitoli aggiunti al quiz (09–16) e sui contenuti nuovi ———


  // 09 · Riuso: ereditarietà e delega
  { c: "riuso", q: "Qual è lo scopo dell'object design?", o: ["Colmare il buco tra il modello di analisi e la macchina reale", "Raccogliere e validare i requisiti insieme al cliente", "Testare il sistema finito rispetto ai casi d'uso", "Pianificare gli sprint e stimare gli story point"], e: "Il modo più economico per farlo è riusare classi e soluzioni già pronte." },
  { c: "riuso", q: "L'ereditarietà di specifica (di interfaccia) consiste nel…", o: ["Ereditare da una classe astratta o interfaccia per prendere il contratto", "Ereditare da una classe concreta solo per riusarne il codice", "Copiare il codice di un'altra classe", "Contenere un oggetto e delegargli il lavoro"], e: "Serve al subtyping: poter usare un oggetto al posto di un altro." },
  { c: "riuso", q: "L'ereditarietà di implementazione consiste nel…", o: ["Ereditare da una classe che ha già il codice, solo per riusarlo", "Ereditare da un'interfaccia per prenderne il contratto", "Implementare tutte le operazioni di un contratto astratto", "Contenere un oggetto e passargli il lavoro da fare"], e: "È comoda ma pericolosa: ti porti dietro anche i metodi che non vuoi." },
  { c: "riuso", q: "Come si chiama l'ereditarietà di specifica, con un altro nome?", o: ["Subtyping", "Delega", "Aggregazione", "Refactoring"], e: "Di specifica = di interfaccia = subtyping." },
  { c: "riuso", q: "Il principio di sostituzione di Liskov dice che…", o: ["Se S si può usare ovunque serve T, allora S è un sottotipo di T", "Una sottoclasse deve ridefinire tutti i metodi", "Non si deve mai usare l'ereditarietà", "Ogni classe deve avere un'interfaccia"], e: "Esempio: un cellulare si può usare ovunque serve un telefono." },
  { c: "riuso", q: "Un'ereditarietà che rispetta Liskov si chiama…", o: ["Ereditarietà stretta", "Ereditarietà di implementazione", "Delega", "Ereditarietà multipla"], e: "Stretta = la sottoclasse sostituisce davvero la superclasse." },
  { c: "riuso", q: "Perché Stack extends List è una cattiva idea?", o: ["Espone i metodi di List e permette di usare la pila in modo scorretto", "Non compila, perché Stack e List hanno metodi incompatibili", "Rende lo stack molto più lento di una lista normale", "List non ha i metodi add e remove che servono allo stack"], e: "Si può chiamare aStack.remove(3) e togliere dal mezzo della pila: errore logico." },
  { c: "riuso", q: "aStack.remove(3) su uno Stack che estende List produce…", o: ["Un errore logico, senza errori di compilazione né di esecuzione", "Un errore di compilazione, perché remove non è dello Stack", "Un'eccezione a runtime che blocca il programma", "Nulla: il metodo ereditato viene ignorato dallo Stack"], e: "È il pericolo dell'ereditarietà di implementazione: tutto funziona, ma la LIFO è violata." },
  { c: "riuso", q: "Cos'è la delega?", o: ["Un oggetto contiene un altro oggetto e gli passa il lavoro", "Un oggetto eredita da un altro tutti i campi e i metodi", "Un oggetto implementa l'interfaccia di un altro oggetto", "Un oggetto copia nel proprio codice i metodi di un altro"], e: "Client → Receiver → Delegate: il Receiver nasconde il Delegate." },
  { c: "riuso", q: "Nella versione con delega, come è dichiarata la lista dentro lo Stack?", o: ["private List aList;", "public List aList;", "class Stack extends List", "static List aList;"], e: "Privata: da fuori nessuno la vede, esistono solo push, pop e top." },
  { c: "riuso", q: "Quale di questi è un vantaggio della delega?", o: ["Incapsulamento rispettato", "Meno codice da scrivere", "Sfrutta il subtyping", "È più efficiente dell'ereditarietà"], e: "Pro: incapsulamento, puoi cambiare List con Vector senza toccare i client, codice robusto." },
  { c: "riuso", q: "Quale di questi è uno svantaggio della delega?", o: ["Servono metodi “ponte”, quindi più codice", "Viola l'incapsulamento", "Espone i metodi della classe interna", "Rompe il principio di Liskov"], e: "Contro: più codice, un po' meno efficiente, niente subtyping." },
  { c: "riuso", q: "Con la delega, uno Stack si può passare dove serve una List?", o: ["No, perché non c'è subtyping", "Sì, sempre", "Sì, se la lista interna è pubblica", "Solo con un cast"], e: "Stack ha una List, non è una List." },
  { c: "riuso", q: "Qual è la regola finale del capitolo sul riuso?", o: ["Ereditarietà di specifica per il subtyping, delega per riusare codice", "Usare sempre l'ereditarietà di implementazione", "Evitare sempre le interfacce", "Usare la delega solo per le entity"], e: "Ognuno dei due strumenti ha il suo scopo." },
  { c: "riuso", q: "Con la delega posso sostituire List con Vector dentro lo Stack…", o: ["Senza toccare le classi che usano lo Stack", "Solo riscrivendo tutti i client", "Solo se Vector estende Stack", "Mai"], e: "La struttura interna è nascosta: i client vedono solo push, pop, top." },
  { c: "riuso", q: "Un cellulare usato ovunque serve un telefono è un esempio di…", o: ["Principio di Liskov", "Delega", "Pattern Adapter", "Ereditarietà di implementazione"], e: "Che sappia anche mandare SMS non cambia niente: è un sottotipo valido." },
  { c: "riuso", q: "Nella delega, quale ruolo ha il Receiver?", o: ["Riceve la richiesta dal Client e la passa al Delegate", "È l'oggetto che fa davvero il lavoro, visibile al client", "È la superclasse del Delegate", "È l'interfaccia comune"], e: "Il Receiver (lo Stack) tiene nascosto il Delegate (la List)." },
  { c: "riuso", q: "Nello Stack con delega, push(elem) fa…", o: ["aList.add(elem)", "super.add(elem)", "add(elem) ereditato da List", "aList.remove(elem)"], e: "Ogni operazione dello Stack inoltra il lavoro alla lista interna." },
  { c: "riuso", q: "Nello Stack con ereditarietà, top() restituisce…", o: ["get(this.size()-1), l'ultimo elemento", "get(0), il primo elemento", "remove(0)", "size()"], e: "La cima della pila è l'ultimo elemento della lista." },
  { c: "riuso", q: "Il modo più economico per colmare il buco tra analisi e macchina è…", o: ["Riusare classi e soluzioni già pronte", "Riscrivere tutto da zero", "Aggiungere requisiti", "Fare più test di accettazione"], e: "Da qui ereditarietà, delega e design pattern." },
  { c: "riuso", q: "Nel JDK, quale classe è un esempio storico di ereditarietà sbagliata?", o: ["java.util.Stack, che estende Vector", "java.util.ArrayList, che implementa List", "java.lang.String", "java.util.HashSet"], e: "Stack eredita da Vector anche operazioni che rompono la LIFO." },
  { c: "riuso", q: "Ereditare da un'interfaccia ti dà…", o: ["Solo l'obbligo di implementare le operazioni", "Tutto il codice già scritto", "I campi privati dell'interfaccia", "La possibilità di non scrivere nulla"], e: "È l'ereditarietà di specifica: il contratto, non il codice." },
  { c: "riuso", q: "Pila che “contiene e delega” una List: nel class diagram si disegna come…", o: ["Pila ◆— List (composizione)", "Pila —▷ List (generalizzazione)", "Pila ┄▷ List (realizzazione)", "Pila ┄> List (dipendenza)"], e: "La pila crea e possiede la sua lista interna." },
  { c: "riuso", q: "Perché la delega è “meno efficiente”?", o: ["Ogni chiamata passa da un metodo ponte in più", "Usa più memoria per le interfacce", "Non può usare i cicli", "Deve copiare la lista a ogni operazione"], e: "Il costo è piccolo: una chiamata in più per operazione." },
  { c: "riuso", q: "Quale situazione viola Liskov?", o: ["Una sottoclasse che non può fare tutto ciò che la superclasse promette", "Una sottoclasse che aggiunge un metodo nuovo", "Una classe che implementa due interfacce", "Una classe che contiene un'altra classe"], e: "“È un” deve valere per ogni operazione della superclasse." },
  { c: "riuso", q: "Un'ereditarietà “stretta” è…", o: ["Una che rispetta il principio di Liskov", "Una con una sola sottoclasse", "Una ereditarietà multipla", "Una in cui la sottoclasse non aggiunge nulla"], e: "Stretta = sostituibilità garantita." },
  { c: "riuso", q: "Quando conviene l'ereditarietà di specifica?", o: ["Quando serve usare un oggetto al posto di un altro (subtyping)", "Quando voglio solo riusare il codice di una classe", "Quando la classe padre è concreta e piena di metodi", "Mai"], e: "Per il puro riuso del codice si preferisce la delega." },
  { c: "riuso", q: "Cosa NON compare tra i pro della delega?", o: ["Permette il subtyping", "Rispetta l'incapsulamento", "Rende il codice più robusto", "Permette di cambiare l'implementazione interna"], e: "Il subtyping è proprio ciò che la delega non dà." },
  { c: "riuso", q: "Nella delega, il Client vede…", o: ["Solo l'interfaccia del Receiver", "Anche il Delegate e i suoi metodi", "Solo il Delegate", "I campi privati del Receiver"], e: "Il Delegate resta nascosto dentro il Receiver." },
  { c: "riuso", q: "Lo Stack con ereditarietà da List è un esempio di…", o: ["Ereditarietà di implementazione", "Ereditarietà di specifica", "Delega", "Pattern Composite"], e: "Si eredita solo per riusare add, remove, get." },

  // 10 · Design pattern
  { c: "dp", q: "Cos'è un design pattern?", o: ["Una soluzione consolidata a un problema di progettazione ricorrente", "Una libreria di codice pronta da importare nel progetto", "Un diagramma UML obbligatorio in ogni documento di design", "Un linguaggio di modellazione alternativo a UML"], e: "Ogni pattern ha nome, problema, soluzione e conseguenze." },
  { c: "dp", q: "Chi è la “Gang of Four”?", o: ["Gamma, Helm, Johnson, Vlissides (1994)", "Booch, Rumbaugh, Jacobson", "Bruegge, Dutoit, Ostrand, Balcer", "Beck, Fowler, Martin, Cunningham"], e: "Sono gli autori del catalogo classico dei pattern." },
  { c: "dp", q: "Oltre alla soluzione, cosa offrono i pattern al team?", o: ["Un vocabolario comune: “qui c'è un adapter” spiega molto in una parola", "Il codice già scritto e testato, pronto da copiare", "La garanzia che il sistema finale sia senza bug", "La documentazione generata in automatico dal codice"], e: "Il nome del pattern trasmette tanto design in modo conciso." },
  { c: "dp", q: "Composite, Facade, Adapter, Bridge e Proxy sono pattern…", o: ["Strutturali", "Comportamentali", "Creazionali", "Architetturali"], e: "Strutturali: come comporre classi e oggetti riducendo l'accoppiamento." },
  { c: "dp", q: "Observer e Strategy sono pattern…", o: ["Comportamentali", "Strutturali", "Creazionali", "Di testing"], e: "Comportamentali: come gli oggetti si dividono le responsabilità e comunicano." },
  { c: "dp", q: "Abstract Factory è un pattern…", o: ["Creazionale", "Strutturale", "Comportamentale", "Di persistenza"], e: "Creazionali: creare oggetti nascondendo le classi concrete." },
  { c: "dp", q: "Cartelle che contengono file e altre cartelle, trattate allo stesso modo: pattern?", o: ["Composite", "Facade", "Proxy", "Bridge"], e: "Composite: strutture ad albero, foglie e nodi composti con la stessa interfaccia." },
  { c: "dp", q: "Nel Composite, cosa contiene il Composite?", o: ["Molti Component (foglie o altri Composite)", "Solo oggetti Leaf, mai altri Composite", "Un riferimento a un solo RealSubject", "Le factory concrete di ogni famiglia"], e: "Leaf e Composite estendono Component; il Composite contiene Component." },
  { c: "dp", q: "Un'unica interfaccia semplice per usare un sottosistema con tante classi: pattern?", o: ["Facade", "Adapter", "Composite", "Observer"], e: "La facciata nasconde le classi interne del sottosistema." },
  { c: "dp", q: "Che tipo di architettura permette la Facade?", o: ["Chiusa: al sottosistema si accede solo tramite la facade", "Aperta: ogni classe è accessibile da fuori", "Peer-to-peer", "Client-server obbligatoria"], e: "Il client si collega a una sola classe invece che a tante." },
  { c: "dp", q: "Classe esistente con un'interfaccia diversa da quella attesa, e non puoi modificarle: pattern?", o: ["Adapter", "Bridge", "Facade", "Abstract Factory"], e: "L'adapter (wrapper) traduce un'interfaccia nell'altra." },
  { c: "dp", q: "Con quale altro nome si chiama l'Adapter?", o: ["Wrapper", "Handle/Body", "Publish/Subscribe", "Kit"], e: "Handle/Body è il Bridge; Publish/Subscribe è l'Observer." },
  { c: "dp", q: "MyStringComparator implementa Comparator usando greaterThan() ed equals(). Che ruolo ha?", o: ["Adapter", "Adaptee", "Target", "Client"], e: "MyString è l'Adaptee, Comparator il Target, Array.sort il Client." },
  { c: "dp", q: "Nell'esempio di Array.sort, cosa restituisce compare() se o1 è “più grande” di o2?", o: ["1", "0", "−1", "true"], e: "Più grande → 1, uguale → 0, più piccolo → −1: il formato di Comparator." },
  { d: 56, c: "dp", q: "Separare un'astrazione dalla sua implementazione, sostituibile anche a runtime: pattern?", o: ["Bridge", "Adapter", "Proxy", "Composite"], e: "Bridge (Handle/Body): le due gerarchie evolvono in modo indipendente." },
  { c: "dp", q: "Differenza principale tra Adapter e Bridge?", o: ["Adapter collega interfacce già esistenti; Bridge si progetta in anticipo", "Sono la stessa cosa con nomi diversi", "Bridge si usa per i sistemi legacy, Adapter per quelli nuovi", "Adapter è creazionale, Bridge comportamentale"], e: "Adapter rimedia a un'incompatibilità; Bridge separa per scelta astrazione e implementazione." },
  { c: "dp", q: "AbstractEventEngine usa oggi EventEngineStub e domani ConcreteEventEngine senza cambiare il client. Pattern?", o: ["Bridge", "Observer", "Facade", "Composite"], e: "Lo stub permette di testare prima che l'implementazione vera esista." },
  { c: "dp", q: "Un sostituto con la stessa interfaccia che crea l'oggetto vero solo quando serve: pattern?", o: ["Proxy", "Adapter", "Facade", "Abstract Factory"], e: "Proxy: valutazione pigra (lazy) o invocazione remota." },
  { c: "dp", q: "Il Proxy usa…", o: ["Ereditarietà di interfaccia e delega", "Solo ereditarietà di implementazione", "Solo composizione di factory", "Observer e Composite insieme"], e: "Proxy e RealSubject hanno la stessa interfaccia; il Proxy inoltra al RealSubject." },
  { c: "dp", q: "“Trasparente rispetto alla posizione” (location transparent) suggerisce…", o: ["Proxy", "Facade", "Bridge", "Strategy"], e: "Il proxy remoto nasconde dove si trova davvero l'oggetto." },
  { c: "dp", q: "Quando un oggetto cambia stato, tutti quelli che dipendono da lui vengono avvisati: pattern?", o: ["Observer", "Composite", "Proxy", "Bridge"], e: "Dipendenza uno-a-molti tra Subject e Observer." },
  { c: "dp", q: "Quali metodi ha il Subject nell'Observer?", o: ["attach(o), detach(o), notify()", "update(), refresh(), draw()", "create(), destroy()", "compare(), equals()"], e: "notify() chiama update() su ogni Observer registrato." },
  { c: "dp", q: "Nell'Observer, quale metodo viene chiamato su ogni osservatore?", o: ["update()", "notify()", "attach()", "subscribe()"], e: "Il Subject fa notify(), che chiama update() di ciascun Observer." },
  { c: "dp", q: "Creare famiglie di oggetti correlati senza nominare le classi concrete (look Windows / Mac): pattern?", o: ["Abstract Factory", "Composite", "Facade", "Adapter"], e: "Ogni factory crea bottoni, menu e finestre dello stesso stile." },
  { c: "dp", q: "Qual è lo svantaggio principale dell'Abstract Factory?", o: ["Aggiungere un nuovo tipo di prodotto obbliga a cambiare tutte le factory", "Non permette di cambiare famiglia di prodotti a runtime", "Non garantisce la coerenza tra i prodotti di una famiglia", "Costringe il client a conoscere le classi concrete"], e: "I pro: isola le classi concrete, cambio di famiglia facile, coerenza." },
  { c: "dp", q: "“Il sistema deve funzionare con stampanti di produttori diversi”: pattern?", o: ["Abstract Factory", "Adapter", "Composite", "Observer"], e: "“Indipendente dal produttore / dal dispositivo” → Abstract Factory." },
  { d: 54, c: "dp", q: "“Deve interfacciarsi con un insieme di oggetti esistenti”: pattern?", o: ["Facade", "Adapter", "Bridge", "Proxy"], e: "Un insieme di oggetti → Facade; un singolo oggetto esistente → Adapter." },
  { c: "dp", q: "“Deve interfacciarsi con un oggetto esistente”: pattern?", o: ["Adapter", "Facade", "Composite", "Strategy"], e: "Attenzione alla coppia: un oggetto → Adapter, un insieme → Facade." },
  { c: "dp", q: "“Interfaccia verso più sistemi, alcuni ancora da sviluppare”: pattern?", o: ["Bridge", "Observer", "Composite", "Abstract Factory"], e: "Anche “un prototipo va mostrato presto” fa pensare al Bridge." },
  { d: 55, c: "dp", q: "“Struttura complessa, profondità e larghezza variabili”: pattern?", o: ["Composite", "Facade", "Proxy", "Adapter"], e: "Alberi di dimensione variabile → Composite." },
  { c: "dp", q: "“Estendibile”, “scalabile”: quale pattern suggeriscono le slide?", o: ["Observer", "Facade", "Adapter", "Proxy"], e: "Si aggiungono osservatori senza toccare il Subject." },
  { c: "dp", q: "“Una politica indipendente dal meccanismo”: pattern?", o: ["Strategy", "Bridge", "Composite", "Facade"], e: "È l'indizio testuale associato a Strategy." },
  { c: "dp", q: "In MVC, quale componente contiene dati e regole di business?", o: ["Model", "View", "Controller", "Facade"], e: "Il Model è il cuore e notifica le View quando cambia." },
  { c: "dp", q: "In MVC, chi traduce l'input dell'utente in azioni sul Model?", o: ["Controller", "View", "Model", "Observer"], e: "La View mostra e inoltra i gesti; il Controller decide cosa fare." },
  { c: "dp", q: "Quale pattern sta dietro l'aggiornamento delle View in MVC?", o: ["Observer", "Adapter", "Composite", "Bridge"], e: "View (e Controller) osservano il Model." },
  { c: "dp", q: "In MVC, cos'è la modalità pull?", o: ["La View, avvisata, chiede i dati al Model", "Il Model manda i dati alla View", "Il Controller copia i dati nella View", "La View salva i dati nel Model"], e: "Push: il Model spinge i dati; pull: la View li va a prendere." },
  { c: "dp", q: "Quale tecnica ricorda il riconoscere i pattern dagli indizi nel testo dei requisiti?", o: ["L'analisi di Abbott", "Il category-partition", "La BVA", "Il planning poker"], e: "Si cercano parole chiave nei requisiti non funzionali." },

  // 11 · Mapping models to code
  { c: "map", q: "Quali sono le 4 trasformazioni del mapping?", o: ["Trasformazione del modello, refactoring, forward e reverse engineering", "Analisi, design, codifica e test del sistema", "Unit, integration, system e acceptance testing", "Creazione, lettura, aggiornamento e cancellazione"], e: "Due nel model space, una nel code space, due che li collegano." },
  { c: "map", q: "La trasformazione del modello va…", o: ["Da modello a modello", "Da codice a codice", "Da modello a codice", "Da codice a modello"], e: "Serve a semplificare o ottimizzare il modello." },
  { d: 52, c: "map", q: "Il refactoring va…", o: ["Da codice a codice, senza cambiare il comportamento", "Da modello a codice, generando le classi", "Da codice a modello, ricostruendo il diagramma", "Da modello a modello, semplificando il diagramma"], e: "Migliora la struttura del codice, il comportamento resta uguale." },
  { d: 63, c: "map", q: "Il forward engineering va…", o: ["Da modello a codice", "Da codice a modello", "Da codice a codice", "Da modello a modello"], e: "Si genera il codice dal modello." },
  { c: "map", q: "Quando serve il reverse engineering?", o: ["Quando il modello è perso, mai fatto o non più allineato al codice", "Quando si vuole ottimizzare il codice senza cambiarlo", "Quando si devono scrivere i test di unità delle classi", "Quando il cliente cambia i requisiti funzionali"], e: "Reverse = dal codice si ricostruisce il modello." },
  { c: "map", q: "Rinominare una classe nel diagramma è…", o: ["Una trasformazione del modello", "Un refactoring", "Forward engineering", "Reverse engineering"], e: "Si resta nel model space: modello → modello." },
  { c: "map", q: "Quale NON è un principio delle trasformazioni?", o: ["Applicarne molte insieme per risparmiare tempo", "Un solo criterio alla volta", "Essere locale", "Essere seguita da una validazione"], e: "Ogni trasformazione va applicata in isolamento e poi testata." },
  { c: "map", q: "Perché nel refactoring si compila e testa dopo ogni passo?", o: ["Il codice ha molti dettagli e ogni passo può introdurre errori", "Perché il compilatore non accetta più modifiche insieme", "Per tenere aggiornato il modello UML a ogni modifica", "Per misurare come cambiano le prestazioni del codice"], e: "Si vuole scoprire subito l'errore introdotto." },
  { c: "map", q: "Spostare email in User: qual è il primo passo?", o: ["Spostare il campo nella superclasse e toglierlo dalle sottoclassi", "Spostare i metodi che usano email", "Aggiungere il costruttore User(String email)", "Cancellare le sottoclassi"], e: "Passi: 1) campo, 2) inizializzazione con super(email), 3) metodi. Con test dopo ogni passo." },
  { c: "map", q: "Nel secondo passo del refactoring di email, le sottoclassi…", o: ["Chiamano super(email) nel costruttore", "Dichiarano di nuovo il campo email", "Implementano un'interfaccia User", "Eliminano il costruttore"], e: "Il costruttore di User inizializza il campo comune." },
  { c: "map", q: "Nel forward engineering, ogni attributo diventa…", o: ["Un campo private con getX() e setX() public", "Un campo public, letto e scritto direttamente", "Una classe a parte collegata da un'associazione", "Un parametro del costruttore senza campo"], e: "Classe UML → classe Java; generalizzazione → extends." },
  { c: "map", q: "Perché il codice generato col forward engineering ha meno errori?", o: ["È sempre uguale, cambiano solo i nomi", "Lo scrive sempre lo sviluppatore più esperto", "Perché non ha bisogno di essere testato", "Perché usa meno classi del modello di partenza"], e: "Regole meccaniche → codice ripetitivo e prevedibile." },
  { c: "map", q: "Navighi spesso una lunga catena di associazioni. Ottimizzazione?", o: ["Aggiungere un'associazione diretta (percorso di accesso)", "Collassare tutte le classi della catena in una sola", "Mettere un Proxy davanti alla prima classe", "Cancellare le associazioni intermedie inutili"], e: "Una navigazione “molti” si può ridurre con un'associazione qualificata." },
  { c: "map", q: "SocialSecurity diventa una stringa in Person. Che ottimizzazione è?", o: ["Collassare oggetti", "Cache", "Ritardare calcoli costosi", "Percorso di accesso"], e: "Una classe con pochi attributi e poco comportamento diventa un attributo." },
  { c: "map", q: "ImageProxy carica i dati e crea RealImage solo quando serve paint(). Che ottimizzazione è?", o: ["Ritardare calcoli costosi", "Collassare oggetti", "Cache", "Associazione qualificata"], e: "È il pattern Proxy applicato al mapping." },
  { c: "map", q: "Salvare il risultato di un calcolo costoso in un attributo privato è…", o: ["Una cache", "Un collasso di oggetti", "Un percorso di accesso", "Un refactoring verticale"], e: "Si evita di ricalcolarlo ogni volta." },
  { c: "map", q: "Associazione uno-a-uno unidirezionale Cliente → Conto in Java diventa…", o: ["Un campo private Conto conto; in Cliente", "Un campo in entrambe le classi", "Una tabella associativa", "Un'interfaccia Conto"], e: "Unidirezionale: dal Cliente arrivo al Conto, non viceversa." },
  { c: "map", q: "Uno-a-molti senza ordine (un cliente, più conti) si mappa con…", o: ["Un Set", "Una List", "Un array di lunghezza fissa", "Un solo campo Conto"], e: "Se i conti devono essere ordinati si usa List." },
  { c: "map", q: "Perché addConto(c) chiama anche c.setOwner(this)?", o: ["Per tenere coerenti le due parti dell'associazione", "Per creare un nuovo conto collegato al cliente", "Per evitare che venga lanciata un'eccezione", "Per salvare subito il conto nel database"], e: "Bidirezionale: entrambe le estremità vanno aggiornate insieme." },
  { c: "map", q: "Quale tipo di ritorno conviene per getConti()?", o: ["Collection, padre di List e Set", "HashSet", "ArrayList", "Object"], e: "Così cambiare il vincolo (ordinato o no) non cambia l'interfaccia." },
  { c: "map", q: "Nel molti-a-molti, perché si controlla con contains prima di aggiungere?", o: ["Per evitare doppioni e un ciclo infinito tra addConto e addCliente", "Per rendere più veloce l'inserimento nella lista", "Perché una List non ammette elementi duplicati", "Per lanciare un'eccezione se l'elemento manca"], e: "I due metodi si chiamano a vicenda: senza controllo andrebbero in loop." },
  { c: "map", q: "Come si mappa una classe associativa nel codice?", o: ["Prima diventa una classe normale con due associazioni binarie", "Diventa un attributo di una delle due classi", "Si ignora", "Diventa un'interfaccia"], e: "Poi le due associazioni si mappano come le altre." },
  { c: "map", q: "Come si implementano i contratti in Java?", o: ["Con le eccezioni", "Con le interfacce", "Con i commenti", "Con l'ereditarietà"], e: "Java non supporta direttamente i contratti: si lancia un'eccezione se sono violati." },
  { c: "map", q: "Dove si controllano le precondizioni?", o: ["All'inizio del metodo", "Alla fine del metodo", "Nel costruttore della classe", "Nel test di accettazione"], e: "Postcondizioni e invarianti invece alla fine." },
  { c: "map", q: "Quale euristica sui controlli dei contratti è corretta?", o: ["Concentrarsi sugli oggetti entity, che durano a lungo", "Controllare tutto, sempre, anche i metodi privati", "Controllare solo i boundary", "Non controllare mai le precondizioni"], e: "Controllare tutto costa troppo: si possono omettere post/invarianti e i metodi privati." },
  { c: "map", q: "Se più postcondizioni sono violate, quante eccezioni si lanciano?", o: ["Solo una, per la prima", "Una per ciascuna", "Nessuna", "Dipende dal compilatore"], e: "Si segnala la prima violazione trovata." },
  { c: "map", q: "In un database relazionale, ogni classe diventa…", o: ["Una tabella con lo stesso nome", "Una colonna", "Una riga", "Una chiave esterna"], e: "Attributo → colonna; istanza → riga." },
  { c: "map", q: "Cos'è una chiave esterna?", o: ["Una colonna che punta alla chiave primaria di un'altra tabella", "La colonna che identifica la riga", "Un insieme di attributi che potrebbe identificare la riga", "Una tabella associativa"], e: "Primaria = identifica la riga; candidata = potrebbe farlo; esterna = riferimento." },
  { c: "map", q: "Come si mappa un'associazione molti-a-molti nel database?", o: ["Con una tabella associativa con le due chiavi esterne", "Con una chiave esterna sepolta nella tabella “molti”", "Con una sola tabella che contiene tutto", "Con una colonna di tipo lista"], e: "Esempio: City * Serves * Airport → tabella Serves." },
  { c: "map", q: "Come si mappa un'associazione uno-a-molti nel database?", o: ["Con una chiave esterna “sepolta” nella tabella della parte molti", "Con una tabella associativa con le due chiavi esterne", "Con una colonna lista nella tabella della parte uno", "Non si può mappare in un database relazionale"], e: "Es.: ogni Conto ha la colonna owner." },
  { c: "map", q: "Mapping verticale dell'ereditarietà: com'è fatto?", o: ["Una tabella per la superclasse e una per ogni sottoclasse", "Una tabella per sottoclasse con gli attributi copiati", "Una sola tabella per tutta la gerarchia", "Nessuna tabella per le sottoclassi"], e: "Stessa chiave primaria nelle tabelle collegate." },

  // 13 · Black-box testing
  { d: 73, c: "bb", q: "Nel black-box testing si guarda…", o: ["Solo la specifica: input e output attesi", "Il codice sorgente riga per riga", "I cammini del grafo di flusso", "La complessità ciclomatica"], e: "Il codice resta una scatola nera." },
  { c: "bb", q: "Cos'è una classe di equivalenza?", o: ["Un insieme di input su cui il programma dovrebbe comportarsi allo stesso modo", "Una classe Java che ha gli stessi metodi di un'altra", "Un gruppo di test duplicati da eliminare dal piano", "Un insieme di cammini indipendenti nel grafo di flusso"], e: "Basta un rappresentante per classe." },
  { c: "bb", q: "Ordini da 1 a 10 pizze. Quali classi di equivalenza?", o: ["< 1 non valida, 1–10 valida, > 10 non valida", "Solo la classe valida 1–10, gli altri sono errori", "Tre valori singoli: 1, 5 e 10 pizze", "Ordini pari e ordini dispari, entrambi validi"], e: "Tre test: per esempio 0, 5, 11." },
  { c: "bb", q: "Nel WECT (weak), quanti test servono?", o: ["Quanti le classi della variabile che ne ha di più", "Il prodotto del numero di classi di tutte le variabili", "La somma delle classi di tutte le variabili", "4n + 1, come nella boundary value analysis"], e: "Ogni classe di ogni variabile compare almeno una volta." },
  { c: "bb", q: "Nel SECT (strong), quanti test servono?", o: ["Il prodotto del numero di classi di ogni variabile", "Quanti le classi della variabile che ne ha di più", "La somma delle classi di tutte le variabili", "5ⁿ, come nel worst case testing"], e: "È il prodotto cartesiano di tutte le classi." },
  { c: "bb", q: "Tre variabili con 3, 4 e 2 classi: WECT e SECT?", o: ["WECT 4, SECT 24", "WECT 9, SECT 24", "WECT 4, SECT 9", "WECT 24, SECT 4"], e: "WECT = max(3,4,2) = 4; SECT = 3 × 4 × 2 = 24." },
  { c: "bb", q: "Due variabili con 3 e 5 classi: WECT e SECT?", o: ["WECT 5, SECT 15", "WECT 8, SECT 15", "WECT 3, SECT 8", "WECT 15, SECT 5"], e: "Massimo per il weak, prodotto per lo strong." },
  { c: "bb", q: "Perché la Boundary Value Analysis prova i bordi?", o: ["Gli errori si nascondono ai bordi, come un < al posto di <=", "Perché i valori centrali sono sempre giusti", "Perché costa meno", "Perché lo chiede il cliente"], e: "Gli off-by-one sono gli errori più comuni." },
  { c: "bb", q: "Quali sono i 5 valori della BVA per una variabile in [min, max]?", o: ["min, min+, nom, max−, max", "min−, min, nom, max, max+", "min, nom, max", "0, 1, nom, max−1, max"], e: "Con la robustness si aggiungono min− e max+." },
  { c: "bb", q: "Intervallo 1–100: valori della BVA?", o: ["1, 2, 50, 99, 100", "0, 1, 50, 100, 101", "1, 50, 100", "0, 2, 50, 99, 101"], e: "min, min+, nominale, max−, max." },
  { c: "bb", q: "Intervallo 1–100: cosa aggiunge il robustness testing?", o: ["0 e 101", "2 e 99", "50", "−1 e 102"], e: "min− e max+, fuori dall'intervallo valido." },
  { c: "bb", q: "Con n variabili, quanti test servono con la BVA?", o: ["4n + 1", "6n + 1", "5ⁿ", "7ⁿ"], e: "Ogni variabile ha 4 valori non nominali, più il caso tutto nominale." },
  { c: "bb", q: "Con n variabili, quanti test servono con il robustness testing?", o: ["6n + 1", "4n + 1", "5ⁿ", "7ⁿ"], e: "BVA + min− e max+ per ogni variabile." },
  { c: "bb", q: "Con n variabili, quanti test servono con il Worst Case Testing?", o: ["5ⁿ", "4n + 1", "7ⁿ", "6n + 1"], e: "Tutte le combinazioni dei 5 valori di ogni variabile." },
  { c: "bb", q: "Con n variabili, quanti test servono con il Robust Worst Case?", o: ["7ⁿ", "5ⁿ", "6n + 1", "4n + 1"], e: "Tutte le combinazioni dei 7 valori (con min− e max+)." },

  { c: "bb", q: "3 variabili: test robustness?", o: ["19", "13", "125", "343"], e: "6·3 + 1 = 19." },

  { c: "bb", q: "3 variabili: test Robust Worst Case?", o: ["343", "125", "19", "49"], e: "7³ = 343." },
  { c: "bb", q: "2 variabili: test Worst Case e Robust Worst Case?", o: ["25 e 49", "9 e 13", "10 e 14", "16 e 36"], e: "5² = 25, 7² = 49." },

  // 14 · Category-partition
  { c: "cp", q: "Chi ha proposto il metodo category-partition, e quando?", o: ["Ostrand e Balcer, 1988", "McCabe, 1976", "Fagan, 1976", "Gamma e altri, 1994"], e: "È un metodo sistematico per i test funzionali." },
  { c: "cp", q: "Qual è il vantaggio del category-partition rispetto al partizionamento “a mano”?", o: ["È sistematico e permette di controllare quanti test generare", "Non richiede di avere una specifica del sistema", "Guarda direttamente il codice sorgente da testare", "Genera sempre un solo test per ogni funzione"], e: "La specifica dei test è concisa e facile da modificare." },
  { c: "cp", q: "Qual è il primo passo del metodo?", o: ["Dividere il sistema in funzioni testabili separatamente", "Scrivere i vincoli tra le scelte", "Generare tutti i test frame validi", "Trovare le categorie di ogni parametro"], e: "Poi parametri, categorie, scelte, vincoli, frame, test case." },
  { c: "cp", q: "Cos'è una categoria?", o: ["Una proprietà principale di un parametro (es. lunghezza della stringa)", "Un valore concreto da dare in input al programma", "Una combinazione valida di scelte, una per parametro", "Il tipo di errore che il programma deve segnalare"], e: "La categoria è la proprietà; le scelte sono i suoi valori o classi." },
  { c: "cp", q: "Cosa sono le scelte (choices)?", o: ["I possibili valori o classi di una categoria: normali, limite, speciali, di errore", "Le funzioni del sistema da testare separatamente", "I test case concreti con valori già scelti", "I vincoli che legano tra loro i parametri"], e: "Sono come le classi di equivalenza." },
  { c: "cp", q: "Cos'è un test frame?", o: ["Una combinazione valida di scelte, una per categoria", "Un test case con i dati concreti già inseriti", "Il documento con il piano dei test del progetto", "Un driver che chiama la funzione sotto test"], e: "Diventa un test case quando ci metti valori concreti." },
  { c: "cp", q: "Qual è l'ultimo passo del metodo?", o: ["Trasformare ogni frame in un test case con dati concreti", "Generare i frame combinando le scelte", "Scrivere i vincoli tra le scelte", "Trovare le categorie dei parametri"], e: "Frame (astratto) → test case (concreto)." },
  { c: "cp", q: "Cosa fa l'annotazione [property X]?", o: ["“Accende” la proprietà X per i frame che contengono quella scelta", "Esclude la scelta da tutti i frame che hanno X", "Segna la scelta come un caso d'errore da testare", "Rende la scelta obbligatoria in ogni frame"], e: "Le altre scelte la usano con [if X]." },
  { c: "cp", q: "Cosa fa l'annotazione [if X]?", o: ["La scelta si combina solo con frame che hanno la proprietà X", "La scelta genera un solo frame, da sola", "La scelta accende la proprietà X negli altri frame", "La scelta diventa un errore quando X è vera"], e: "Si può scrivere anche if X and Y, if not X." },
  { c: "cp", q: "Cosa fa l'annotazione [error]?", o: ["Genera un solo frame, non combinato con le altre categorie", "Esclude tutti gli altri frame della stessa funzione", "Accende la proprietà error per le altre scelte", "Fa fallire il test di proposito per controllarlo"], e: "Basta un test per verificare un caso d'errore." },
  { c: "cp", q: "Differenza tra [error] e [single]?", o: ["[error] è per scelte che provocano errore, [single] per situazioni speciali o ridondanti: entrambe un solo frame", "[single] combina la scelta con tutti i frame, [error] con nessuno", "Nessuna: sono due nomi per la stessa annotazione", "[error] si mette sui parametri, [single] sulle funzioni da testare"], e: "Entrambe riducono il numero di frame." },
  { c: "cp", q: "Nell'esempio della stringa, perché x = 0 e x = 21 sono [error]?", o: ["Sono fuori dall'intervallo 1–20", "Sono valori nominali", "Sono i valori più frequenti", "Generano stringhe vuote valide"], e: "Il programma accetta lunghezze da 1 a 20." },
  { c: "cp", q: "Nell'esempio della stringa, perché con x = 1 non si provano “ultima” e “centrale”?", o: ["Con un solo carattere non hanno senso, e i vincoli le escludono", "Perché sono marcate come scelte [error]", "Perché sono marcate come scelte [single]", "Perché il programma non accetta stringhe corte"], e: "Usano [if stringok and not length1]." },
  { c: "cp", q: "Quanti test genera l'esempio “cerca un carattere in una stringa”?", o: ["12", "20", "9", "24"], e: "2 di errore, 2 con x = 1, 4 con x medio, 4 con x = 20." },
  { c: "cp", q: "Nell'esempio, la scelta x = 7 corrisponde a…", o: ["La categoria lunghezza media (2–19)", "Un caso d'errore", "Il limite superiore", "Il limite inferiore"], e: "Proprietà stringok e midlength." },
  { c: "cp", q: "Comando find senza vincoli: quanti frame?", o: ["1944", "125", "12", "343"], e: "Con [property]/[if] e [error] si scende a 125, con [single] ancora meno." },
  { c: "cp", q: "Comando find con i casi d'errore marcati [error]: quanti frame?", o: ["125", "1944", "12", "49"], e: "Gli errori non si combinano più con tutto il resto." },
  { c: "cp", q: "Da dove vengono le categorie?", o: ["Dalla specifica", "Dal codice sorgente", "Dal grafo di flusso", "Dalla complessità ciclomatica"], e: "È un metodo black-box." },
  { c: "cp", q: "Memoria allocata a blocchi di 256: quali scelte aggiungi grazie all'esperienza?", o: ["255, 256, 257", "0, 1, 2", "128, 512", "Solo 256"], e: "Le scelte vengono anche da dove sai che si nascondono i bug." },
  { c: "cp", q: "Il category-partition è una tecnica di test…", o: ["Funzionale (black-box)", "Strutturale (white-box)", "Di integrazione top-down", "Di usabilità"], e: "Lavora sulla specifica, non sul codice." },
  { c: "cp", q: "Cosa si fa dopo aver trovato i parametri di una funzione?", o: ["Si trovano le categorie di ogni parametro", "Si generano i test frame", "Si scrivono i test case concreti", "Si calcola la complessità ciclomatica"], e: "Funzioni → parametri → categorie → scelte → vincoli → frame → test case." },
  { c: "cp", q: "Oltre ai parametri, cosa si considera per ogni funzione?", o: ["Gli oggetti d'ambiente rilevanti", "Il numero di righe di codice", "Il numero di sviluppatori", "Le classi di analisi"], e: "Per esempio un file esistente o no." },
  { c: "cp", q: "A cosa servono i vincoli tra le scelte?", o: ["A eliminare le combinazioni senza senso e ridurre i frame", "A rendere i test più lenti ma più precisi", "A generare più casi d'errore da controllare", "A sostituire le categorie quando sono troppe"], e: "Senza vincoli i frame esplodono (1944 nel caso find)." },

  { c: "cp", q: "Categoria o scelta: “array vuoto (0 elementi)”?", o: ["Scelta", "Categoria", "Funzione", "Parametro"], e: "È uno dei valori della categoria “dimensione”." },
  { c: "cp", q: "In “x = 1 [property stringok, length1]”, cosa fa la scelta?", o: ["Accende le proprietà stringok e length1", "Si combina solo con frame che hanno stringok", "Genera un solo frame d'errore", "Esclude la stringa"], e: "Poi “a di lunghezza 1 [if stringok and length1]” si aggancia a lei." },
  { c: "cp", q: "Quale di queste NON è una categoria del comando find?", o: ["Complessità ciclomatica del codice", "Dimensione del pattern", "Quoting del pattern", "Numero di occorrenze nel file"], e: "Il metodo non guarda il codice." },

  // 15 · White-box testing
  { d: 72, c: "wb", q: "Nel white-box testing si guarda…", o: ["La struttura interna del codice", "Solo la specifica", "Solo l'interfaccia utente", "Solo i requisiti non funzionali"], e: "Si scelgono i test per eseguire tutte le parti del codice." },
  { c: "wb", q: "Statement coverage significa…", o: ["Ogni istruzione eseguita almeno una volta", "Ogni ramo provato vero e falso", "Ogni cammino eseguito", "Ogni ciclo saltato"], e: "È il criterio più debole." },
  { c: "wb", q: "Branch coverage significa…", o: ["Ogni uscita di ogni condizione (vero e falso) provata almeno una volta", "Ogni istruzione del programma eseguita almeno una volta", "Ogni cammino possibile del programma eseguito", "Ogni ciclo del programma eseguito più di una volta"], e: "if/else → due test: condizione vera e falsa." },
  { c: "wb", q: "Path coverage significa…", o: ["Ogni cammino possibile nel programma eseguito", "Ogni istruzione eseguita almeno una volta", "Ogni ramo provato sia vero sia falso", "Ogni classe del sistema testata una volta"], e: "È il più completo e il più costoso." },
  { c: "wb", q: "Quali 3 casi prevede il loop testing?", o: ["Ciclo saltato, eseguito una volta, eseguito più volte", "Ciclo infinito, ciclo breve e ciclo lungo", "Prima del ciclo, durante e dopo il ciclo", "Indice pari, indice dispari e indice zero"], e: "Per il while di FindMean: file vuoto, un punteggio, più punteggi." },
  { c: "wb", q: "if (i == TRUE) … else …: quanti test per la branch coverage?", o: ["Due: i = TRUE e i = FALSE", "Uno solo", "Quattro", "Nessuno"], e: "Ogni uscita della condizione almeno una volta." },
  { c: "wb", q: "computeFine ha 2 if indipendenti. Quanti cammini?", o: ["4", "2", "3", "8"], e: "2 decisioni × 2 esiti = 4 cammini." },
  { c: "wb", q: "computeFine: quanti test bastano per la branch coverage?", o: ["2", "4", "3", "1"], e: "Test 1 (vero, vero) e test 2 (falso, falso) coprono tutti i rami." },
  { c: "wb", q: "computeFine: quanti test servono per la path coverage?", o: ["4", "2", "3", "6"], e: "Tutte le combinazioni dei due esiti." },
  { c: "wb", q: "Branch coverage implica path coverage?", o: ["No: in computeFine bastano 2 test per i rami, ma i cammini sono 4", "Sì, sempre: coprire i rami copre i cammini", "Sì, ma solo se il codice non ha cicli", "Sì, perché sono due nomi dello stesso criterio"], e: "Il path è più forte del branch." },
  { c: "wb", q: "Come si calcola la complessità ciclomatica di McCabe, nel modo comodo?", o: ["Numero di decisioni + 1", "Numero di istruzioni + 1", "Numero di cammini × 2", "Numero di cicli − 1"], e: "Oppure V(G) = archi − nodi + 2." },
  { c: "wb", q: "La formula V(G) = archi − nodi + 2 calcola…", o: ["La complessità ciclomatica", "Il numero di test BVA", "Il numero di frame", "La capacità del team"], e: "Archi e nodi del grafo di flusso." },
  { c: "wb", q: "Complessità ciclomatica di computeFine?", o: ["3", "4", "2", "5"], e: "2 decisioni + 1 = 3." },
  { c: "wb", q: "Un metodo con 3 if indipendenti: complessità ciclomatica?", o: ["4", "3", "8", "6"], e: "3 + 1 = 4." },
  { c: "wb", q: "Cosa indica la complessità ciclomatica?", o: ["Il numero minimo di test per coprire le decisioni con cammini indipendenti", "Il numero totale di cammini possibili del programma", "Il numero di righe di codice del metodo", "Il numero di classi di equivalenza degli input"], e: "Sono i cammini linearmente indipendenti." },
  { c: "wb", q: "Nel grafo di flusso, cosa sono i nodi e gli archi?", o: ["Nodi = blocchi di codice, archi = salti", "Nodi = classi, archi = associazioni", "Nodi = test, archi = risultati", "Nodi = variabili, archi = assegnamenti"], e: "Si usa per FindMean." },
  { c: "wb", q: "FindMean: quale test fa saltare il ciclo while?", o: ["File vuoto", "Un solo punteggio", "Più punteggi positivi", "Punteggi negativi"], e: "Saltato, una volta, più volte." },
  { c: "wb", q: "FindMean: perché servono punteggi sia positivi sia negativi?", o: ["Per coprire entrambi i rami dell'if dentro il ciclo", "Per far saltare del tutto il ciclo while", "Per simulare il caso del file vuoto", "Per controllare la stampa della media"], e: "Si sommano solo i positivi: serve provare anche il ramo falso." },
  { c: "wb", q: "Cosa non può trovare il white-box?", o: ["Le funzionalità mancanti", "Le istruzioni morte", "I rami non coperti", "I cicli non testati"], e: "Testa ciò che il codice fa, non ciò che dovrebbe fare." },
  { c: "wb", q: "Cosa non può trovare il black-box?", o: ["Le funzionalità inattese nel codice", "Le funzionalità mancanti", "Gli errori sui valori limite", "Gli input non validi gestiti male"], e: "Coppia da ricordare: white = mancanti no; black = inattese no." },
  { c: "wb", q: "Quale limite ha il white-box sul numero di test?", o: ["Il numero di cammini è potenzialmente infinito", "I test necessari sono sempre pochissimi", "Non si può applicare al codice con cicli", "Richiede sempre la presenza del cliente"], e: "Il black-box invece soffre di esplosione combinatoria degli input." },
  { c: "wb", q: "White-box e black-box…", o: ["Servono entrambi: sono due estremi di un continuum", "Sono alternativi: se ne usa solo uno", "Il black-box rende inutile il white-box", "Il white-box rende inutile il black-box"], e: "La scelta dipende da cammini logici, natura degli input e quantità di calcolo." },
  { c: "wb", q: "computeFine con daysLate = 60 e printOn = FALSE percorre…", o: ["Falso, falso", "Vero, vero", "Vero, falso", "Falso, vero"], e: "60 > 30 → ramo falso; printOn falso → niente stampa." },
  { c: "wb", q: "computeFine con daysLate = 1 e printOn = TRUE percorre…", o: ["Vero, vero", "Falso, falso", "Vero, falso", "Falso, vero"], e: "1 ≤ 30 → ramo vero; printOn vero → stampa." },
  { c: "wb", q: "Quale criterio white-box è più forte?", o: ["Path coverage", "Statement coverage", "Branch coverage", "Sono equivalenti"], e: "Statement < branch < path." },
  { c: "wb", q: "Un metodo con un solo if-else: complessità ciclomatica?", o: ["2", "1", "3", "4"], e: "1 decisione + 1 = 2." },
  { c: "wb", q: "Il white-box testa…", o: ["Ciò che il codice fa, non ciò che dovrebbe fare", "Ciò che il cliente ha chiesto nei requisiti", "Solo l'interfaccia esterna dei componenti", "Solo i requisiti non funzionali del sistema"], e: "Per questo non vede le funzionalità mancanti." },
  { c: "wb", q: "In computeFine con daysLate > 30 la multa è…", o: ["daysLate × 0,50", "daysLate × 0,25", "0", "30 × 0,25"], e: "Ramo falso: tariffa raddoppiata." },
  { c: "wb", q: "Quale tipo di white-box esegue ogni istruzione almeno una volta, senza badare ai rami?", o: ["Statement", "Branch", "Path", "Loop"], e: "Un if senza else può essere coperto senza provare il ramo falso." },
  { c: "wb", q: "Per il loop testing di un while servono…", o: ["Tre test: 0, 1 e più iterazioni", "Un test con molte iterazioni", "Due test: vero e falso", "Un test per ogni iterazione possibile"], e: "Saltato, una volta, più volte." },

  // 16 · Integrazione e sistema
  { c: "its", q: "Cos'è una strategia di integrazione?", o: ["L'ordine in cui si integrano i sottosistemi", "Il modo di scrivere i test di unità", "Il documento con i casi di test", "Il piano degli sprint"], e: "Si immagina il sistema a livelli ordinati da chi chiama chi." },
  { c: "its", q: "Big bang: come funziona?", o: ["Test di unità, poi tutto insieme in un colpo", "Si parte dal livello più basso", "Si parte dal livello più alto", "Si convergono due direzioni su un layer"], e: "Semplice, non serve niente, ma se fallisce non sai dove." },
  { c: "its", q: "Qual è il difetto principale del big bang?", o: ["Quando qualcosa non va è difficile localizzare il fault", "Servono troppi stub per i livelli bassi", "Servono troppi driver per i livelli alti", "L'interfaccia utente si testa per ultima"], e: "Tutto è integrato insieme." },
  { c: "its", q: "Bottom-up usa stub o driver?", o: ["Driver", "Stub", "Entrambi", "Nessuno"], e: "I driver simulano i livelli superiori, che ancora non ci sono." },
  { c: "its", q: "Top-down usa stub o driver?", o: ["Stub", "Driver", "Entrambi", "Nessuno"], e: "Gli stub simulano i livelli inferiori." },
  { c: "its", q: "Quale strategia testa per ultima l'interfaccia utente?", o: ["Bottom-up", "Top-down", "Sandwich", "Big bang"], e: "L'interfaccia sta in cima, e il bottom-up sale dal basso." },
  { c: "its", q: "Quale strategia testa subito logica e interfaccia, ma richiede tanti stub?", o: ["Top-down", "Bottom-up", "Big bang", "Shadow"], e: "Si parte dal livello più alto." },
  { c: "its", q: "Il bottom-up è utile soprattutto per…", o: ["Sistemi orientati agli oggetti e real-time", "Sistemi con molte interfacce grafiche", "Prototipi usa e getta", "Test di usabilità"], e: "Si costruisce dalle fondamenta." },
  { d: 65, c: "its", q: "Sandwich: come funziona?", o: ["Top-down sopra e bottom-up sotto, convergendo su un layer target", "Si integrano tutti i layer insieme in un colpo", "Si parte solo dal livello più basso e si sale", "Prima i layer singoli in parallelo, poi combinati"], e: "Serve sia stub sia driver." },
  { c: "its", q: "Qual è il problema del sandwich classico?", o: ["Il layer target non è testato da solo", "Servono solo stub", "Non si può parallelizzare", "Non usa driver"], e: "Il sandwich modificato lo risolve, ma costa di più." },
  { c: "its", q: "Sandwich modificato: cosa fa in più?", o: ["Testa prima i 3 layer singolarmente, poi combinati", "Usa solo driver, senza nessuno stub", "Integra tutti i layer in un colpo solo", "Elimina gli stub dal layer target"], e: "Risolve il problema del layer target, a costo maggiore." },
  { c: "its", q: "Quali strategie richiedono sia stub sia driver?", o: ["Sandwich e sandwich modificato", "Bottom-up e top-down", "Big bang e bottom-up", "Solo big bang"], e: "Stanno a metà tra le due direzioni." },
  { c: "its", q: "Il functional testing del sistema è…", o: ["Black-box sul sistema intero, con test ricavati dai casi d'uso", "White-box sulle singole classi del sistema", "Un test di stress con il massimo degli utenti", "Il test con cui il cliente accetta il sistema"], e: "Es. PurchaseTicket: biglietto acquistato, resto corretto, annullamento." },
  { c: "its", q: "“Se deve gestire 1000 elementi, provalo con 1001.” Di che test si parla?", o: ["Performance testing", "Functional testing", "Acceptance testing", "Unit testing"], e: "Nel performance testing si cerca di rompere il sistema." },
  { c: "its", q: "Test con il massimo numero di utenti contemporanei: è un test di…", o: ["Stress", "Volume", "Timing", "Recovery"], e: "Volume = tanti dati; stress = tanti utenti." },
  { c: "its", q: "Test con tantissimi dati: è un test di…", o: ["Volume", "Stress", "Security", "Configuration"], e: "Coppia da non confondere con lo stress." },
  { c: "its", q: "Pilot test: alpha o beta, se fatto da pochi utenti nell'ambiente reale?", o: ["Beta", "Alpha", "Shadow", "Benchmark"], e: "Alpha = nell'ambiente di sviluppo." },
  { c: "its", q: "Alpha test: dove si svolge?", o: ["Nell'ambiente di sviluppo", "Nell'ambiente reale dei clienti", "In parallelo al vecchio sistema", "Sul sistema di un concorrente"], e: "Il beta invece nell'ambiente reale." },
  { c: "its", q: "Shadow testing: cos'è?", o: ["Vecchio e nuovo sistema in parallelo, si confrontano gli output", "Il cliente prepara casi tipici su cui valutare il sistema", "Si confronta il sistema con quello di un concorrente", "Si testa il sistema di notte, quando nessuno lo usa"], e: "È una forma di acceptance test." },
  { c: "its", q: "Benchmark test (acceptance): cos'è?", o: ["Il cliente prepara casi tipici su cui valutare il sistema", "Vecchio e nuovo sistema in parallelo, confrontando gli output", "Un test di stress con il massimo numero di utenti", "Un confronto con il sistema di un concorrente"], e: "Competitor = contro un concorrente; shadow = in parallelo al vecchio." },
  { c: "its", q: "Installation testing: cosa si fa?", o: ["Si ripetono functional e performance test nell'ambiente di utilizzo", "Si installano gli strumenti di sviluppo del team", "Si testano soltanto le classi entity del dominio", "Si scrive il test plan con risorse e calendario"], e: "Se va bene, rilascio ufficiale." },
  { c: "its", q: "Quale documento IEEE 829 descrive gli aspetti manageriali del testing?", o: ["Test Plan", "Test Case Specification", "Test Incident Report", "Test Summary Report"], e: "Cosa si testa, approccio, criteri, risorse, calendario, rischi." },
  { c: "its", q: "Quale documento elenca input, driver/stub e output attesi di ogni test?", o: ["Test Case Specification", "Test Plan", "Test Summary Report", "RAD"], e: "Uno per ogni test." },
  { c: "its", q: "Perché il Test Incident Report si chiama “incidente”?", o: ["Perché non è detto che il risultato inatteso sia un vero failure", "Perché descrive un guasto dell'hardware di test", "Perché lo compila il cliente durante l'accettazione", "Perché segnala un ritardo nel calendario dei test"], e: "Ogni esecuzione con risultato inatteso va analizzata." },
  { c: "its", q: "Quale documento elenca tutti i failure trovati, da indagare e correggere?", o: ["Test Summary Report", "Test Plan", "Test Case Specification", "Problem statement"], e: "È il riepilogo finale." },

  // 02 · Requisiti: dall'elicitation all'analisi (contenuti nuovi)
  { c: "req", q: "Cosa fa l'analisi a partire dalle richieste raccolte?", o: ["Le trasforma in un modello formale o semiformale del sistema", "Le trasforma direttamente nel codice del sistema", "Le archivia così come sono, senza modificarle", "Le fa approvare dal team di test prima del design"], e: "Serve a rendere espliciti i concetti, chiarire i flussi e scoprire errori prima del design." },
  { c: "req", q: "Quali sono i quattro obiettivi del modello di analisi?", o: ["Corretto, completo, consistente, non ambiguo", "Veloce, economico, bello, sicuro", "Correttezza, realismo, tracciabilità, priorità", "Funzionale, a oggetti, dinamico, fisico"], e: "Attenzione a non confonderli con i 5 criteri di validazione dei requisiti." },
