<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Sessione · Appunti Unisa</title>
    <meta
      name="description"
      content="Organizza la sessione d'esami: scegli gli esami e le date, e ricevi un piano giorno per giorno."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <style>
      /* La pagina usa i colori comuni del sito (assets/site.css, variabili --ua-...), collegati in pubblicazione.
         Indice: pagina · titolo · moduli (esami, tempo, ripasso, promemoria) · riepilogo · giorni del calendario · stampa */

      /* pagina */
      html {
        background: var(--ua-bg-page, #f2f4f7);
      }
      body {
        margin: 0;
        background: var(--ua-bg-page, #f2f4f7);
        color: var(--ua-ink, #111418);
        font:
          400 16px/1.55 "IBM Plex Sans",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 40px max(20px, env(safe-area-inset-right, 0px)) 120px
          max(20px, env(safe-area-inset-left, 0px));
      }
      .eyebrow,
      .ss-k {
        font:
          500 12.5px/1 "IBM Plex Mono",
          ui-monospace,
          monospace;
        color: var(--ua-muted, #5b6370);
      }
      .eyebrow a {
        color: inherit;
        text-underline-offset: 3px;
      }
      .ss-k {
        display: block;
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        margin-bottom: 10px;
      }

      /* titolo: gradiente del sito (viola → blu → verde), come il bordo della card "Sessione" in home */
      h1 {
        font:
          800 clamp(36px, 8vw, 52px)/1 "Schibsted Grotesk",
          "Helvetica Neue",
          Arial,
          sans-serif;
        letter-spacing: -0.02em;
        margin: 12px 0 10px;
        width: fit-content;
        padding-right: 0.04em;
        background: linear-gradient(100deg, var(--ua-c-is), var(--ua-c-bd) 55%, var(--ua-c-mp));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      h2 {
        font:
          700 21px/1.2 "Schibsted Grotesk",
          "Helvetica Neue",
          Arial,
          sans-serif;
        letter-spacing: -0.01em;
        margin: 34px 0 12px;
      }
      .lede {
        color: var(--ua-muted, #5b6370);
        margin: 0 0 26px;
        max-width: 58ch;
      }
      .muted {
        color: var(--ua-muted, #5b6370);
      }
      .ss-wait {
        color: var(--ua-muted, #5b6370);
      }

      /* moduli */
      fieldset {
        margin: 0 0 16px;
        padding: 18px 20px 20px;
        border: 1px solid var(--ua-line);
        border-radius: 16px;
        background: color-mix(in srgb, var(--ua-soft) 45%, var(--ua-bg));
      }
      legend {
        padding: 0 6px;
        font-weight: 600;
      }
      label {
        cursor: pointer;
      }
      input[type="date"],
      input[type="number"],
      select,
      textarea {
        box-sizing: border-box;
        min-height: 42px;
        padding: 8px 12px;
        border: 1px solid var(--ua-line);
        border-radius: 10px;
        background: var(--ua-bg);
        color: var(--ua-ink);
        font: inherit;
      }
      textarea {
        width: 100%;
        min-height: 84px;
        resize: vertical;
      }
      .ss-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 14px;
      }
      .ss-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 14px;
        color: var(--ua-muted);
      }
      .ss-field > :not(span) {
        color: var(--ua-ink);
      }
      /* display: flex non deve vincere sull'attributo hidden (es. "Arriva il" solo con "In un giorno preciso") */
      .ss-field[hidden],
      .ss-note[hidden] {
        display: none;
      }
      .ss-exam {
        position: relative;
        display: grid;
        gap: 12px;
        padding: 14px 16px;
        margin-bottom: 10px;
        border: 1px solid var(--ua-line);
        border-left: 4px solid var(--c, var(--ua-line));
        border-radius: 12px;
        background: var(--ua-bg);
      }
      .ss-exam-top {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 10px;
        align-items: end;
      }
      .ss-exam-top select {
        width: 100%;
      }
      .ss-x {
        width: 42px;
        height: 42px;
        border: 1px solid var(--ua-line);
        border-radius: 10px;
        background: none;
        color: var(--ua-muted);
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
      }
      .ss-x:hover {
        color: var(--ua-warn);
        border-color: var(--ua-warn-line);
      }
      .ss-seg {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 3px;
        border: 1px solid var(--ua-line);
        border-radius: 12px;
      }
      .ss-seg label {
        position: relative;
      }
      .ss-seg input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .ss-seg span {
        display: block;
        padding: 6px 12px;
        border-radius: 9px;
        font-size: 14px;
        color: var(--ua-muted);
      }
      .ss-seg input:checked + span {
        background: var(--ua-ink);
        color: var(--ua-bg);
        font-weight: 600;
      }
      .ss-seg input:focus-visible + span {
        outline: 2px solid var(--ua-ink);
        outline-offset: 2px;
      }
      .ss-note a {
        color: inherit;
        text-underline-offset: 3px;
      }
      .ss-note {
        margin: 0;
        font-size: 13.5px;
        color: var(--ua-muted);
      }
      /* Livello per capitolo (corsi con programma d'esame): riquadro apribile, chiuso di base */
      .ss-lvs {
        padding: 0 12px;
        border: 1px dashed var(--ua-line);
        border-radius: 10px;
      }
      .ss-lvs summary {
        padding: 10px 0;
        font-size: 14px;
        color: var(--ua-muted);
        cursor: pointer;
      }
      .ss-lvs summary b {
        color: var(--ua-ink);
        font-weight: 600;
      }
      .ss-lvs-l {
        display: grid;
        gap: 12px;
        padding-bottom: 12px;
      }
      .ss-lv-row {
        display: grid;
        gap: 6px;
        font-size: 14px;
      }
      .ss-lv-row[hidden] {
        display: none;
      }
      .ss-lv-row .ss-seg span {
        padding: 4px 10px;
        font-size: 13px;
      }
      @media (min-width: 720px) {
        .ss-lv-row {
          grid-template-columns: minmax(0, 1fr) auto;
          align-items: center;
        }
      }
      .ss-days {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .ss-chip input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .ss-chip span {
        display: block;
        padding: 6px 12px;
        border: 1px solid var(--ua-line);
        border-radius: 999px;
        font-size: 14px;
        color: var(--ua-muted);
      }
      .ss-chip input:checked + span {
        border-color: var(--ua-ink);
        color: var(--ua-ink);
        font-weight: 600;
      }
      .ss-chip input:focus-visible + span {
        outline: 2px solid var(--ua-ink);
        outline-offset: 2px;
      }
      input[type="range"] {
        flex: 1;
        min-width: 160px;
        accent-color: var(--ua-c-is);
      }
      output {
        min-width: 64px;
        font-weight: 600;
      }
      .ss-check {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 10px;
        align-items: start;
      }
      .ss-check input {
        width: 18px;
        height: 18px;
        margin-top: 3px;
        accent-color: var(--ua-c-is);
      }
      .ss-check small {
        display: block;
        color: var(--ua-muted);
        font-size: 13.5px;
      }
      .ss-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-top: 18px;
      }
      .ss-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 42px;
        padding: 9px 18px;
        border: 1px solid var(--ua-line);
        border-radius: 999px;
        background: none;
        color: var(--ua-ink);
        font: 600 15px/1.2 inherit;
        font-family: inherit;
        text-decoration: none;
        cursor: pointer;
      }
      .ss-btn:hover {
        border-color: var(--ua-muted);
      }
      .ss-btn.solid {
        border-color: var(--ua-ink);
        background: var(--ua-ink);
        color: var(--ua-bg);
      }
      .ss-btn.danger {
        color: var(--ua-warn);
        border-color: var(--ua-warn-line);
      }
      .ss-btn[disabled] {
        opacity: 0.6;
        cursor: wait;
      }
      .ss-msg {
        font-size: 14px;
        color: var(--ua-warn);
      }
      .ss-info {
        margin: 0 0 10px;
        padding: 12px 14px;
        border-radius: 12px;
        font-size: 14.5px;
        background: color-mix(in srgb, var(--ua-c-bd) 10%, var(--ua-bg));
        border: 1px solid color-mix(in srgb, var(--ua-c-bd) 35%, var(--ua-line));
      }
      /* resoconto del ricalcolo automatico: riepilogo con la ✕, poi i dettagli da aprire */
      .ss-rp-top {
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }
      .ss-rp-top p {
        flex: 1;
        margin: 0;
      }
      .ss-rp-x {
        flex: none;
        width: 28px;
        height: 28px;
        margin: -4px -6px 0 0;
        border: 0;
        border-radius: 8px;
        font: inherit;
        font-size: 14px;
        color: var(--ua-muted);
        background: transparent;
        cursor: pointer;
      }
      .ss-rp-x:hover,
      .ss-rp-x:focus-visible {
        color: var(--ua-ink);
        background: color-mix(in srgb, var(--ua-c-bd) 14%, transparent);
      }
      .ss-rp-more summary {
        margin-top: 8px;
        cursor: pointer;
        font-size: 14px;
        color: var(--ua-muted);
      }
      .ss-rp-g h4 {
        margin: 12px 0 6px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--ua-muted);
      }
      .ss-rp-g ul {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 6px;
      }
      .ss-rp-g li {
        display: grid;
        grid-template-columns: 36px 1fr;
        align-items: baseline;
        gap: 8px;
        font-size: 14px;
      }
      .ss-rp-g li > div {
        min-width: 0;
      }
      .ss-rp-c {
        padding: 1px 0;
        text-align: center;
        border-radius: 999px;
        font-family: var(--f-mono, ui-monospace, monospace);
        font-size: 11.5px;
        color: var(--c);
        background: color-mix(in srgb, var(--c) 14%, transparent);
      }
      .ss-rp-g em {
        font-style: normal;
        white-space: nowrap;
        color: var(--ua-muted);
      }
      .ss-rp-g small {
        display: block;
        font-size: 12.5px;
        color: var(--ua-muted);
      }

      /* consiglio: i capitoli introduttivi, facoltativi (non entrano nel piano) */
      .ss-tip {
        margin: 0 0 10px;
        padding: 12px 14px;
        border: 1px dashed var(--ua-line);
        border-radius: 12px;
        font-size: 14.5px;
        color: var(--ua-muted);
      }
      .ss-tip b {
        color: var(--ua-ink);
      }
      .ss-tip a {
        color: inherit;
        text-underline-offset: 3px;
      }

      /* progetto nel modulo: casella, poi ore e consegna */
      .ss-prj {
        padding-top: 12px;
        border-top: 1px dashed var(--ua-line);
      }
      .ss-prj-f {
        margin-top: 12px;
      }
      .ss-ore select {
        min-width: 110px;
      }

      /* riepilogo: un riquadro per esame, con conto alla rovescia e avanzamento */
      .ss-exams {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 10px;
      }
      .ss-ex {
        display: grid;
        gap: 4px;
        padding: 14px 16px;
        border: 1px solid var(--ua-line);
        border-radius: 14px;
        background: radial-gradient(
          260px 120px at 0 0,
          color-mix(in srgb, var(--c) 16%, transparent),
          transparent 70%
        );
      }
      .ss-ex-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .ss-code {
        font:
          600 12px/1 "IBM Plex Mono",
          monospace;
        color: var(--c);
      }
      .ss-cd {
        font:
          500 12px/1 "IBM Plex Mono",
          monospace;
        padding: 4px 9px;
        border-radius: 999px;
        color: var(--c);
        background: color-mix(in srgb, var(--c) 14%, transparent);
        white-space: nowrap;
      }
      .ss-ex b {
        font-size: 15.5px;
        line-height: 1.3;
      }
      .ss-bar {
        height: 6px;
        margin-top: 6px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--ua-ink) 10%, transparent);
        overflow: hidden;
      }
      .ss-prj-l {
        margin-top: 6px;
        font-size: 12.5px;
        color: var(--ua-muted);
      }
      .ss-bar.prj {
        margin-top: 4px;
      }
      .ss-bar.prj i {
        background: repeating-linear-gradient(
          135deg,
          var(--c),
          var(--c) 6px,
          color-mix(in srgb, var(--c) 60%, transparent) 6px,
          color-mix(in srgb, var(--c) 60%, transparent) 12px
        );
      }
      .ss-bar i {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: var(--c);
      }

      /* giorni del calendario */
      .ss-day {
        margin-bottom: 12px;
        border: 1px solid var(--ua-line);
        border-radius: 16px;
        overflow: hidden;
      }
      .ss-day.today {
        border: 1.5px solid transparent;
        background:
          linear-gradient(var(--ua-bg), var(--ua-bg)) padding-box,
          linear-gradient(120deg, var(--ua-c-is), var(--ua-c-bd) 55%, var(--ua-c-mp)) border-box;
      }
      .ss-dh {
        display: grid;
        grid-template-columns: 52px minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        padding: 12px 16px;
        background: color-mix(in srgb, var(--ua-soft) 55%, transparent);
      }
      .ss-dt {
        display: grid;
        justify-items: center;
        line-height: 1.1;
        font:
          500 11.5px/1.15 "IBM Plex Mono",
          monospace;
        color: var(--ua-muted);
      }
      .ss-dt b {
        font:
          700 22px/1.1 "Schibsted Grotesk",
          sans-serif;
        color: var(--ua-ink);
      }
      .ss-dh h3 {
        margin: 0;
        font-size: 15.5px;
        line-height: 1.3;
      }
      .ss-tag {
        display: inline-block;
        margin: 0 6px 3px 0;
        padding: 2px 8px;
        border-radius: 999px;
        font:
          500 11.5px/1.4 "IBM Plex Mono",
          monospace;
        color: var(--c, var(--ua-ink));
        background: color-mix(in srgb, var(--c, var(--ua-ink)) 13%, transparent);
      }
      .ss-min {
        font:
          500 12.5px/1 "IBM Plex Mono",
          monospace;
        color: var(--ua-muted);
      }
      .ss-min b {
        color: var(--ua-c-mp);
      }
      .ss-day ul {
        list-style: none;
        margin: 0;
        padding: 6px 8px 8px;
      }
      .ss-task label {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 10px;
        align-items: start;
        padding: 9px 8px;
        border-radius: 10px;
      }
      .ss-task label:hover {
        background: color-mix(in srgb, var(--ua-soft) 60%, transparent);
      }
      .ss-task input {
        width: 19px;
        height: 19px;
        margin-top: 2px;
        accent-color: var(--ua-c-is);
      }
      .ss-tx {
        min-width: 0;
      }
      .ss-tx b {
        font-weight: 600;
      }
      .ss-tx b::before {
        content: "";
        display: inline-block;
        width: 8px;
        height: 8px;
        margin: 0 8px 1px 0;
        border-radius: 50%;
        background: var(--c);
      }
      .ss-tx small {
        display: block;
        margin-top: 2px;
        font-size: 13.5px;
        line-height: 1.45;
        color: var(--ua-muted);
      }
      .ss-tx a {
        color: inherit;
        text-underline-offset: 3px;
      }
      .ss-task.done .ss-tx b {
        text-decoration: line-through;
        color: var(--ua-muted);
      }
      .ss-tm {
        font:
          500 12.5px/1.6 "IBM Plex Mono",
          monospace;
        color: var(--ua-muted);
        white-space: nowrap;
      }
      .ss-day.exam {
        border-color: color-mix(in srgb, var(--c) 50%, var(--ua-line));
        background: color-mix(in srgb, var(--c) 9%, var(--ua-bg));
      }
      .ss-day.exam .ss-dh {
        background: none;
      }
      /* consegna di un progetto: come l'esame, ma col bordo tratteggiato */
      .ss-day.due {
        border-style: dashed;
        background: color-mix(in srgb, var(--c) 5%, var(--ua-bg));
      }
      .ss-tag.ss-due {
        outline: 1px dashed var(--c);
        outline-offset: -1px;
      }
      .ss-day.done .ss-dh h3::after {
        content: " ✓";
        color: var(--ua-c-mp);
      }
      details.ss-past {
        margin-bottom: 14px;
      }
      details.ss-past summary {
        cursor: pointer;
        color: var(--ua-muted);
        font-size: 14.5px;
        margin-bottom: 10px;
      }
      .ss-empty {
        padding: 16px;
        border: 1px dashed var(--ua-line);
        border-radius: 14px;
        color: var(--ua-muted);
      }
      /* pulsanti del piano (Modifica, Stampa, Elimina): in cima, sotto il titolo; "Elimina" a destra, lontano dagli altri */
      .ss-tools {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 0 0 20px;
      }
      .ss-tools .danger {
        margin-left: auto;
      }
      @media (max-width: 560px) {
        fieldset {
          padding: 14px 14px 16px;
        }
        .ss-exam-top {
          grid-template-columns: minmax(0, 1fr) auto;
        }
        .ss-exam-top .ss-date {
          grid-column: 1;
          grid-row: 2;
        }
        .ss-dh {
          grid-template-columns: 44px minmax(0, 1fr) auto;
          padding: 10px 12px;
        }
        .ss-actions .ss-btn {
          flex: 1;
        }
        .ss-tools .ss-btn {
          min-height: 38px;
          padding: 7px 14px;
          font-size: 14.5px;
        }
        /* riepilogo degli esami su due colonne: con un riquadro per riga occuperebbe tutto lo schermo */
        .ss-exams {
          grid-template-columns: 1fr 1fr;
          gap: 8px;
        }
        .ss-ex {
          padding: 12px;
        }
        .ss-ex b {
          font-size: 14.5px;
        }
        .ss-cd {
          padding: 3px 7px;
          font-size: 11px;
        }
      }

      /* stampa: solo il calendario */
      @media print {
        .eyebrow,
        .lede,
        .ss-tools,
        .ss-info,
        details.ss-past {
          display: none !important;
        }
        .ss-day {
          break-inside: avoid;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="eyebrow"><a href="index.html">Appunti Unisa</a> · Sessione</div>
      <h1>Sessione</h1>
      <p class="lede">
        Scegli gli esami e le date degli appelli: il piano giorno per giorno lo preparo io, con i capitoli dei
        piani di studio. Se resti indietro, si sistema da solo.
      </p>
      <div id="ss-app"><p class="ss-wait">Carico la sessione…</p></div>
    </main>

    <script src="assets/sessione.js"></script>
    <script>
      /* Pagina della Sessione: modulo (esami, tempo, ripasso, promemoria) e calendario con le spunte.
         I dati e il piano li prepara assets/sessione.js; qui si disegna. Lo script comune (site.js) e corsi.js
         li aggiunge la pubblicazione in fondo alla pagina: per questo si parte a DOMContentLoaded. */
      document.addEventListener("DOMContentLoaded", () => {
        const S = window.SESSIONE;
        const ROOT = "./";
        const app = document.getElementById("ss-app");
        const esc = s =>
          String(s == null ? "" : s).replace(
            /[&<>"]/g,
            c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]
          );
        const courses = S.courses();
        const courseOf = code => courses.find(c => c.code === code);
        let editing = false;
        // esami che di solito hanno il progetto: la casella "C'è il progetto" parte già spuntata
        /* il progetto di IS (Resto 1) lo gestiscono i PM, con le loro scadenze: per IS la casella parte non spuntata
           (si può sempre spuntare a mano) */
        const PRJ_DEFAULT = ["BD", "PD"];
        /* esami in cui la traccia del progetto arriva pochi giorni prima dell'esame: giorni proposti e ore di
           esercizio pratico prima della traccia (PD: la traccia arriva circa 3-5 giorni prima) */
        const PRJ_LATE = { PD: { fromDays: 5, pra: 10 } };
        /* Promemoria, due modi a scelta, a ore intere dalle 7 alle 23:
           - "orari": da 1 a 4 al giorno, alle ore scelte (orari proposti quando cambi il numero);
           - "ogni": ogni 1, 2, 3 o 4 ore, dalle … alle ….
           In cfg.ore si salvano sempre le ore effettive: le legge il controllo su GitHub
           (.github/scripts/promemoria_sessione.mjs), che così non deve sapere quale modo è stato scelto. */
        const ORE = Array.from({ length: 17 }, (_, i) => i + 7);
        const ORE_DEFAULT = { 1: [10], 2: [10, 18], 3: [10, 15, 20], 4: [9, 13, 17, 21] };
        const oreOgni = (ogni, dalle, alle) => {
          const out = [];
          for (let h = dalle; h <= alle; h += ogni) out.push(h);
          return out;
        };
        // impostazioni dei promemoria di una sessione (anche di quelle salvate prima dei due modi)
        const notifOf = cfg => {
          const mode = cfg.notifMode === "ogni" ? "ogni" : "orari";
          const orari =
            cfg.orari && cfg.orari.length
              ? cfg.orari
              : mode === "orari" && cfg.ore && cfg.ore.length
                ? cfg.ore
                : ORE_DEFAULT[1];
          return {
            notify: !!cfg.notify,
            mode,
            orari,
            ogni: cfg.ogni || 2,
            dalle: cfg.dalle || 9,
            alle: cfg.alle || 21
          };
        };

        /* ---------- modulo ---------- */
        const YEARS = [
          ["1° anno", c => c.year === 1],
          ["2° anno", c => c.year === 2],
          ["3° anno", c => c.year === 3 && !c.opt],
          ["3° anno · a scelta", c => c.year === 3 && c.opt]
        ];
        const courseOptions = sel =>
          `<option value="">Scegli il corso…</option>` +
          YEARS.map(
            ([lbl, f]) =>
              `<optgroup label="${lbl}">${courses
                .filter(f)
                .map(
                  c => `<option value="${c.code}" ${c.code === sel ? "selected" : ""}>${esc(c.name)}</option>`
                )
                .join("")}</optgroup>`
          ).join("");
        const seg = (name, list, val) =>
          `<div class="ss-seg" role="radiogroup">${list
            .map(
              ([v, t]) =>
                `<label><input type="radio" name="${name}" value="${v}" ${String(v) === String(val) ? "checked" : ""}><span>${t}</span></label>`
            )
            .join("")}</div>`;
        let nExam = 0;
        function examRow(e = {}) {
          const k = nExam++;
          const c = courseOf(e.code);
          return `<div class="ss-exam" data-k="${k}" style="--c:${c ? c.color : "var(--ua-line)"}">
            <div class="ss-exam-top">
              <label class="ss-field"><span>Esame</span><select name="code">${courseOptions(e.code)}</select></label>
              <label class="ss-field ss-date"><span>Data dell'appello</span><input type="date" name="date" value="${esc(e.date || "")}" min="${S.today()}"></label>
              <button type="button" class="ss-x" aria-label="Togli questo esame">×</button>
            </div>
            <div class="ss-field"><span>Cosa vuoi esercitare</span>${seg("mode" + k, S.MODES, S.modeOf(e))}</div>
            <p class="ss-note ss-mode">Teoria: studio, domande aperte e quiz. Pratica: esercizi, con un ripasso breve del capitolo prima.</p>
            ${scopeField(c, e, k)}
            <div class="ss-field"><span>Quanto lo sai già</span>${seg(
              "lv" + k,
              S.LEVELS.map(l => [l.v, l.t]),
              e.lv || 0
            )}</div>
            <div class="ss-extra">${extraFields(c, e, k)}</div>
          </div>`;
        }
        // campi che dipendono dal corso: il livello per capitolo oppure ore e capitoli (corsi senza piano sul sito); poi il progetto
        function extraFields(c, e, k) {
          if (!c) return "";
          return courseFields(c, e, k) + projectFields(c, e);
        }
        function projectFields(c, e) {
          // l'esercizio pratico prima della traccia è proposto solo per gli esami di PRJ_LATE (oggi PD)
          const late = PRJ_LATE[c.code] || { fromDays: 0, pra: 0 };
          const p = e.prj || Object.assign({ on: PRJ_DEFAULT.includes(c.code) }, PRJ_LATE[c.code]);
          const from = p.fromDate ? "day" : p.fromDays || 0;
          const opts = [
            [0, "Ce l'ho già"],
            ["day", "In un giorno preciso"],
            [3, "3 giorni prima dell'esame"],
            [4, "4 giorni prima"],
            [5, "5 giorni prima"],
            [7, "7 giorni prima"],
            [10, "10 giorni prima"]
          ];
          return `<div class="ss-prj">
            <label class="ss-check"><input type="checkbox" name="prj" ${p.on ? "checked" : ""}><span><b>C'è il progetto</b><small>Ogni giorno un po' di progetto fino alla consegna, insieme allo studio</small></span></label>
            <div class="ss-prj-f" ${p.on ? "" : "hidden"}>
              <div class="ss-row">
                <!-- le ore del progetto non si chiedono più: 20 di base, le sessioni salvate tengono le loro -->
                <input type="hidden" name="prjHours" value="${esc(p.hours || 20)}">
                <label class="ss-field"><span>Consegna (se vuoto: il giorno dell'esame)</span><input type="date" name="prjDate" value="${esc(p.date || "")}" min="${S.today()}"></label>
              </div>
              <div class="ss-row" style="margin-top:12px">
                <label class="ss-field"><span>La traccia del progetto</span><select name="prjFrom">${opts
                  .map(([v, t]) => `<option value="${v}" ${v === from ? "selected" : ""}>${t}</option>`)
                  .join("")}</select></label>
                <label class="ss-field ss-fromdate" ${from === "day" ? "" : "hidden"}><span>Arriva il</span><input type="date" name="prjFromDate" value="${esc(p.fromDate || "")}" min="${S.today()}"></label>
                <label class="ss-field ss-pra" ${from ? "" : "hidden"}><span>Ore di esercizio pratico prima della traccia</span><input type="number" name="prjPra" min="0" max="100" step="1" value="${esc(p.pra != null ? p.pra : late.pra)}" style="width:120px"></label>
              </div>
              <p class="ss-note ss-pra" style="margin-top:8px" ${from ? "" : "hidden"}>I blocchi di progetto partono dal giorno della traccia. Se metti delle ore di esercizio pratico, prima di quel giorno il piano mette blocchi di esercizio sulla parte pratica.</p>
            </div>
          </div>`;
        }
        /* Livello per capitolo: chiuso di base; i capitoli si caricano dal programma d'esame quando si apre.
           Di base ogni capitolo ha il livello dell'esame; si salvano (e.lvs) solo quelli diversi. */
        function lvsBox(e) {
          const saved = e.lvs || {},
            n = Object.keys(saved).filter(id => saved[id] !== (e.lv || 0)).length;
          return `<details class="ss-lvs" data-lvs="${esc(JSON.stringify(saved))}">
            <summary><b>Livello per capitolo</b><span class="ss-lvs-n">${lvsCount(n)}</span></summary>
            <div class="ss-lvs-l"></div>
          </details>`;
        }
        const lvsCount = n =>
          n ? ` · ${n} ${n === 1 ? "capitolo diverso" : "capitoli diversi"}` : " · facoltativo";
        const examLv = row =>
          +(row.querySelector(`input[name="lv${row.dataset.k}"]:checked`) || { value: 0 }).value;
        function fillLvs(row) {
          const box = row.querySelector(".ss-lvs");
          if (!box || box.dataset.ok || box.dataset.wait) return;
          const c = courseOf(row.querySelector('[name="code"]').value),
            k = row.dataset.k,
            saved = JSON.parse(box.dataset.lvs || "{}"),
            base = examLv(row),
            list = box.querySelector(".ss-lvs-l");
          box.dataset.wait = "1";
          list.innerHTML = `<p class="ss-note">Carico i capitoli…</p>`;
          S.topicsOf(c, ROOT)
            .then(data => {
              list.innerHTML =
                data.topics
                  .filter(t => !t.intro)
                  .map(
                    t =>
                      `<div class="ss-lv-row" data-id="${esc(t.id)}" data-full="${t.full ? 1 : ""}" ${t.id in saved ? "data-set" : ""}>
                        <span>Cap. ${esc(t.ch)} · ${esc(t.t)}</span>${seg(
                          `lvc${k}-${t.id}`,
                          S.LEVELS.map(l => [l.v, l.t]),
                          t.id in saved ? saved[t.id] : base
                        )}</div>`
                  )
                  .join("") +
                `<p class="ss-note">Di base vale "Quanto lo sai già": cambia solo i capitoli che sai meglio o peggio.</p>`;
              box.dataset.ok = "1";
              showScope(row);
            })
            .catch(() => {
              list.innerHTML = `<p class="ss-note">Non riesco a caricare i capitoli: riprova tra poco.</p>`;
            })
            .then(() => delete box.dataset.wait);
        }
        // IS: nel riquadro solo i capitoli della prova scelta
        function showScope(row) {
          const sc = (row.querySelector(`input[name="scope${row.dataset.k}"]:checked`) || {}).value;
          row.querySelectorAll(".ss-lv-row").forEach(r => {
            r.hidden = (sc === "prima" && !!r.dataset.full) || (sc === "seconda" && !r.dataset.full);
          });
          countLvs(row);
        }
        function countLvs(row) {
          const base = examLv(row),
            n = [...row.querySelectorAll(".ss-lv-row:not([hidden]) input:checked")].filter(
              i => +i.value !== base
            ).length;
          const out = row.querySelector(".ss-lvs-n");
          if (out && row.querySelector(".ss-lvs").dataset.ok) out.textContent = lvsCount(n);
        }
        // IS: la prova, prima del livello (decide quali capitoli compaiono nel livello per capitolo)
        function scopeField(c, e, k) {
          if (!c || c.code !== "IS") return `<div class="ss-scope" hidden></div>`;
          return `<div class="ss-field ss-scope"><span>Prova</span>${seg(
            "scope" + k,
            [
              ["completa", "Prova completa"],
              ["prima", "Prima prova"],
              ["seconda", "Seconda prova"]
            ],
            e.scope || "completa"
          )}</div>`;
        }
        function courseFields(c, e, k) {
          if (c.piano)
            return `<p class="ss-note">Uso i capitoli del <a href="${ROOT}${c.piano.split("/").map(encodeURIComponent).join("/")}">${/^Programma/.test(c.pianoT) ? "programma d'esame" : "piano di studio"}</a> di ${esc(c.name)}.</p>${lvsBox(e)}`;
          return `<div class="ss-row">
              <label class="ss-field"><span>Ore di studio che ti servono (circa)</span><input type="number" name="hours" min="5" max="200" step="5" value="${esc(e.hours || 30)}" style="width:120px"></label>
            </div>
            <label class="ss-field"><span>Capitoli o argomenti, uno per riga (facoltativo: se li scrivi, li trovi nel piano da spuntare)</span><textarea name="chapters" placeholder="es. Limiti&#10;Derivate&#10;Integrali">${esc(e.chapters || "")}</textarea></label>`;
        }
        function notifBox(cfg) {
          const n = notifOf(cfg);
          const hourSel = (name, h, list, label) =>
            `<label class="ss-field"><span>${label}</span><select name="${name}">${list
              .map(x => `<option value="${x}" ${x === h ? "selected" : ""}>${x}:00</option>`)
              .join("")}</select></label>`;
          const orariSel = orari =>
            orari
              .map((h, i) => hourSel("ora", h, ORE, orari.length > 1 ? i + 1 + "° promemoria" : "Alle"))
              .join("");
          return `<div class="ss-notif">
            <label class="ss-check"><input type="checkbox" name="notify" ${n.notify ? "checked" : ""}><span><b>Promemoria</b><small>Il primo del giorno dice cosa studiare oggi; gli altri ricordano solo le attività di oggi non ancora fatte (se hai finito, non arrivano). Serve l'accesso con Google (dal Profilo) e le notifiche attive su questo dispositivo.</small></span></label>
            <div class="ss-notif-f" ${n.notify ? "" : "hidden"}>
              <div class="ss-field" style="margin-top:12px"><span>Come</span>${seg(
                "nMode",
                [
                  ["orari", "A orari precisi"],
                  ["ogni", "Ogni tot ore"]
                ],
                n.mode
              )}</div>
              <div class="ss-m-orari" ${n.mode === "orari" ? "" : "hidden"}>
                <div class="ss-field" style="margin-top:12px"><span>Quante volte al giorno</span>${seg(
                  "nOre",
                  [1, 2, 3, 4].map(x => [x, x === 1 ? "1 volta" : x + " volte"]),
                  n.orari.length
                )}</div>
                <div class="ss-row ss-ore" style="margin-top:12px">${orariSel(n.orari)}</div>
              </div>
              <div class="ss-m-ogni" ${n.mode === "ogni" ? "" : "hidden"}>
                <div class="ss-field" style="margin-top:12px"><span>Ogni</span>${seg(
                  "nOgni",
                  [1, 2, 3, 4].map(x => [x, x === 1 ? "1 ora" : x + " ore"]),
                  n.ogni
                )}</div>
                <div class="ss-row ss-ore" style="margin-top:12px">${hourSel("dalle", n.dalle, ORE.slice(0, -1), "Dalle")}${hourSel("alle", n.alle, ORE.slice(1), "Alle")}</div>
              </div>
              <p class="ss-note ss-when" style="margin-top:10px"></p>
              <p class="ss-note">Di solito arrivano entro un quarto d'ora dall'orario.</p>
            </div>
            <div data-ua-nt style="margin-top:12px"></div>
          </div>`;
        }
        // legge il riquadro dei promemoria (ore = le ore effettive, in tutti e due i modi)
        function readNotif(box) {
          const val = n =>
            (
              box.querySelector(`input[name="${n}"]:checked`) ||
              box.querySelector(`select[name="${n}"]`) ||
              {}
            ).value;
          const mode = val("nMode") === "ogni" ? "ogni" : "orari";
          const orari = [...new Set([...box.querySelectorAll('select[name="ora"]')].map(x => +x.value))].sort(
            (a, b) => a - b
          );
          const ogni = +val("nOgni") || 2,
            dalle = +val("dalle") || 9,
            alle = Math.max(+val("alle") || 21, dalle + 1);
          return {
            notify: box.querySelector('[name="notify"]').checked,
            notifMode: mode,
            orari,
            ogni,
            dalle,
            alle,
            ore: mode === "ogni" ? oreOgni(ogni, dalle, alle) : orari
          };
        }
        // riga riassuntiva: quando arriveranno e quanti al giorno
        function showWhen(box) {
          const ore = readNotif(box).ore.map(h => h + ":00");
          const list =
            ore.length > 4 ? `${ore.slice(0, 3).join(", ")} … ${ore[ore.length - 1]}` : ore.join(", ");
          box.querySelector(".ss-when").textContent =
            `Arrivano alle ${list} · ${ore.length === 1 ? "1 al giorno" : ore.length + " al giorno"}.`;
        }
        // onChange (facoltativo) viene chiamato a ogni modifica, con le impostazioni lette
        function bindNotif(box, onChange) {
          showWhen(box);
          box.addEventListener("change", e => {
            const name = e.target.name;
            if (name === "notify") box.querySelector(".ss-notif-f").hidden = !e.target.checked;
            if (name === "nMode") {
              box.querySelector(".ss-m-orari").hidden = e.target.value !== "orari";
              box.querySelector(".ss-m-ogni").hidden = e.target.value !== "ogni";
            }
            if (name === "nOre") {
              // nuovo numero di promemoria: orari proposti, tenendo quelli già scelti se possibile
              const k = +e.target.value,
                cur = readNotif(box).orari;
              const div = document.createElement("div");
              div.innerHTML = notifBox({
                notify: true,
                orari: cur.length >= k ? cur.slice(0, k) : ORE_DEFAULT[k]
              });
              box.querySelector(".ss-m-orari .ss-ore").replaceWith(div.querySelector(".ss-m-orari .ss-ore"));
            }
            if (name === "dalle" || name === "alle") {
              // "alle" deve venire dopo "dalle"
              const d = box.querySelector('select[name="dalle"]'),
                a = box.querySelector('select[name="alle"]');
              if (+a.value <= +d.value) a.value = String(Math.min(23, +d.value + 1));
            }
            showWhen(box);
            if (onChange) onChange(readNotif(box));
          });
        }
        // gli esami del modulo, con in più il corso "add" (se non c'è già) al posto della riga vuota
        function examsWith(exams, add) {
          const list = exams.filter(e => e.code);
          if (add && !list.some(e => e.code === add)) list.push({ code: add });
          return list.length ? list : [{}];
        }
        function form(st, add) {
          const cfg = (st && st.cfg) || {
            exams: [{}],
            start: S.today(),
            hours: 3,
            days: [1, 2, 3, 4, 5, 6],
            ded: 2,
            notify: false,
            notifMode: "orari",
            orari: ORE_DEFAULT[1],
            ore: ORE_DEFAULT[1]
          };
          nExam = 0;
          app.innerHTML = `<form id="ss-form" novalidate>
            <fieldset><legend>Gli esami della sessione</legend>
              <div id="ss-exams">${examsWith(cfg.exams, add).map(examRow).join("")}</div>
              <button type="button" class="ss-btn" id="ss-add">+ Aggiungi esame</button>
            </fieldset>
            <fieldset><legend>Quanto tempo hai</legend>
              <div class="ss-row">
                <label class="ss-field"><span>Comincio il</span><input type="date" name="start" value="${esc(cfg.start && cfg.start > S.today() ? cfg.start : S.today())}" min="${S.today()}"></label>
              </div>
              <div class="ss-row" style="margin-top:14px">
                <label class="ss-field" style="flex:1"><span>Ore al giorno</span><input type="range" name="hours" min="1" max="10" step="0.5" value="${cfg.hours}"></label>
                <output id="ss-hours"></output>
              </div>
              <p class="ss-note" style="margin:14px 0 8px">Giorni in cui puoi studiare</p>
              <div class="ss-days">${[1, 2, 3, 4, 5, 6, 0]
                .map(
                  d =>
                    `<label class="ss-chip"><input type="checkbox" name="wd" value="${d}" ${cfg.days.includes(d) ? "checked" : ""}><span>${S.WD_LONG[d]}</span></label>`
                )
                .join("")}</div>
            </fieldset>
            <fieldset><legend>Ripasso prima di ogni esame</legend>
              <div class="ss-field"><span>Giorni di solo ripasso e simulazione, subito prima dell'appello</span>${seg(
                "ded",
                [
                  [1, "1 giorno"],
                  [2, "2 giorni"],
                  [3, "3 giorni"]
                ],
                cfg.ded
              )}</div>
              <p class="ss-note" style="margin-top:10px">Negli altri giorni gli esami vanno in parallelo: quello più vicino prende più tempo.</p>
            </fieldset>
            <fieldset><legend>Promemoria</legend>${notifBox(cfg)}</fieldset>
            <div class="ss-actions">
              <button type="submit" class="ss-btn solid">${st ? "Aggiorna il piano" : "Genera il mio piano"}</button>
              ${st ? `<button type="button" class="ss-btn" id="ss-cancel">Annulla</button>` : ""}
              <span class="ss-msg" id="ss-msg" role="alert"></span>
            </div>
          </form>`;
          const f = app.querySelector("#ss-form");
          const hours = f.querySelector('input[name="hours"][type="range"]');
          const showHours = () => {
            const h = +hours.value;
            f.querySelector("#ss-hours").textContent =
              `${String(h).replace(".", ",")} ${h === 1 ? "ora" : "ore"}`;
          };
          hours.addEventListener("input", showHours);
          showHours();
          f.querySelector("#ss-add").addEventListener("click", () => {
            f.querySelector("#ss-exams").insertAdjacentHTML("beforeend", examRow({}));
          });
          f.addEventListener("click", e => {
            const x = e.target.closest(".ss-x");
            if (x) {
              const rows = f.querySelectorAll(".ss-exam");
              if (rows.length > 1) x.closest(".ss-exam").remove();
              else x.closest(".ss-exam").outerHTML = examRow({});
            }
          });
          f.addEventListener("change", e => {
            const row = e.target.closest(".ss-exam");
            if (e.target.name === "prj") row.querySelector(".ss-prj-f").hidden = !e.target.checked;
            if (e.target.name === "prjFrom") {
              const v = e.target.value;
              row.querySelectorAll(".ss-pra").forEach(x => (x.hidden = v === "0"));
              row.querySelector(".ss-fromdate").hidden = v !== "day";
            }
            if (row && e.target.name === "lv" + row.dataset.k) {
              // il livello dell'esame vale per i capitoli che non hai cambiato a mano
              row.querySelectorAll(".ss-lv-row:not([data-set])").forEach(r => {
                const i = r.querySelector(`input[value="${e.target.value}"]`);
                if (i) i.checked = true;
              });
              countLvs(row);
            }
            if (row && e.target.name.startsWith("lvc")) {
              e.target.closest(".ss-lv-row").dataset.set = "";
              countLvs(row);
            }
            if (row && e.target.name === "scope" + row.dataset.k) showScope(row);
            if (e.target.name !== "code") return;
            const c = courseOf(e.target.value);
            row.style.setProperty("--c", c ? c.color : "var(--ua-line)");
            row.querySelector(".ss-scope").outerHTML = scopeField(c, {}, row.dataset.k);
            row.querySelector(".ss-extra").innerHTML = extraFields(c, {}, row.dataset.k);
          });
          // "toggle" non risale: si ascolta in cattura
          f.addEventListener(
            "toggle",
            e => {
              if (e.target.classList && e.target.classList.contains("ss-lvs") && e.target.open)
                fillLvs(e.target.closest(".ss-exam"));
            },
            true
          );
          bindNotif(f.querySelector(".ss-notif"));
          const cancel = f.querySelector("#ss-cancel");
          if (cancel)
            cancel.addEventListener("click", () => {
              editing = false;
              render();
            });
          f.addEventListener("submit", e => {
            e.preventDefault();
            submit(f, st);
          });
          // l'interruttore delle notifiche lo disegna site.js (stesso del Profilo)
          document.dispatchEvent(new Event("ua-nt-refresh"));
        }
        function readForm(f) {
          const exams = [...f.querySelectorAll(".ss-exam")].map(row => {
            const k = row.dataset.k,
              val = n => (row.querySelector(`[name="${n}"]`) || {}).value;
            const lv = row.querySelector(`input[name="lv${k}"]:checked`);
            const scope = row.querySelector(`input[name="scope${k}"]:checked`);
            const mode = row.querySelector(`input[name="mode${k}"]:checked`);
            const e = { code: val("code"), date: val("date"), lv: lv ? +lv.value : 0 };
            // livello per capitolo: solo quelli diversi dal livello dell'esame
            const box = row.querySelector(".ss-lvs");
            if (box) {
              const lvs = {};
              if (box.dataset.ok)
                row.querySelectorAll(".ss-lv-row").forEach(r => {
                  const i = r.querySelector("input:checked");
                  if (i && +i.value !== e.lv) lvs[r.dataset.id] = +i.value;
                });
              else
                Object.entries(JSON.parse(box.dataset.lvs || "{}")).forEach(([id, v]) => {
                  if (v !== e.lv) lvs[id] = v;
                });
              if (Object.keys(lvs).length) e.lvs = lvs;
            }
            if (mode) e.mode = mode.value;
            if (scope) e.scope = scope.value;
            if (row.querySelector('[name="hours"]')) {
              e.hours = Math.max(5, +val("hours") || 30);
              e.chapters = val("chapters") || "";
            }
            const prj = row.querySelector('[name="prj"]');
            if (prj)
              e.prj = {
                on: prj.checked,
                hours: Math.max(2, +val("prjHours") || 20),
                date: val("prjDate") || "",
                fromDays: val("prjFrom") === "day" ? 0 : +val("prjFrom") || 0,
                fromDate: val("prjFrom") === "day" ? val("prjFromDate") || "" : "",
                pra: Math.max(0, +val("prjPra") || 0)
              };
            return e;
          });
          return {
            exams,
            start: f.querySelector('[name="start"]').value || S.today(),
            hours: +f.querySelector('input[name="hours"][type="range"]').value,
            days: [...f.querySelectorAll('input[name="wd"]:checked')].map(i => +i.value),
            ded: +(f.querySelector('input[name="ded"]:checked') || { value: 2 }).value,
            ...readNotif(f.querySelector(".ss-notif"))
          };
        }
        async function submit(f, st) {
          const msg = f.querySelector("#ss-msg"),
            btn = f.querySelector('button[type="submit"]');
          const cfg = readForm(f);
          cfg.isPrjPm = true; // la sessione è già fatta con la regola del progetto di IS (vedi render)
          const t = S.today();
          const err = cfg.exams.some(e => !e.code)
            ? "Scegli il corso di ogni esame (o togli le righe vuote)."
            : cfg.exams.some(e => !e.date)
              ? "Inserisci la data di ogni esame."
              : cfg.exams.some(e => e.date <= t)
                ? "Le date degli esami devono essere da domani in poi."
                : new Set(cfg.exams.map(e => e.code)).size < cfg.exams.length
                  ? "C'è lo stesso esame due volte."
                  : !cfg.days.length
                    ? "Scegli almeno un giorno in cui puoi studiare."
                    : cfg.exams.every(e => e.date <= cfg.start)
                      ? "La data di inizio deve venire prima degli esami."
                      : cfg.exams.some(e => e.prj && e.prj.on && e.prj.date && e.prj.date <= t)
                        ? "La consegna dei progetti deve essere da domani in poi."
                        : "";
          if (err) {
            msg.textContent = err;
            return;
          }
          msg.textContent = "";
          btn.disabled = true;
          btn.textContent = "Preparo il piano…";
          const next = Object.assign({ v: 1, done: {} }, st || {}, { cfg });
          try {
            await S.build(next, ROOT);
            S.save(next);
            editing = false;
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
          } catch (e2) {
            msg.textContent = (e2 && e2.message) || "Qualcosa è andato storto: riprova.";
            btn.disabled = false;
            btn.textContent = st ? "Aggiorna il piano" : "Genera il mio piano";
          }
        }

        /* ---------- calendario ---------- */
        const when = n => (n === 0 ? "oggi" : n === 1 ? "domani" : `tra ${n} giorni`);
        function taskRow(st, task) {
          const it = S.info(st, task),
            c = courseOf(it.c) || {};
          const inside = it.parts
            ? Object.keys(it.parts)
                .map(
                  k =>
                    ({
                      read: "lettura",
                      rev: "ripasso breve",
                      draw: "esercizio",
                      open: "domanda aperta",
                      quiz: "quiz"
                    })[k]
                )
                .join(" · ")
            : "";
          const links = [
            it.href ? `<a href="${esc(it.href)}">apri il capitolo</a>` : "",
            it.quiz ? `<a href="${esc(it.quiz)}">quiz</a>` : ""
          ]
            .filter(Boolean)
            .join(" · ");
          // sotto il titolo: cosa fare, cosa c'è dentro (se non è solo lettura) e i link
          const sub = [
            it.s ? esc(it.s) : "",
            inside && inside !== "lettura" ? "Dentro: " + inside : "",
            links
          ]
            .filter(Boolean)
            .join(" · ");
          return `<li class="ss-task${it.done ? " done" : ""}" style="--c:${c.color || "var(--ua-muted)"}"><label>
            <input type="checkbox" data-id="${esc(it.id)}" ${it.done ? "checked" : ""}>
            <span class="ss-tx"><b>${esc(it.t)}${it.part ? ` (parte ${it.part})` : ""}</b><small>${esc(c.code || "")} · ${sub}</small></span>
            <span class="ss-tm">${it.m ? S.fmtMin(it.m) : ""}</span></label></li>`;
        }
        // etichette "Consegna progetto" (segni a parte nel piano: vedi sessione.js) e "Arriva la traccia" per un giorno
        const dueTags = (st, date) =>
          st.plan.days
            .filter(x => x.due && x.date === date)
            .map(x => {
              const c = courseOf(x.due) || { code: x.due, color: "var(--ua-muted)" };
              return `<span class="ss-tag ss-due" style="--c:${c.color}">Consegna progetto ${esc(c.code)}</span>`;
            })
            .concat(
              st.cfg.exams
                .filter(e => S.prjFrom(e) === date)
                .map(e => {
                  const c = courseOf(e.code) || { code: e.code, color: "var(--ua-muted)" };
                  return `<span class="ss-tag ss-due" style="--c:${c.color}">Arriva la traccia ${esc(c.code)}${S.prjFromExact(e) ? "" : " (circa)"}</span>`;
                })
            )
            .join("");
        function dayCard(st, d) {
          const dt = S.parse(d.date),
            t = S.today();
          const head = `<div class="ss-dt">${S.WD[dt.getDay()]}<b>${dt.getDate()}</b>${S.MESI[dt.getMonth()]}</div>`;
          if (d.exam) {
            const c = courseOf(d.exam) || { name: d.exam, color: "var(--ua-muted)" };
            return `<section class="ss-day exam" style="--c:${c.color}"><div class="ss-dh">${head}
              <div><span class="ss-tag">Esame</span>${dueTags(st, d.date)}<h3>${esc(c.name)}</h3><span class="muted" style="font-size:14px">Colazione, niente argomenti nuovi. Leggi bene le domande prima di rispondere.</span></div><span></span></div></section>`;
          }
          if (d.due) {
            const c = courseOf(d.due) || { name: d.due, color: "var(--ua-muted)" };
            return `<section class="ss-day exam due" style="--c:${c.color}"><div class="ss-dh">${head}
              <div><span class="ss-tag">Consegna</span><h3>Progetto di ${esc(c.name)}</h3><span class="muted" style="font-size:14px">Ricontrolla che il progetto sia completo e consegnalo.</span></div><span></span></div></section>`;
          }
          const done = st.done || {};
          const codes = [...new Set(d.tasks.map(x => (st.plan.items[x.iid] || {}).c).filter(Boolean))];
          // in alto a destra il tempo che resta: scende a ogni spunta; a giorno finito "fatto ✓"
          const left = d.tasks.filter(x => !done[x.id]).reduce((a, x) => a + x.m, 0);
          const all = d.tasks.length && d.tasks.every(x => done[x.id] || !x.m);
          const dc = d.ded ? courseOf(d.ded) : null;
          const tags =
            (d.date === t ? `<span class="ss-tag">Oggi</span>` : "") +
            (dc ? `<span class="ss-tag" style="--c:${dc.color}">Solo ${esc(dc.code)}: ripasso</span>` : "") +
            dueTags(st, d.date);
          // con un solo esame il nome intero, con più esami le sigle (i nomi interi non starebbero su una riga)
          const title =
            codes.length === 1 ? (courseOf(codes[0]) || { name: codes[0] }).name : codes.join(" · ");
          return `<section class="ss-day${d.date === t ? " today" : ""}${all ? " done" : ""}" ${d.date === t ? 'id="oggi"' : ""}>
            <div class="ss-dh">${head}<div>${tags}<h3>${esc(title)}</h3></div><span class="ss-min">${all ? `fatto <b>✓</b>` : S.fmtMin(left)}</span></div>
            <ul>${d.tasks.map(x => taskRow(st, x)).join("")}</ul></section>`;
        }
        function examCards(st) {
          const sm = S.summary(st);
          const done = st.done || {};
          return `<div class="ss-exams">${st.cfg.exams
            .slice()
            .sort((a, b) => (a.date < b.date ? -1 : 1))
            .map(e => {
              const c = courseOf(e.code) || { name: e.code, color: "var(--ua-muted)" };
              // avanzamento: studio e progetto separati
              const pcs = k =>
                st.plan.days
                  .flatMap(d => d.tasks)
                  .filter(x => {
                    const it = st.plan.items[x.iid] || {};
                    // nella barra del progetto anche l'esercizio pratico prima della traccia
                    const isPrj = it.k === "prj" || it.k === "pra";
                    return it.c === e.code && x.m && (k === "prj" ? isPrj : !isPrj);
                  });
              const pct = list => {
                const tot = list.reduce((a, x) => a + x.m, 0);
                return tot ? (100 * list.filter(x => done[x.id]).reduce((a, x) => a + x.m, 0)) / tot : 0;
              };
              const study = pct(pcs("top")),
                prj = e.prj && e.prj.on ? pcs("prj") : [];
              const n = S.daysBetween(S.today(), e.date);
              const scope =
                ({ prima: " · prima prova", seconda: " · seconda prova" }[e.scope] || "") +
                ({ teoria: " · solo teoria", pratica: " · solo pratica" }[S.modeOf(e)] || "");
              return `<div class="ss-ex" style="--c:${c.color}">
                <div class="ss-ex-top"><span class="ss-code">${esc(e.code)}</span><span class="ss-cd">${n < 0 ? "fatto" : when(n)}</span></div>
                <b>${esc(c.name)}</b><span class="muted" style="font-size:13.5px">${S.fmtDay(e.date)}${scope}</span>
                <div class="ss-bar" title="Studio: ${Math.round(study)}% fatto"><i style="width:${study}%"></i></div>
                ${
                  prj.length
                    ? `<span class="ss-prj-l">Progetto · ${S.prjFrom(e) ? `traccia ${S.prjFromExact(e) ? "" : "~"}${S.fmtDay(S.prjFrom(e))}, ` : ""}consegna ${S.fmtDay(S.prjDate(e))}</span><div class="ss-bar prj" title="Progetto: ${Math.round(pct(prj))}% fatto"><i style="width:${pct(prj)}%"></i></div>`
                    : ""
                }
              </div>`;
            })
            .join(
              ""
            )}</div>${sm ? `<p class="ss-note" style="margin-top:10px">Avanzamento della sessione: <b>${sm.pct}%</b></p>` : ""}`;
        }
        // consiglio in cima: i capitoli introduttivi dei corsi della sessione, con il link al quaderno
        function introTip(st) {
          const list = Object.entries(st.plan.intro || {}).flatMap(([code, tips]) =>
            tips.map(x =>
              x.href
                ? `<a href="${esc(x.href)}">${esc(code)} ${esc(x.ch)} ${esc(x.t)}</a>`
                : `${esc(code)} ${esc(x.ch)} ${esc(x.t)}`
            )
          );
          return list.length
            ? `<p class="ss-tip"><b>Facoltativo, se ti serve.</b> I capitoli introduttivi non entrano nel piano: ${list.join(" · ")}</p>`
            : "";
        }
        /* avvisi del piano: un solo messaggio generico (senza numeri e senza "aumenta le ore"), anche per i piani
           salvati prima con gli avvisi dettagliati; resta a parte solo "Non c'è nessun esame da oggi in poi" */
        const NO_EXAMS = "Non c'è nessun esame da oggi in poi.";
        function planNote(p) {
          const all = [...(p.warnings || []), ...(p.notes || [])];
          if (all.includes(NO_EXAMS)) return `<p class="ss-info">${NO_EXAMS}</p>`;
          return all.length
            ? `<p class="ss-info">Il piano si adatta ai giorni che ci sono: alcune attività possono essere più brevi o concentrate negli ultimi giorni.</p>`
            : "";
        }
        /* resoconto dell'ultimo ricalcolo automatico (S.report): una riga, poi i dettagli da aprire (cosa è stato
           spostato e dove, cosa è più breve, cosa è finito negli ultimi giorni, i giorni di solo ripasso).
           Resta finché non si chiude con la ✕; tono neutro, niente rosso e niente "aumenta le ore". */
        function replanBox(st) {
          const r = S.report(st);
          if (!r) return "";
          const row = x => {
            const c = courseOf(x.c) || { code: x.c, color: "var(--ua-muted)" };
            return `<li><span class="ss-rp-c" style="--c:${c.color}">${esc(x.c)}</span><div>${x.t ? `<span>${esc(x.t)}</span> ` : ""}${x.x ? `<em>${esc(x.x)}</em>` : ""}${x.d ? `<small>${esc(x.d)}</small>` : ""}</div></li>`;
          };
          const groups = r.groups
            .map(g => `<div class="ss-rp-g"><h4>${esc(g.h)}</h4><ul>${g.rows.map(row).join("")}</ul></div>`)
            .join("");
          return `<div class="ss-info ss-rp" role="status">
              <div class="ss-rp-top">
                <p>${esc(r.sum)}</p>
                <button type="button" class="ss-rp-x" id="ss-rp-x" aria-label="Chiudi il resoconto">✕</button>
              </div>
              ${groups ? `<details class="ss-rp-more"><summary>Mostra dettagli</summary>${groups}</details>` : ""}
            </div>`;
        }
        function plan(st) {
          const t = S.today();
          const days = st.plan.days;
          const past = days.filter(d => d.date < t && !d.exam && !d.due);
          const todayDays = days.filter(d => d.date === t);
          const future = days.filter(d => d.date > t);
          // con il resoconto aperto il messaggio generico non serve (un solo riquadro azzurro alla volta)
          const notice = replanBox(st);
          // pulsanti in cima, così non serve scorrere tutto il calendario per trovarli
          app.innerHTML = `<div class="ss-tools">
              <button type="button" class="ss-btn solid" id="ss-edit" aria-label="Modifica la sessione">Modifica</button>
              <button type="button" class="ss-btn" id="ss-print" aria-label="Stampa il piano">Stampa</button>
              <button type="button" class="ss-btn danger" id="ss-del" aria-label="Elimina la sessione">Elimina</button>
            </div>
            ${introTip(st)}
            ${notice || planNote(st.plan)}
            ${examCards(st)}
            <h2>Oggi</h2>
            ${todayDays.length ? todayDays.map(d => dayCard(st, d)).join("") : `<p class="ss-empty">Oggi niente in programma: goditi il giorno libero.</p>`}
            <h2>Prossimi giorni</h2>
            ${future.length ? future.map(d => dayCard(st, d)).join("") : `<p class="ss-empty">Non c'è altro in programma.</p>`}
            ${past.length ? `<details class="ss-past"><summary>Giorni passati (${past.length})</summary>${past.map(d => dayCard(st, d)).join("")}</details>` : ""}
            <h2>Promemoria</h2>
            ${notifBox(st.cfg)}`;
          app.querySelectorAll('.ss-task input[type="checkbox"]').forEach(cb =>
            cb.addEventListener("change", () => {
              const cur = S.load() || st;
              S.toggle(cur, cb.dataset.id, cb.checked);
              S.save(cur);
              const y = window.scrollY;
              render();
              window.scrollTo(0, y);
            })
          );
          app
            .querySelectorAll(".ss-tx a")
            .forEach(a => a.addEventListener("click", e => e.stopPropagation()));
          // promemoria: si salvano subito, senza rifare il piano
          bindNotif(app.querySelector(".ss-notif"), v => {
            const cur = S.load() || st;
            Object.assign(cur.cfg, v);
            S.save(cur);
          });
          app.querySelector("#ss-edit").addEventListener("click", () => {
            editing = true;
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
          });
          app.querySelector("#ss-print").addEventListener("click", () => window.print());
          const rpX = app.querySelector("#ss-rp-x");
          if (rpX)
            rpX.addEventListener("click", () => {
              const cur = S.load() || st;
              S.closeReport(cur);
              S.save(cur);
              const y = window.scrollY;
              render();
              window.scrollTo(0, y);
            });
          app.querySelector("#ss-del").addEventListener("click", () => {
            if (!confirm("Eliminare la sessione? Il piano e le spunte della sessione verranno cancellati."))
              return;
            S.clear();
            render();
          });
          document.dispatchEvent(new Event("ua-nt-refresh"));
        }

        // arrivando da "Prepara questo esame" (programma d'esame, ?esame=BD): il corso è già scelto nel modulo
        let ask = new URLSearchParams(location.search).get("esame");
        if (ask) history.replaceState(null, "", location.pathname + location.hash);
        function render() {
          const st = S.load();
          if (ask && courseOf(ask)) {
            const code = ask;
            ask = null;
            if (!st || !st.plan || !st.cfg.exams.some(e => e.code === code)) {
              if (st && st.plan) editing = true;
              return form(st, code);
            }
          }
          if (!st || !st.plan || editing) return form(st);
          /* sessioni salvate quando il progetto di IS era spuntato di base: se è rimasto com'era (20 ore, nessuna data),
             si toglie una volta sola. Chi lo rispunta dopo lo tiene. */
          let offIS = [];
          if (!st.cfg.isPrjPm) {
            st.cfg.isPrjPm = true;
            const untouched = p =>
              p && p.on && (p.hours || 20) === 20 && !p.date && !p.fromDays && !p.fromDate;
            offIS = st.cfg.exams.filter(e => e.code === "IS" && untouched(e.prj));
            offIS.forEach(e => (e.prj.on = false));
            if (!offIS.length) S.save(st);
          }
          /* il piano si rifà da solo, tenendo le spunte, quando serve: sessioni salvate prima della regola dei capitoli
             introduttivi (senza plan.intro) o con capitoli introduttivi più vecchi (plan.introV < S.INTRO_V, es. BD 02),
             prima della simulazione presa dal piano di studio (senza plan.sim) o con il progetto di IS appena tolto */
          const oldIntro = (st.plan.introV || 1) < S.INTRO_V;
          if (!st.plan.intro || oldIntro || !st.plan.sim || offIS.length) {
            app.innerHTML = `<p class="ss-wait">Aggiorno il piano…</p>`;
            S.build(st, ROOT)
              .then(() => S.save(st))
              .catch(() => {
                // senza rete: riprova la prossima volta
                offIS.forEach(e => (e.prj.on = true));
                if (offIS.length) delete st.cfg.isPrjPm;
                st.plan.intro = st.plan.intro || {};
              })
              .then(() => plan(st));
            return;
          }
          // attività rimaste indietro: si spostano da sole da oggi in poi
          if (S.replanOffline(st)) S.save(st);
          plan(st);
        }
        render();
        // arrivando da "Apri il piano" (#oggi) si va subito al giorno di oggi
        if (location.hash === "#oggi") {
          const el = document.getElementById("oggi");
          if (el) el.scrollIntoView({ block: "start" });
        }
      });
    </script>
  </body>
</html>
