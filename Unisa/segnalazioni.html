<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Segnalazioni · Appunti Unisa</title><script>try{var t=localStorage.getItem('ua-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script><link rel="stylesheet" href="assets/site.css"><link rel="stylesheet" href="assets/segnalazioni.css"></head><body><main><a href="index.html">← Appunti Unisa</a><h1>Segnalazioni</h1><p>Segnala un problema e controlla qui lo stato della tua richiesta. Per inviare e vedere le segnalazioni accedi con Google.</p><div class="account"><button id="login" type="button">Accedi con Google</button><button id="logout" type="button" hidden>Esci</button><span id="identity"></span></div><div class="grid"><section><h2>Nuova segnalazione</h2><form id="form"><label>Titolo<input name="title" maxlength="120" required></label><label>Testo<textarea name="text" rows="9" maxlength="1500" required></textarea></label><small id="counter">0 / 1500</small><label>Contatto per la risposta (facoltativo)<input name="contact" maxlength="120" placeholder="Email o altro contatto"></label><button id="send" disabled>Invia segnalazione</button><p id="message" role="status"></p></form></section><section><h2 id="list-title">Le tue segnalazioni</h2><p id="list-message" role="status">Accedi per vedere le segnalazioni.</p><div id="list"></div></section></div></main><script type="module" src="assets/segnalazioni.js"></script></body></html>
