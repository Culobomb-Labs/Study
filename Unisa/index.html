<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Appunti Unisa</title>
<meta name="description" content="Gli appunti dei corsi di Informatica all'Università di Salerno, da leggere ovunque.">
<meta name="theme-color" content="#111418">
<link rel="icon" href="icon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="favicon-32.png?v=2" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Appunti Unisa">
<meta property="og:title" content="Appunti Unisa">
<meta property="og:description" content="Gli appunti dei corsi di Informatica all'Università di Salerno, da leggere ovunque.">
<meta property="og:url" content="https://culobomb-labs.github.io/Study/">
<meta property="og:image" content="https://culobomb-labs.github.io/Study/og.png?v=3">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<script>try{var t=localStorage.getItem("ua-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/site.css">
<style>
/* Layout: catalogo sobrio, un registro di corsi a righe. Il colore lo portano solo i corsi (lo stesso accento dei rispettivi quaderni). */
:root{
  --bg:#f6f6f4; --surface:#ffffff; --ink:#111418; --muted:#5d636b; --line:#dcdddb; --hover:#efefec; --glow:rgba(17,20,24,.05); --ok:#2b7a4b; --ok-bg:#e4f2e9; --wip:#9a5b0c; --wip-bg:#fbefdc;
  --f-display:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1012; --surface:#15181b; --ink:#eceef0; --muted:#9aa1a9; --line:#272b30; --hover:#1c2024; --glow:rgba(255,255,255,.045); --ok:#6fd398; --ok-bg:#16291f; --wip:#f0b45e; --wip-bg:#2e2313; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1012; --surface:#15181b; --ink:#eceef0; --muted:#9aa1a9; --line:#272b30; --hover:#1c2024; --glow:rgba(255,255,255,.045); --ok:#6fd398; --ok-bg:#16291f; --wip:#f0b45e; --wip-bg:#2e2313; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;transition:background-color .25s,color .25s}
a{color:inherit}
.wrap{max-width:980px;margin:0 auto;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* testata */
.hero .wrap{padding-block:56px 36px;display:grid;grid-template-columns:1fr auto;gap:20px 40px;align-items:end}
.eyebrow{grid-column:1 / -1;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);letter-spacing:.02em}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(44px,9vw,84px);line-height:.95;letter-spacing:-.025em;margin:0}
.lede{grid-column:1;margin:0;max-width:52ch;color:var(--muted);font-size:17px}
.stats{grid-column:2;grid-row:2 / span 2;display:flex;gap:28px;font-variant-numeric:tabular-nums}
.stat b{display:block;font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1}
.stat span{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* registro corsi */
.list{border-top:2px solid var(--ink);margin-bottom:56px}
.course{display:grid;grid-template-columns:72px minmax(0,1fr) minmax(0,1.35fr);gap:20px 28px;padding:26px 0;border-bottom:1px solid var(--line);scroll-margin-top:16px}
.course:target h2{text-decoration:underline;text-decoration-color:var(--c);text-decoration-thickness:3px;text-underline-offset:6px}
.code{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--c);letter-spacing:.02em;padding-top:2px}
.code::before{content:"";display:block;width:28px;height:4px;background:var(--c);margin-bottom:10px;border-radius:2px;transition:width .35s var(--ua-ease)}
.course:hover .code::before{width:44px}
.course h2{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.15;margin:0 0 6px;text-wrap:balance;letter-spacing:-.01em}
.meta{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.docs{position:relative;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.docs::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;
  background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),var(--glow),transparent 70%)}
.docs:hover::before{opacity:1}
.docs li{position:relative}
.docs li+li{border-top:1px solid var(--line)}
.docs a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;align-items:center;padding:13px 16px;text-decoration:none}
.docs a:focus-visible{outline:none;box-shadow:inset 3px 0 0 var(--c);background:var(--hover)}
.dname{font-weight:600;min-width:0}
.dinfo{grid-column:1;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.arrow{grid-row:1 / span 2;grid-column:2;color:var(--muted);transition:transform .2s var(--ua-ease),color .2s}
.docs a:hover .arrow{transform:translateX(4px);color:var(--c)}

/* stato degli appunti */
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.resto{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;border:1px solid var(--line);
  font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--ink)}
.state{display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 8px;border-radius:999px;
  font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--s);background:var(--s-bg)}
.state::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.state.ok{--s:var(--ok);--s-bg:var(--ok-bg)}
.state.wip{--s:var(--wip);--s-bg:var(--wip-bg)}
.state.wip::before{animation:pulse 2.2s ease-in-out infinite}
.state.soon{--s:var(--muted);--s-bg:var(--hover)}
.docs-empty{border:1px dashed var(--line);border-radius:8px;padding:16px 18px;color:var(--muted);font-size:15px;line-height:1.5}
.docs-empty b{color:var(--ink);font-weight:600}
@keyframes pulse{50%{opacity:.35}}

/* in arrivo */
.soon .code{color:var(--muted)}
.soon .code::before{background:var(--muted)}
.soon-box{border:1px dashed var(--line);border-radius:8px;padding:16px 18px;color:var(--muted);font-size:15px;line-height:1.5}
.soon-box b{color:var(--ink);font-weight:600}
.soon-box p{margin:0}
.soon-box p+p{margin-top:8px;font-family:var(--f-mono);font-size:12px}

/* riprendi da dove eri */
.resume-wrap{padding-block:0 22px}
.resume{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 14px;align-items:center;padding:14px 18px;border:1px solid var(--line);
  border-radius:10px;background:var(--surface);text-decoration:none;transition:border-color .2s,transform .2s var(--ua-ease)}
.resume:hover{border-color:var(--c)}
.resume:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.resume-dot{grid-row:1 / span 2;width:10px;height:10px;border-radius:50%;background:var(--c)}
.resume-k,.resume-t{grid-column:2}
.resume-k{font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.resume-t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resume-t small{font-weight:400;color:var(--muted);margin-left:6px}
.resume .arrow{grid-row:1 / span 2;grid-column:3}
.resume:hover .arrow{transform:translateX(4px);color:var(--c)}

/* avanzamento */
.prog{grid-column:1;display:block;height:3px;margin-top:8px;border-radius:2px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--c);border-radius:2px;transition:width .6s var(--ua-ease)}

footer{border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;padding-block:22px 40px;font-size:14px;color:var(--muted)}
footer a{text-underline-offset:3px}
.build-meta{display:flex;flex-direction:column;gap:2px}

@media (max-width:720px){
  .hero .wrap{grid-template-columns:1fr;padding-block:36px 26px}
  .stats{grid-column:1;grid-row:auto}
  .course{grid-template-columns:1fr;gap:12px}
  .code{display:flex;align-items:center;gap:10px;font-size:15px}
  .code::before{margin:0;width:18px}
  .course:hover .code::before{width:18px}
}
@media (prefers-reduced-motion:reduce){body,.arrow,.code::before,.docs::before{transition:none}.state.wip::before{animation:none}}
</style>
</head>
<body>
  <div id="ua-bar" class="ua-bar"></div>

  <header class="hero"><div class="wrap">
    <div class="eyebrow" data-ua-rise>Università degli Studi di Salerno · Informatica</div>
    <h1 data-ua-rise>Appunti<br>Unisa</h1>
    <p class="lede" data-ua-rise>Quaderni di studio e piani per la preparazione degli esami. Scegli il corso e apri il materiale: si legge dal browser, anche da telefono.</p>
    <div class="stats" aria-label="Riepilogo" data-ua-rise>
      <div class="stat"><b id="n-courses">0</b><span>corsi</span></div>
      <div class="stat"><b id="n-docs">0</b><span>documenti</span></div>
    </div>
  </div></header>


  <div class="wrap resume-wrap" id="resume-wrap" hidden>
    <a class="resume" id="resume" href="#">
      <span class="resume-dot" aria-hidden="true"></span>
      <span class="resume-k">Riprendi da dove eri</span>
      <span class="resume-t" id="resume-t"></span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>
  </div>

  <main class="wrap">
    <div class="list" id="list"></div>
  </main>

  <footer><div class="wrap">
    <span><a href="https://drive.google.com/drive/folders/11VGt2yU2TcJ0YTDlRR3sFl-5oCN9-s5x">Appunti Unisa - Google Drive</a></span>
    <div class="build-meta"><span id="built"></span><span id="version"></span></div>
  </div></footer>

<script src="assets/corsi.js"></script>
<script>
const COURSES = window.CORSI || [];
const fmt = iso => new Intl.DateTimeFormat("it-IT", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Rome" }).format(new Date(iso));
const list = document.getElementById("list");
let updates = {};

function render() {
  list.textContent = "";
  for (const c of COURSES) {
    const row = document.createElement("section");
    row.className = "course"; row.id = c.code.toLowerCase();
    row.style.setProperty("--c", `var(--ua-c-${c.color})`);
    row.setAttribute("data-ua-rise", "");
    const code = document.createElement("div"); code.className = "code"; code.textContent = c.code;
    const info = document.createElement("div");
    const h2 = document.createElement("h2"); h2.textContent = c.name;
    const meta = document.createElement("div"); meta.className = "meta";
    meta.textContent = c.docs.length ? `${c.meta} · ${c.docs.length} ${c.docs.length === 1 ? "documento" : "documenti"}` : `${c.meta} · appunti in arrivo`;
    info.append(h2, meta);
    const tags = document.createElement("div"); tags.className = "tags";
    if (c.resto) {
      const r = document.createElement("div"); r.className = "resto";
      r.textContent = `Resto ${c.resto}`;
      r.title = `Appunti del canale Resto ${c.resto}: per l'altro canale programma e docente possono essere diversi`;
      tags.append(r);
    }
    if (c.stato) {
      const st = document.createElement("div");
      const ok = c.stato === "aggiornato", soon = c.stato === "in-arrivo";
      st.className = "state " + (ok ? "ok" : soon ? "soon" : "wip");
      st.textContent = ok ? "Appunti aggiornati" : soon ? "In arrivo" : "In aggiornamento";
      st.title = ok ? "Gli appunti coprono tutte le lezioni fatte finora" : soon ? "Il corso è nel sito, gli appunti arrivano a breve" : "Gli appunti vengono completati man mano che il corso va avanti";
      tags.append(st);
    }
    if (tags.children.length) info.append(tags);
    const ul = document.createElement("ul"); ul.className = "docs";
    for (const d of c.docs) {
      const li = document.createElement("li"); const a = document.createElement("a");
      a.href = d.path.split("/").map(encodeURIComponent).join("/");
      const n = document.createElement("span"); n.className = "dname"; n.textContent = d.name;
      const i = document.createElement("span"); i.className = "dinfo"; i.dataset.path = d.path; i.dataset.kind = d.kind;
      if (d.progressKey) i.dataset.key = d.progressKey;
      const ar = document.createElement("span"); ar.className = "arrow"; ar.setAttribute("aria-hidden", "true"); ar.textContent = "→";
      a.append(n, i, ar);
      if (d.progressKey) { const pr = document.createElement("span"); pr.className = "prog"; pr.setAttribute("aria-hidden", "true"); pr.append(document.createElement("i")); a.append(pr); }
      li.append(a); ul.append(li);
    }
    if (!c.docs.length) {
      const empty = document.createElement("div"); empty.className = "docs-empty";
      empty.innerHTML = `<b>Appunti in arrivo.</b> I quaderni di ${c.name.replace(/[<&>]/g, "")} verranno caricati a breve.`;
      row.append(code, info, empty); list.append(row); continue;
    }
    row.append(code, info, ul); list.append(row);
  }
  const soon = document.createElement("section");
  soon.className = "course soon"; soon.id = "in-arrivo"; soon.setAttribute("data-ua-rise", "");
  soon.innerHTML = `<div class="code" aria-hidden="true">+</div>
    <div><h2>In arrivo</h2><div class="meta">Altri corsi e quaderni</div></div>
    <div class="soon-box"><p><b>Altri appunti in arrivo.</b> Nuovi corsi e quaderni verranno aggiunti durante il semestre, e quelli in aggiornamento si completano man mano.</p>
    <p>Il sito si aggiorna da solo: torna a dare un'occhiata.</p></div>`;
  list.append(soon);
}
render();
const nDocs = COURSES.reduce((n, c) => n + c.docs.length, 0);
document.getElementById("n-courses").textContent = COURSES.length;
document.getElementById("n-docs").textContent = nDocs;
document.getElementById("n-courses").dataset.uaCount = COURSES.length;
document.getElementById("n-docs").dataset.uaCount = nDocs;

/* Avanzamento: legge le spunte salvate nel browser dalle pagine (capitoli fatti, attività del piano) */
function progressOf(key, meta) {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(key)) || {}; } catch (e) {}
  if (meta && meta.ids) return { done: meta.ids.filter(id => saved[id] === true).length, total: meta.ids.length, what: "capitoli fatti" };
  if (meta && meta.total) return { done: Math.min(meta.total, Object.values(saved).filter(v => v === true).length), total: meta.total, what: "attività fatte" };
  return null;
}
function paintInfo(data) {
  const files = (data && data.files) || {}, prog = (data && data.progress) || {};
  document.querySelectorAll(".dinfo").forEach(i => {
    const parts = [i.dataset.kind];
    const p = i.dataset.key ? progressOf(i.dataset.key, prog[i.dataset.path]) : null;
    if (p) parts.push(`${p.done}/${p.total} ${p.what}`);
    if (files[i.dataset.path]) parts.push("aggiornato il " + fmt(files[i.dataset.path]));
    i.textContent = parts.join(" · ");
    const bar = i.parentElement.querySelector(".prog i");
    if (bar) bar.style.width = p && p.total ? (100 * p.done / p.total) + "%" : "0%";
  });
}
paintInfo(null);

/* updates.json viene generato dal deploy: date di aggiornamento e capitoli di ogni quaderno */
fetch("updates.json").then(r => r.ok ? r.json() : null).then(data => {
  if (!data) return;
  paintInfo(data);
  if (data.built) {
    const built = new Date(data.built);
    const time = new Intl.DateTimeFormat("it-IT", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Rome" }).format(built);
    const date = new Intl.DateTimeFormat("it-IT", { day: "numeric", month: "short", year: "numeric", timeZone: "Europe/Rome" }).format(built);
    document.getElementById("built").textContent = `${date}, ${time}`;
  }
  if (data.version) document.getElementById("version").textContent = "ver. " + data.version;
}).catch(() => {});

/* Riprendi da dove eri */
(function () {
  let last = null;
  try { last = JSON.parse(localStorage.getItem("ua-last")); } catch (e) {}
  if (!last || !last.p) return;
  let found = null;
  for (const c of COURSES) for (const d of c.docs) if (d.path === last.p) found = { c, d };
  if (!found) return;
  const box = document.getElementById("resume");
  box.href = last.p.split("/").map(encodeURIComponent).join("/") + (last.i ? "#" + last.i : "");
  box.style.setProperty("--c", `var(--ua-c-${found.c.color})`);
  const t = document.getElementById("resume-t");
  t.textContent = found.d.name;
  if (last.t) { const s = document.createElement("small"); s.textContent = (last.n ? last.n + " · " : "") + last.t; t.append(s); }
  const mins = Math.round((Date.now() - (last.at || Date.now())) / 60000);
  const rtf = new Intl.RelativeTimeFormat("it", { numeric: "auto" });
  const when = mins < 60 ? rtf.format(-mins, "minute") : mins < 1440 ? rtf.format(-Math.round(mins / 60), "hour") : rtf.format(-Math.round(mins / 1440), "day");
  box.querySelector(".resume-k").textContent = "Riprendi da dove eri · " + when;
  document.getElementById("resume-wrap").hidden = false;
})();
window.addEventListener("pageshow", e => { if (e.persisted) location.reload(); });

</script>
<script src="assets/site.js" data-root="./" data-page="index.html"></script>
</body>
</html>
