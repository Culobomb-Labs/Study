<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Appunti Unisa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Indice degli appunti: una scheda per corso, link ai materiali dentro ogni scheda */
:root{
  --bg:#f3f5f9; --surface:#fff; --fg:#17202e; --muted:#5c6880; --line:#d9dfea;
  --accent:#2453c9; --accent-soft:#e3eafb;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1420; --surface:#171e2d; --fg:#e6eaf3; --muted:#97a3bb; --line:#2a3447;
  --accent:#7ea2ff; --accent-soft:#1f2b48; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:32px 32px;background-attachment:fixed}
.wrap{max-width:860px;margin:0 auto;padding-block:40px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:24px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(32px,7vw,48px);line-height:1.05;margin:6px 0 8px;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.course{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.course h2{font-family:var(--f-display);font-weight:600;font-size:21px;margin:0;line-height:1.2}
.tag{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.links{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.links a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;
  border:1px solid var(--line);color:var(--fg);text-decoration:none;font-weight:600}
.links a:hover,.links a:focus-visible{border-color:var(--accent);background:var(--accent-soft);outline:none}
.kind{font-family:var(--f-mono);font-size:11px;font-weight:500;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
footer{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">Università di Salerno · Informatica</span>
    <h1>Appunti Unisa</h1>
    <p class="sub">Quaderni e piani di studio dei corsi. Scegli il corso e apri il materiale che ti serve.</p>
  </header>

  <main class="grid" id="courses"></main>

  <footer>Per aggiungere un corso: crea la sua cartella dentro <code>Unisa/</code> e aggiungi una voce nella lista <code>COURSES</code> in fondo a questo file.</footer>
</div>

<script>
// Percorsi relativi alla cartella Unisa. Gli spazi vanno bene, vengono codificati in automatico.
const COURSES = [
  { name: "Ingegneria del Software", tag: "3° anno", items: [
    { label: "Quaderno di Ingegneria del Software", kind: "quaderno", path: "Ingenieria del Software/Quaderno di Ingegneria del Software.html" },
    { label: "Piano di studio, prima prova", kind: "piano", path: "Ingenieria del Software/Piano Studio IS.html" }
  ]},
  { name: "Mobile Programming", tag: "Android", items: [
    { label: "Quaderno di Android", kind: "quaderno", path: "Mobile Programming/Quaderno di Android.html" }
  ]},
  { name: "Programmazione Distribuita", tag: "sistemi distribuiti", items: [
    { label: "Quaderno di Programmazione Distribuita", kind: "quaderno", path: "Programmazione-Distribuita/Quaderno di Programmazione Distribuita/index.html" }
  ]}
];

const box = document.getElementById("courses");
for (const c of COURSES) {
  const sec = document.createElement("section");
  sec.className = "course";
  const head = document.createElement("div");
  const h2 = document.createElement("h2"); h2.textContent = c.name;
  const tag = document.createElement("div"); tag.className = "tag"; tag.textContent = c.tag || "";
  head.append(h2, tag);
  const ul = document.createElement("ul"); ul.className = "links";
  for (const it of c.items) {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = it.path.split("/").map(encodeURIComponent).join("/");
    const t = document.createElement("span"); t.textContent = it.label;
    const k = document.createElement("span"); k.className = "kind"; k.textContent = it.kind;
    a.append(t, k); li.append(a); ul.append(li);
  }
  sec.append(head, ul);
  box.append(sec);
}
</script>
</body>
</html>
