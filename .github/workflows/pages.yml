# Pubblica la cartella Unisa/ su GitHub Pages a ogni push su main.
# Se hai caricato o aggiornato un documento dei corsi, aggiunge da sola una notizia
# (per non crearla scrivi [no news] nel messaggio del commit).
# Dopo la pubblicazione manda la notifica delle notizie nuove (news.json) a chi le ha attivate.
name: Deploy Unisa su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # per salvare in news.json la notizia automatica
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      nuove: ${{ steps.novita.outputs.nuove }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # serve la cronologia per le date di aggiornamento
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: News automatica (documenti nuovi o aggiornati)
        id: auto
        run: python .github/scripts/news_auto.py
      - name: Verifica il calcolo della versione
        run: python -m unittest discover -s .github/tests -p "test_*.py"
      - name: Prepara il sito (barra, ricerca, immagini, uso offline)
        run: |
          pip install pillow
          python .github/scripts/build_site.py
      - name: Trova le notizie nuove (confronto con il sito online)
        id: novita
        run: python .github/scripts/news_nuove.py
      - name: Salva la news automatica nel repository
        if: steps.auto.outputs.creata == 'true'
        env:
          TITOLO: ${{ steps.auto.outputs.titolo }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add Unisa/news.json
          git commit -m "News automatica: $TITOLO [no news]"
          for i in 1 2 3; do
            git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "::warning::Non sono riuscito a salvare la news automatica in news.json (il sito è comunque pubblicato con la notizia)."
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  notifiche:
    needs: deploy
    if: needs.deploy.outputs.nuove != '' && needs.deploy.outputs.nuove != '[]'
    runs-on: ubuntu-latest
    concurrency:
      group: notifiche
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepara l'invio
        run: npm install --prefix .github/scripts --no-save --no-audit --no-fund firebase-admin@14
      - name: Manda le notifiche
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NUOVE: ${{ needs.deploy.outputs.nuove }}
        run: node .github/scripts/invia_notifiche.mjs
