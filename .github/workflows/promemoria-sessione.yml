name: Promemoria sessione
# Manda i promemoria della Sessione d'esami a chi li ha attivati, negli orari che ha scelto
# (a orari precisi o ogni tot ore, dalle 7 alle 23). Parte ogni ora dalle 5 alle 22 UTC, cioè dalle 7 alle 23 italiane
# sia con l'ora solare sia con quella legale: lo script guarda l'ora italiana e manda solo quelli di quell'ora.
# GitHub può ritardare un po' gli avvii programmati: di solito il promemoria arriva entro un quarto d'ora.
on:
  schedule:
    - cron: '7 5-22 * * *'
  workflow_dispatch:
    inputs:
      forza:
        description: "Manda subito il promemoria a tutti quelli che l'hanno attivo (prova)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: promemoria-sessione
  cancel-in-progress: false
jobs:
  promemoria:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix .github/scripts --no-save --no-audit --no-fund firebase-admin@14
      - name: Manda i promemoria della sessione
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORZA: ${{ inputs.forza && '--forza' || '' }}
        run: node .github/scripts/promemoria_sessione.mjs $FORZA
